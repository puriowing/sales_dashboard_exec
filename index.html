                        </select>
                        <ToggleButton options={[{ value: 'all', label: '全体' }, { value: 'personnel', label: '人件費' }, { value: 'other', label: '経費' }]} value={scope} onChange={setScope} />
                        <div className="flex gap-1 text-xs ml-auto flex-wrap">
                            {[['exp-summary', 'サマリー'], ['exp-hints', `削減ヒント（${hintList.length}）`], ['exp-heatmap', 'ヒートマップ'], ['exp-yoy', `${prevPeriod}期比較`], ['exp-nature', '費用の性質'], ['exp-theme', 'テーマ別'], ['exp-issues', `要確認（${issueCounts.red + issueCounts.amber}）`]].map(([id, l]) => <button key={id} onClick={() => jump(id)} className="px-2.5 py-1 rounded-full border border-gray-200 text-gray-600 hover:bg-blue-50 hover:text-blue-700">{l}</button>)}
                            <button onClick={onOpenReport} className="px-3 py-1 rounded-full bg-gray-800 text-white font-bold">役員会用1枚を出力</button>
                        </div>
                    </div>

                    <section id="exp-summary" className="space-y-4">

                            <XKpi label={`${curLabel}の実績`} value={XF.man(tAll.cur)} sub={`予算 ${XF.man(tAll.curBudget)}　${XF.manS(tAll.cur - tAll.curBudget)}（${XF.pct(tAll.curBudget ? tAll.cur / tAll.curBudget : null)}）`} tone={tAll.cur > tAll.curBudget ? 'bad' : 'good'} />
                            <XKpi label={`3月〜${curLabel}の累計`} value={XF.man(tAll.actualYTD)} sub={`予算 ${XF.man(tAll.budgetYTD)}　${XF.manS(tAll.actualYTD - tAll.budgetYTD)}（${XF.pct(tAll.budgetYTD ? tAll.actualYTD / tAll.budgetYTD : null)}）`} tone={tAll.actualYTD > tAll.budgetYTD ? 'bad' : 'good'} />
                            <XKpi label="通期の着地見込（残りは予算どおり）" value={XF.man(tAll.forecastPlan)} sub={`通期予算 ${XF.man(tAll.budgetFY)}　${XF.manS(tAll.forecastPlan - tAll.budgetFY)}`} tone={tAll.forecastPlan > tAll.budgetFY ? 'bad' : 'good'} />
                            <XKpi label="通期の着地見込（直近3か月のペース）" value={XF.man(tAll.forecastPace)} sub={`通期予算 ${XF.man(tAll.budgetFY)}　${XF.manS(tAll.forecastPace - tAll.budgetFY)}`} tone={tAll.forecastPace > tAll.budgetFY ? 'bad' : 'good'} />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {[['人件費', totals.personnel], ['経費', totals.other]].map(([l, t]) => (

                                    <div><p className="text-xs text-gray-500">{l}（累計）</p><p className="text-lg font-bold text-gray-800">{XF.man(t.actualYTD)} <span className="text-xs font-normal text-gray-500">／予算 {XF.man(t.budgetYTD)}</span></p></div>

                                <p className="text-[11px] text-gray-400">上の累計予算には、このうち {XF.man(totals.reserve.budgetYTD)} を含みます</p>

                                    <ul className="space-y-2.5">
                                        {over.slice(0, 7).map(a => {

                                                    {drivers.length > 0 && <p className="text-[11px] text-gray-500 mt-0.5 truncate">主な要因候補：{drivers.map(d => `${d.name} ${XF.man(d.ytd)}`).join('、')}</p>}

                                            );
                                        })}

                                )}
                                {under.length > 0 && <div className="mt-4 pt-3 border-t border-gray-100"><p className="text-xs font-bold text-gray-500 mb-1">予算を下回っている主な科目</p><p className="text-xs text-gray-600 leading-relaxed">{under.map(a => <span key={a.key} onClick={() => openAccount(a.key)} className="cursor-pointer hover:text-blue-700 mr-3 inline-block">{a.name} <span className="text-emerald-600 font-bold">{XF.manS(a.diffYTD)}</span></span>)}</p></div>}
                            </div>
                        </div>
                    </section>

                    <section id="exp-hints" className="bg-white p-6 rounded-xl card-shadow border-t-4 border-emerald-500">
                        <div className="flex flex-wrap justify-between items-end gap-2 mb-4">

                        </div>
                        {hintList.length === 0 ? <p className="text-sm text-gray-500 bg-gray-50 rounded p-4">今月は目立った削減の候補はありません。</p> : (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                                {hintList.map((h, k) => (
                                    <div key={k} className={`rounded-lg border p-4 flex flex-col ${h.urgent ? 'border-amber-300 bg-amber-50/50' : 'border-gray-200'}`}>
                                        <div className="flex items-start gap-2 mb-1">
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded flex-shrink-0 mt-0.5 ${h.urgent ? 'bg-amber-500 text-white' : 'bg-emerald-100 text-emerald-800'}`}>{h.tag}</span>
                                            <p className="text-sm font-bold text-gray-800">{h.title}</p>
                                        </div>
                                        <p className="text-xs text-gray-600 leading-relaxed flex-1">{h.detail}</p>
                                        <div className="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">
                                            <p className="text-xs text-gray-500">{h.saving != null ? <>効果の目安 <b className="text-emerald-700 text-sm">年 約{XF.man(h.saving)}</b>（{h.savingLabel}）</> : h.base ? <>対象の金額 年 約{XF.man(h.base)}</> : <>金額は前期の実績でご確認ください</>}</p>
                                            {h.accountKey && <button onClick={() => openAccount(h.accountKey)} className="text-xs text-blue-600 hover:underline flex-shrink-0 ml-2">中身を見る</button>}
                                        </div>
                                    </div>
                                ))}
                            </div>

                    </section>

                    <section id="exp-heatmap" className="bg-white p-6 rounded-xl card-shadow">
                        <div className="flex flex-wrap justify-between items-center gap-2 mb-3">
                            <div><h2 className="text-lg font-bold text-gray-800">科目別 予実ヒートマップ</h2><p className="text-xs text-gray-500">色が赤いほど予算超過。行を押すと明細が開きます。{curLabel}より先の月は予算額を薄く表示しています。</p></div>
                            <div className="flex gap-2"><ToggleButton options={[{ value: 'ratio', label: '予実比' }, { value: 'diff', label: '差額（万円）' }]} value={hmMode} onChange={setHmMode} /><ToggleButton options={[{ value: 'book', label: '予実表の順' }, { value: 'over', label: '超過の大きい順' }]} value={hmSort} onChange={setHmSort} /></div>

                let items = data;
                if (filterCat !== 'all') items = items.filter(w => w.category === filterCat);
                if (scheduleSearch) {
                    const q = scheduleSearch.toLowerCase();
                    items = items.filter(w => w.name.toLowerCase().includes(q) || w.distributor.toLowerCase().includes(q) || w.director.toLowerCase().includes(q) || w.cast.toLowerCase().includes(q));
                }
                return items;
            }, [data, filterCat, scheduleSearch]);
            const monthGroups = useMemo(() => {

                filtered.forEach(w => {
                    const m = w.releaseDate.match(/(\d{4})\/(\d{1,2})/);
                    if (!m) return;
                    const key = `${m[1]}/${m[2].padStart(2, '0')}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(w);

                return Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0]));

                const cats = ['邦画メジャー','洋画メジャー','邦画独立系','洋画独立系'];

                cats.forEach(c => { const items = data.filter(w => w.category === c); s[c] = { total: items.length, profit: items.filter(w => w.profit > 0).length }; });

                                    <div className="text-right"><div className={`text-lg font-bold text-${c.bg}-700`}>{catStats[c.key].profit}</div><div className={`text-[10px] text-${c.bg}-500`}>売上実績あり</div></div>

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                Papa.parse(file, { complete: (res) => { if (onLoadCsv) onLoadCsv(res.data, 'detect'); }, header: false, skipEmptyLines: true });
                e.target.value = '';
            };
            const { worksStats, totalStats } = useMemo(() => {
                if (!projectList || !worksMaster) return { worksStats: [], totalStats: { count: 0, profit: 0 } };
                const stats = {};
                projectList.forEach(p => {
                    const workId = p.managerId; if (!workId) return;
                    const workName = worksMaster[workId] || `(未登録: ${workId})`;
                    if (searchTerm && !(workName.toLowerCase().includes(searchTerm.toLowerCase()) || p.title.toLowerCase().includes(searchTerm.toLowerCase()))) return;

                    const client = p.client || '不明'; stats[workId].clients[client] = (stats[workId].clients[client] || 0) + p.profit;
                });

                items.sort((a, b) => b.profit - a.profit);

        function ClientDetailView({ clientName, projectList, monthlyLabels, onBack, lastYearStats, lastYearProjectList }) {

                const projects = (projectList || []).filter(p => p.client === clientName);

                const profit = projects.reduce((s, p) => s + p.profit, 0);
                const monthly = Array(12).fill(0).map(() => ({ sales: 0, profit: 0 }));
                const jobs = {};
                projects.forEach(p => {
                    const jCat = Utils.getJobCategory(p.job); if (!jobs[jCat]) jobs[jCat] = { sales: 0, profit: 0 }; jobs[jCat].sales += p.sales; jobs[jCat].profit += p.profit;
                    const idx = Utils.getFiscalMonthIndex(p.date); if (idx >= 0 && idx < 12) { monthly[idx].sales += p.sales; monthly[idx].profit += p.profit; }
                });
                return { sales, profit, margin: sales > 0 ? (profit/sales*100) : 0, jobs, monthly, projects };

                const source = historyMode === 'current' ? projectList : lastYearProjectList;

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 bg-white p-6 rounded-xl card-shadow"><h3 className="text-lg font-bold text-gray-800 mb-4">職種別 粗利構成比</h3><div className="h-64"><ChartComponent type="doughnut" data={{ labels: Object.keys(stats.jobs), datasets: [{ data: Object.values(stats.jobs).map(j => j.profit), backgroundColor: Object.keys(stats.jobs).map(k => C.CAT_COLORS[k] || '#cbd5e1') }] }} options={{ plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => { let sum=0; c.chart.data.datasets[0].data.forEach(d=>sum+=d); const pct=sum>0?(c.raw/sum*100).toFixed(1):'0.0'; return `${c.label}: ${Utils.formatYen(c.raw)} (${pct}%)`; } } } } }} /></div></div>
                         <div className="lg:col-span-2 bg-white p-6 rounded-xl card-shadow"><h3 className="text-lg font-bold text-gray-800 mb-4">月次 粗利・昨対比推移</h3><div className="h-64"><ChartComponent type="bar" data={{ labels: monthlyLabels, datasets: [ { type: 'line', label: '昨対比', data: stats.monthly.map((m, i) => lyData.monthly[i].profit > 0 ? (m.profit / lyData.monthly[i].profit * 100) : 0), borderColor: '#ef4444', backgroundColor: '#ef4444', borderWidth: 2, fill: false, yAxisID: 'y1', order: 1 }, { type: 'bar', label: '粗利', data: stats.monthly.map(m => m.profit), backgroundColor: C.COLORS.profit, yAxisID: 'y', order: 2 } ] }} options={{ scales: { y: { type: 'linear', position: 'left', title: { display: true, text: '粗利 (円)' }, ticks: { callback: v => Utils.formatYen(v) } }, y1: { type: 'linear', position: 'right', title: { display: true, text: '昨対比 (%)' }, grid: { display: false }, ticks: { callback: v => v + '%' } } } }} /></div></div>

                    return stats;
                };

                const allStats = createStats();
                const div1Stats = createStats();
                const div2Stats = createStats();
                const div3Stats = createStats();

                const filtered = (projectList || []).filter(p =>
                    (monthFilter === 'all' || Utils.getFiscalMonthIndex(p.date) === Number(monthFilter)) &&
                    (divFilter === 'all' || p.div.includes(divFilter))
                );

                filtered.forEach(p => {
                    const cat = Utils.getJobCategory(p.job);
                    const mIdx = Utils.getFiscalMonthIndex(p.date);

                    // 全社統計
                    if (allStats[cat]) {
                        allStats[cat].sales += p.sales;
                        allStats[cat].profit += p.profit;
                        allStats[cat].count += 1;
                        if (mIdx >= 0 && mIdx < 12) {
                            allStats[cat].monthly[mIdx].sales += p.sales;
                            allStats[cat].monthly[mIdx].profit += p.profit;
                        }
                    }

                    // 事業部別統計
                    if (p.div.includes('1') && div1Stats[cat]) {
                        div1Stats[cat].sales += p.sales;
                        div1Stats[cat].profit += p.profit;
                        div1Stats[cat].count += 1;
                    }
                    if (p.div.includes('2') && div2Stats[cat]) {
                        div2Stats[cat].sales += p.sales;
                        div2Stats[cat].profit += p.profit;
                        div2Stats[cat].count += 1;
                    }
                    if (p.div.includes('3') && div3Stats[cat]) {
                        div3Stats[cat].sales += p.sales;
                        div3Stats[cat].profit += p.profit;
                        div3Stats[cat].count += 1;
                    }
                });

                return {
                    jobStats: Object.values(allStats).map(s => ({ ...s, margin: s.sales > 0 ? (s.profit / s.sales * 100) : 0 })).sort((a, b) => b.profit - a.profit),

        const TOHO_GROUP_CLIENTS = ['東宝', 'TOHOマーケティング', 'TOHO マーケティング', '東宝東和', '東和ピクチャーズ', '東和ﾋﾟｸﾁｬｰｽﾞ'];
        const normalizeTohoName = (str) => str.replace(/[ﾋﾟｸﾁｬｰｽﾞ]/g, (m) => ({ 'ﾋ': 'ヒ', 'ﾟ': '゜', 'ｸ': 'ク', 'ﾁ': 'チ', 'ｬ': 'ャ', 'ｰ': 'ー', 'ｽ': 'ス', 'ﾞ': '゛' }[m] || m));
        const isTohoGroupClient = (c) => TOHO_GROUP_CLIENTS.some(name => {
            if (c === name || normalizeTohoName(c) === normalizeTohoName(name)) return true;
            if (normalizeTohoName(c).includes(normalizeTohoName(name)) || normalizeTohoName(name).includes(normalizeTohoName(c))) return true;
            return c.includes(name) || name.includes(c);
        });

        function ClientAnalysisPage({ projectList, monthlyData, lastYearClientStats, lastYearProjectList }) {
            const [monthFilter, setMonthFilter] = useState('all');
            const [divFilter, setDivFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedClient, setSelectedClient] = useState(null);
            const [selectedJobCategory, setSelectedJobCategory] = useState(C.CATS[0]);

            const { clientStats, totalStats, tiers, allClientNames, jobCategoryStats, tierCountData, tierProfitData, tohoComparison } = useMemo(() => {
                const stats = {}, allNames = new Set(), jobClientStats = {}; C.CATS.forEach(j => jobClientStats[j] = {});
                (projectList || []).forEach(p => { if(p.client) allNames.add(p.client); });
                const filtered = (projectList || []).filter(p => (monthFilter === 'all' || Utils.getFiscalMonthIndex(p.date) === Number(monthFilter)) && (divFilter === 'all' || p.div.includes(divFilter)) && (!searchTerm || (p.client && p.client.toLowerCase().includes(searchTerm.toLowerCase()))));
                let gSales = 0, gProfit = 0;
                filtered.forEach(p => {
                    const c = p.client || '不明'; if (!stats[c]) stats[c] = { name: c, sales: 0, profit: 0, count: 0, jobs: {} };
                    stats[c].sales += p.sales; stats[c].profit += p.profit; stats[c].count += 1; gSales += p.sales; gProfit += p.profit;
                    const j = Utils.getJobCategory(p.job); stats[c].jobs[j] = (stats[c].jobs[j] || 0) + p.sales;
                    const tc = C.CATS.includes(j) ? j : 'その他案件'; if (!jobClientStats[tc]) jobClientStats[tc] = {}; if (!jobClientStats[tc][c]) jobClientStats[tc][c] = { sales: 0, profit: 0, count: 0 };
                    jobClientStats[tc][c].sales += p.sales; jobClientStats[tc][c].profit += p.profit; jobClientStats[tc][c].count += 1;
                });
                let cArr = Object.values(stats).map(c => ({ ...c, margin: c.sales > 0 ? (c.profit/c.sales*100) : 0, mainJob: Object.entries(c.jobs).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'その他', lyProfit: lastYearClientStats?.[c.name]?.profit || 0, yoy: (lastYearClientStats?.[c.name]?.profit > 0) ? (c.profit / lastYearClientStats[c.name].profit * 100) : 0, unitPrice: c.count > 0 ? c.sales / c.count : 0 }));
                cArr.sort((a,b) => b.profit - a.profit);
                let curCum = 0; const t1=[], t2=[], t3=[];
                cArr.forEach(c => { curCum += c.profit; const r = gProfit > 0 ? (curCum/gProfit) : 0; if (r <= 0.80) { t1.push(c); c.tier = 1; } else if (r <= 0.95) { t2.push(c); c.tier = 2; } else { t3.push(c); c.tier = 3; } });
                const tierShares = [{ name: 'Tier 1', value: t1.length, profit: t1.reduce((s,c)=>s+c.profit,0) }, { name: 'Tier 2', value: t2.length, profit: t2.reduce((s,c)=>s+c.profit,0) }, { name: 'Tier 3', value: t3.length, profit: t3.reduce((s,c)=>s+c.profit,0), share: gProfit > 0 ? t3.reduce((s,c)=>s+c.profit,0)/gProfit*100 : 0 }];
                
                // 東宝グループとそれ以外の比較データを計算
                const tohoGroupStats = { sales: 0, profit: 0, count: 0, clientCount: 0, monthly: Array(12).fill(0).map(() => ({ sales: 0, profit: 0 })) };
                const otherStats = { sales: 0, profit: 0, count: 0, clientCount: 0, monthly: Array(12).fill(0).map(() => ({ sales: 0, profit: 0 })) };
                const tohoClients = new Set();
                const otherClients = new Set();
                
                filtered.forEach(p => {
                    const c = (p.client || '不明').trim();
                    const isToho = isTohoGroupClient(c);
                    const monthIdx = Utils.getFiscalMonthIndex(p.date);
                    
                    if (isToho) {
                        tohoGroupStats.sales += p.sales;
                        tohoGroupStats.profit += p.profit;
                        tohoGroupStats.count += 1;
                        tohoClients.add(c);
                        if (monthIdx >= 0 && monthIdx < 12) {
                            tohoGroupStats.monthly[monthIdx].sales += p.sales;
                            tohoGroupStats.monthly[monthIdx].profit += p.profit;

                            otherStats.monthly[monthIdx].profit += p.profit;

                tohoGroupStats.clientCount = tohoClients.size;
                otherStats.clientCount = otherClients.size;
                
                const tohoMargin = tohoGroupStats.sales > 0 ? (tohoGroupStats.profit / tohoGroupStats.sales * 100) : 0;
                const otherMargin = otherStats.sales > 0 ? (otherStats.profit / otherStats.sales * 100) : 0;
                
                const tohoComparison = {
                    toho: {
                        ...tohoGroupStats,
                        margin: tohoMargin,
                        share: gProfit > 0 ? (tohoGroupStats.profit / gProfit * 100) : 0

                    other: {

                        margin: otherMargin,
                        share: gProfit > 0 ? (otherStats.profit / gProfit * 100) : 0

                                backgroundColor: 'rgba(148, 163, 184, 0.1)',
                                tension: 0.4

            }, [projectList, monthFilter, divFilter, searchTerm, lastYearClientStats, monthlyData.labels]);

            const selectedJobRanking = useMemo(() => {
                const clients = jobCategoryStats[selectedJobCategory] || {};
                const ranking = Object.entries(clients).map(([name, s]) => ({ name, ...s, margin: s.sales > 0 ? s.profit/s.sales*100 : 0 })).sort((a, b) => b.profit - a.profit).slice(0, 10);
                return { items: ranking, chartData: { labels: ranking.map(r => r.name.length > 8 ? r.name.substring(0,8)+'...' : r.name), datasets: [{ label: '粗利', data: ranking.map(r => r.profit), backgroundColor: C.CAT_COLORS[selectedJobCategory], borderRadius: 4 }] } };
            }, [jobCategoryStats, selectedJobCategory]);

            if (selectedClient) return <ClientDetailView clientName={selectedClient} projectList={projectList} monthlyLabels={monthlyData.labels} onBack={() => setSelectedClient(null)} lastYearStats={lastYearClientStats} lastYearProjectList={lastYearProjectList} />;

            const cols = [
                { key: 'tier', label: 'Tier', align: 'center', sortable: true, width: 'w-12', render: (c)=><span className={`px-2 py-1 rounded text-xs font-bold text-white ${c.tier===1?'bg-blue-800':c.tier===2?'bg-blue-500':'bg-gray-400'}`}>{c.tier}</span> },

                { key: 'mainJob', label: '主要職種', sortable: true, width: 'w-24', render: (c)=><span className="bg-gray-100 px-2 py-1 rounded">{c.mainJob}</span>, className: 'text-xs text-gray-500' },
                { key: 'sales', label: '売上', align: 'right', sortable: true, width: 'w-[140px]', noTruncate: true, render: (c)=>Utils.formatYen(c.sales), className: 'text-gray-600 font-mono whitespace-nowrap' },
                { key: 'profit', label: '粗利', align: 'right', sortable: true, width: 'w-[140px]', noTruncate: true, render: (c)=>Utils.formatYen(c.profit), className: (c)=>c.profit>=10000000 ? 'text-indigo-600 font-bold font-mono whitespace-nowrap' : 'text-gray-600 font-bold font-mono whitespace-nowrap' },

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

                        <div className="bg-white p-5 rounded-xl card-shadow"><h3 className="text-xs font-medium text-gray-500 mb-1">合計</h3><div className="flex items-end gap-2"><span className="text-lg font-bold text-gray-800">{totalStats.count}社</span></div><div className="text-xl font-bold text-green-600">{Utils.formatYen(totalStats.profit)}</div></div>
                    </div>
                    <div className="bg-white p-6 rounded-xl card-shadow mb-6"><div className="flex justify-between items-center mb-4"><h2 className="text-lg font-bold text-gray-800">Tier別 構成比 (社数 vs 粗利)</h2></div><div className="grid grid-cols-1 md:grid-cols-2 gap-8"><div><h4 className="text-xs text-center font-bold text-gray-500 mb-2">社数構成比</h4><div className="h-64"><ChartComponent type="doughnut" data={tierCountData} options={{ plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => `${c.label}: ${c.raw}社 (${(c.raw/totalStats.count*100).toFixed(1)}%)` } } } }} /></div></div><div><h4 className="text-xs text-center font-bold text-gray-500 mb-2">粗利構成比</h4><div className="h-64"><ChartComponent type="doughnut" data={tierProfitData} options={{ plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => `${c.label}: ${Utils.formatYen(c.raw)} (${(c.raw/totalStats.profit*100).toFixed(1)}%)` } } } }} /></div></div></div>                    </div>
                    <div className="bg-white p-4 rounded-xl card-shadow mb-6">
                        <h2 className="text-base font-bold text-gray-800 mb-4">東宝グループ vs その他 比較分析</h2>

                </div>

                     <div className="flex space-x-1 bg-white p-1 rounded-xl shadow-sm border border-gray-200 w-fit mx-auto md:mx-0">{divisions.map(d => (<button key={d.id} onClick={() => setCurrentDiv(d.id)} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all ${currentDiv === d.id ? 'bg-blue-600 text-white shadow-md' : 'text-gray-500 hover:bg-gray-100'}`}>{d.label}</button>))}</div>
                     <DivisionPage key={currentDiv} divKey={currentDiv} divLabel={divisions.find(d => d.id === currentDiv)?.label ?? '事業部'} color={C.COLORS.sales} {...props} />
                </div>
            );
        }

        function SummaryReportPage({ monthlyData, projectList, lastYearProjectList, worksMaster, divisionMonthlyData, currentPeriod }) {
            const lastDataMonth = useMemo(() => { const a = monthlyData.actual || []; for (let i = a.length - 1; i >= 0; i--) { if (a[i] > 0) return i; } return 0; }, [monthlyData.actual]);
            const [startMonth, setStartMonth] = useState(lastDataMonth);
            const [endMonth, setEndMonth] = useState(lastDataMonth);
            useEffect(() => { setStartMonth(lastDataMonth); setEndMonth(lastDataMonth); }, [lastDataMonth]);
            const reportRef = useRef(null);
            const [isGenerating, setIsGenerating] = useState(false);

            const safeEnd = Math.max(startMonth, endMonth);

            const judge = useCallback((budgetPct, yoyPct) => {
                const b = budgetPct || 0, y = yoyPct || 0;
                if (b >= 110 && y >= 105) return { label: 'EXCELLENT', color: '#059669', bg: '#d1fae5', border: '#059669', stars: 5 };
                if (b >= 100 && y >= 100) return { label: 'GOOD', color: '#2563eb', bg: '#dbeafe', border: '#2563eb', stars: 4 };
                if (b >= 90 || y >= 95) return { label: 'AVERAGE', color: '#d97706', bg: '#fef3c7', border: '#d97706', stars: 3 };
                return { label: 'NOT GOOD', color: '#dc2626', bg: '#fee2e2', border: '#dc2626', stars: 2 };
            }, []);

            const rd = useMemo(() => {
                const from = startMonth, to = safeEnd;
                const labels = monthlyData.labels || [];
                const rangeSum = (arr) => (arr || []).slice(from, to + 1).reduce((s, v) => s + (v || 0), 0) * 1000;
                const fullArr = (arr) => (arr || []).map(v => (v || 0) * 1000);
                const isSingle = from === to;
                const periodLabel = isSingle ? labels[from] : `${labels[from]}〜${labels[to]}`;

                const sales = rangeSum(monthlyData.actual), salesB = rangeSum(monthlyData.budget);
                const profit = rangeSum(monthlyData.actualProfit), profitB = rangeSum(monthlyData.budgetProfit);
                const exp = rangeSum(monthlyData.expenses), expB = rangeSum(monthlyData.expensesBudget);
                const lySales = rangeSum(monthlyData.lastYear), lyProfit = rangeSum(monthlyData.lastYearProfit);
                const op = profit - exp, opB = profitB - expB;

                const bPct = salesB > 0 ? sales/salesB*100 : 0;
                const pBPct = profitB > 0 ? profit/profitB*100 : 0;
                const yoyS = lySales > 0 ? sales/lySales*100 : 0;
                const yoyP = lyProfit > 0 ? profit/lyProfit*100 : 0;
                const overall = judge(pBPct, yoyP);

                const mSales = fullArr(monthlyData.actual), mBudget = fullArr(monthlyData.budget);
                const mProfit = fullArr(monthlyData.actualProfit), mProfitB = fullArr(monthlyData.budgetProfit);
                const mLY = fullArr(monthlyData.lastYear), mLYP = fullArr(monthlyData.lastYearProfit);

                const divs = ['div1', 'div2', 'div3'].map((dk, i) => {
                    const dd = divisionMonthlyData[dk] || {};
                    const s = rangeSum(dd.actual), p = rangeSum(dd.profit);
                    const sB = rangeSum(dd.budget), pB = rangeSum(dd.budgetProfit);
                    const bP = pB > 0 ? p/pB*100 : 0;
                    return { label: `第${i+1}事業部`, sales: s, profit: p, salesB: sB, profitB: pB, margin: s > 0 ? p/s*100 : 0, share: profit > 0 ? p/profit*100 : 0, budgetPct: bP, rating: judge(bP, 100) };
                });

                const mProjects = (projectList || []).filter(p => { const idx = Utils.getFiscalMonthIndex(p.date); return idx >= from && idx <= to; });
                const aggregate = (keyFn) => { const m = {}; mProjects.forEach(p => { const k = keyFn(p); if (!m[k.key]) m[k.key] = { name: k.name, sales: 0, profit: 0, count: 0 }; m[k.key].sales += p.sales; m[k.key].profit += p.profit; m[k.key].count++; }); return Object.values(m).sort((a, b) => b.profit - a.profit); };
                const topClients = aggregate(p => ({ key: p.client || '不明', name: p.client || '不明' })).slice(0, 10);
                const topWorks = aggregate(p => ({ key: p.managerId || p.title, name: (worksMaster && worksMaster[p.managerId]) || p.title })).slice(0, 10);
                const jobs = aggregate(p => { const c = Utils.getJobCategory(p.job); return { key: c, name: c }; });
                const topProjects = [...mProjects].sort((a, b) => b.sales - a.sales).slice(0, 15);
                const tohoCmp = [true, false].map(isT => {
                    const ps = mProjects.filter(p => isTohoGroupClient((p.client || '不明').trim()) === isT);
                    const s = ps.reduce((t, p) => t + p.sales, 0), pr = ps.reduce((t, p) => t + p.profit, 0);
                    return { name: isT ? '東宝グループ' : 'その他', color: isT ? '#3B82F6' : '#94A3B8', sales: s, profit: pr, count: ps.length,
                        clientCount: new Set(ps.map(p => (p.client || '不明').trim())).size, margin: s > 0 ? pr/s*100 : 0 };
                });
                const cmpProfitTotal = tohoCmp[0].profit + tohoCmp[1].profit;
                tohoCmp.forEach(t => { t.share = cmpProfitTotal > 0 ? t.profit/cmpProfitTotal*100 : 0; });

                const clientKey = (p) => (p.client || '不明').trim();
                const allClients = aggregate(p => ({ key: clientKey(p), name: clientKey(p) }));
                const clientProfitTotal = allClients.reduce((t, c) => t + c.profit, 0);
                const tierList = [[], [], []];
                let cum = 0;
                allClients.forEach(c => { cum += c.profit; const r = clientProfitTotal > 0 ? cum/clientProfitTotal : 0; tierList[r <= 0.80 ? 0 : r <= 0.95 ? 1 : 2].push(c); });
                const tiers = tierList.map((list, i) => {
                    const pr = list.reduce((t, c) => t + c.profit, 0);
                    return { name: `Tier ${i+1}`, sub: ['Core', 'Grow', 'Tail'][i], color: C.TIER[i+1], textColor: ['#1e3a8a', '#2563eb', '#64748b'][i], count: list.length, profit: pr,
                        countShare: allClients.length > 0 ? list.length/allClients.length*100 : 0, profitShare: clientProfitTotal > 0 ? pr/clientProfitTotal*100 : 0,
                        top: list.slice(0, 3).map(c => c.name) };
                });

                const lyProjects = (lastYearProjectList || []).filter(p => { const idx = Utils.getFiscalMonthIndex(p.date); return idx >= from && idx <= to; });
                const hasLYProjects = lyProjects.length > 0;
                const lyClientMap = {};
                lyProjects.forEach(p => { const k = clientKey(p); if (!lyClientMap[k]) lyClientMap[k] = { name: k, sales: 0, profit: 0, count: 0 }; lyClientMap[k].sales += p.sales; lyClientMap[k].profit += p.profit; lyClientMap[k].count++; });
                const curClientMap = {};
                allClients.forEach(c => { curClientMap[c.name] = c; });
                const newClients = allClients.filter(c => !lyClientMap[c.name]);
                const lostClients = Object.values(lyClientMap).filter(c => !curClientMap[c.name]).sort((a, b) => b.profit - a.profit);
                const clientChange = {
                    newList: newClients, lostList: lostClients,
                    newProfit: newClients.reduce((t, c) => t + c.profit, 0), lostProfit: lostClients.reduce((t, c) => t + c.profit, 0),
                    continuing: allClients.length - newClients.length
                };

                const lyTotalProfit = lyProjects.reduce((t, p) => t + p.profit, 0);
                const curTotalProfit = mProjects.reduce((t, p) => t + p.profit, 0);
                const jobDelta = C.CATS.map(cat => {
                    const cur = mProjects.filter(p => Utils.getJobCategory(p.job) === cat).reduce((t, p) => t + p.profit, 0);
                    const ly = lyProjects.filter(p => Utils.getJobCategory(p.job) === cat).reduce((t, p) => t + p.profit, 0);
                    return { name: cat, cur, ly, delta: cur - ly };
                });
                const clientDelta = Array.from(new Set([...Object.keys(lyClientMap), ...Object.keys(curClientMap)])).map(k => {
                    const cur = curClientMap[k] ? curClientMap[k].profit : 0, ly = lyClientMap[k] ? lyClientMap[k].profit : 0;
                    return { name: k, cur, ly, delta: cur - ly };
                });
                const yoyDrivers = {
                    lyTotal: lyTotalProfit, curTotal: curTotalProfit, jobDelta,
                    up: clientDelta.filter(c => c.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 5),
                    down: clientDelta.filter(c => c.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 5)
                };

                const metricRatings = [
                    { name: '売上', bPct: bPct, yPct: yoyS, rating: judge(bPct, yoyS) },
                    { name: '粗利', bPct: pBPct, yPct: yoyP, rating: judge(pBPct, yoyP) }
                ];

                return { periodLabel, from, to, labels, isSingle,
                    sales, salesB, profit, profitB, exp, expB, op, opB, lySales, lyProfit,
                    bPct, pBPct, yoyS, yoyP, overall, metricRatings,
                    mSales, mBudget, mProfit, mProfitB, mLY, mLYP,
                    divs, topClients, topWorks, jobs, topProjects, tohoCmp, tiers, clientCount: allClients.length, hasLYProjects, clientChange, yoyDrivers, count: mProjects.length };
            }, [startMonth, safeEnd, monthlyData, projectList, lastYearProjectList, worksMaster, divisionMonthlyData, judge]);

            const generatePDF = async () => {
                const el = reportRef.current; if (!el) return;
                setIsGenerating(true);
                try {
                    const { jsPDF } = window.jspdf;
                    const elRect = el.getBoundingClientRect();
                    const sectionBreaks = [];
                    for (let i = 0; i < el.children.length; i++) {
                        const cr = el.children[i].getBoundingClientRect();
                        sectionBreaks.push(cr.top - elRect.top);
                    }
                    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', logging: false });
                    const scale = canvas.width / el.offsetWidth;
                    const scaledBreaks = sectionBreaks.map(b => Math.round(b * scale)).filter(b => b > 0);

                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pW = pdf.internal.pageSize.getWidth(), pH = pdf.internal.pageSize.getHeight();
                    const mg = 8, cW = pW - mg*2, cH = pH - mg*2;
                    const pxPerPage = Math.floor(canvas.width * cH / cW);

                    const pageStarts = [0];
                    let cursor = 0;
                    while (cursor + pxPerPage < canvas.height) {
                        const target = cursor + pxPerPage;
                        let best = -1;
                        for (const b of scaledBreaks) {
                            if (b > cursor && b <= target) best = b;
                        }
                        const next = best > cursor ? best : target;
                        pageStarts.push(next);
                        cursor = next;
                    }

                    for (let i = 0; i < pageStarts.length; i++) {
                        if (i > 0) pdf.addPage();
                        const srcY = pageStarts[i];
                        const srcH = (i < pageStarts.length - 1 ? pageStarts[i+1] : canvas.height) - srcY;
                        if (srcH <= 0) continue;
                        const pgC = document.createElement('canvas');
                        pgC.width = canvas.width; pgC.height = srcH;
                        pgC.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);
                        pdf.addImage(pgC.toDataURL('image/jpeg', 0.95), 'JPEG', mg, mg, cW, srcH * cW / canvas.width);
                    }
                    pdf.save(`サマリーレポート_${rd.periodLabel.replace('〜', '-')}.pdf`);
                } catch(e) { console.error('PDF generation error:', e); alert('PDF生成中にエラーが発生しました。'); }
                setIsGenerating(false);
            };

            const fY = Utils.formatYen;
            const pct = (a, b) => b > 0 ? (a/b*100).toFixed(1)+'%' : '-';
            const gapClr = (a, b, inv) => inv ? (a-b > 0 ? '#ef4444' : '#10b981') : (a-b >= 0 ? '#10b981' : '#ef4444');
            const achClr = (a, b, inv) => { if (b <= 0) return '#6b7280'; const r = a/b*100; return inv ? (r > 100 ? '#ef4444' : '#10b981') : (r >= 100 ? '#10b981' : r >= 90 ? '#f59e0b' : '#ef4444'); };

            const RS = {
                h2: { fontSize: '14px', fontWeight: '700', color: '#1e40af', borderLeft: '4px solid #3b82f6', paddingLeft: '8px', margin: '0 0 10px 0' },
                tbl: { width: '100%', borderCollapse: 'collapse', fontSize: '12px' },
                thL: { padding: '6px 10px', textAlign: 'left', borderBottom: '2px solid #cbd5e1', fontWeight: '700', fontSize: '11px', backgroundColor: '#f1f5f9', color: '#475569' },
                th: { padding: '6px 10px', textAlign: 'right', borderBottom: '2px solid #cbd5e1', fontWeight: '700', fontSize: '11px', backgroundColor: '#f1f5f9', color: '#475569' },
                tdL: { padding: '5px 10px', textAlign: 'left', borderBottom: '1px solid #e2e8f0', fontSize: '12px', fontWeight: '600' },
                td: { padding: '5px 10px', textAlign: 'right', borderBottom: '1px solid #e2e8f0', fontSize: '12px', fontFamily: "'Courier New', monospace" },
                sec: { marginBottom: '22px' }
            };

            const ReportTable = ({ headers, rows }) => (
                <table style={RS.tbl}>
                    <thead><tr>{headers.map((h, i) => <th key={i} style={i === 0 ? RS.thL : RS.th}>{h}</th>)}</tr></thead>
                    <tbody>{rows.map((row, ri) => (
                        <tr key={ri} style={ri % 2 === 1 ? { backgroundColor: '#fafbfc' } : {}}>
                            {row.map((cell, ci) => <td key={ci} style={ci === 0 ? { ...RS.tdL, ...(cell.style || {}) } : { ...RS.td, ...(cell.style || {}) }}>{cell.v !== undefined ? cell.v : cell}</td>)}
                        </tr>
                    ))}</tbody>
                </table>
            );

            const RatingBadge = ({ rating, size = 'large' }) => {
                if (size !== 'large') {
                    const w = rating.label.length * 7 + 14;
                    return (<svg width={w} height="18" style={{ display: 'inline-block', verticalAlign: 'middle' }}><rect x="0" y="1" width={w} height="16" rx="4" fill={rating.color}/><text x={w/2} y="12" textAnchor="middle" fontSize="9" fontWeight="800" fill="#fff" fontFamily="Arial, Helvetica, sans-serif">{rating.label}</text></svg>);
                }
                return null;
            };

            const SVGMonthlyChart = ({ actArr, budgetArr, lyArr, labels, from, to, height = 190, title, color = '#3b82f6' }) => {
                const W = 680, H = height, ML = 60, MR = 15, MT = 30, MB = 32;
                const cW = W - ML - MR, cH = H - MT - MB;
                const n = labels.length;
                const allV = [...actArr, ...budgetArr, ...(lyArr || [])].filter(v => v > 0);
                const maxV = allV.length > 0 ? Math.max(...allV) * 1.15 : 1;
                const gap = cW / n, bW = Math.min(gap * 0.55, 36);
                const yScale = (v) => MT + cH - (v / maxV) * cH;
                const gridLines = [0, 0.25, 0.5, 0.75, 1];
                const hasLY = lyArr && lyArr.some(v => v > 0);
                const fmtAxis = (v) => { if (v >= 1000000000) return (v/1000000000).toFixed(1)+'B'; if (v >= 1000000) return (v/1000000).toFixed(0)+'M'; if (v >= 1000) return (v/1000).toFixed(0)+'K'; return v.toString(); };
                return (
                    <svg width={W} height={H} style={{ display: 'block' }}>
                        <text x={W/2} y={14} textAnchor="middle" fontSize="11" fontWeight="700" fill="#334155">{title}</text>
                        {gridLines.map((p, i) => { const y = yScale(maxV * p); return (<g key={i}><line x1={ML} y1={y} x2={W-MR} y2={y} stroke="#f1f5f9" strokeWidth="1"/><text x={ML-6} y={y+3} textAnchor="end" fontSize="9" fill="#94a3b8">{fmtAxis(Math.round(maxV*p))}</text></g>); })}
                        {actArr.map((v, i) => { const x = ML + i * gap + (gap - bW)/2; const bH = Math.max((v / maxV) * cH, 0); const inRange = i >= from && i <= to; return (<rect key={i} x={x} y={yScale(v)} width={bW} height={bH} fill={color} rx="2" opacity={inRange ? 0.9 : 0.25}/>); })}
                        {budgetArr.length > 1 && <polyline points={budgetArr.map((v, i) => `${ML + i*gap + gap/2},${yScale(v)}`).join(' ')} fill="none" stroke="#1e293b" strokeWidth="2" strokeDasharray="6,3" opacity="0.7"/>}
                        {hasLY && <polyline points={lyArr.map((v, i) => `${ML + i*gap + gap/2},${yScale(v)}`).join(' ')} fill="none" stroke="#94a3b8" strokeWidth="1.5" opacity="0.6"/>}
                        {labels.map((l, i) => { const inRange = i >= from && i <= to; return (<text key={i} x={ML + i*gap + gap/2} y={H-8} textAnchor="middle" fontSize="9" fill={inRange ? '#1e293b' : '#cbd5e1'} fontWeight={inRange ? '700' : '400'}>{l}</text>); })}
                        {from <= to && <rect x={ML + from * gap} y={MT} width={(to - from + 1) * gap} height={cH} fill={color} opacity="0.04" rx="4"/>}
                        <rect x={ML} y={18} width={8} height={8} fill={color} rx="1" opacity="0.9"/><text x={ML+12} y={25} fontSize="8" fill="#334155">実績</text>
                        <line x1={ML+50} y1={22} x2={ML+66} y2={22} stroke="#1e293b" strokeWidth="2" strokeDasharray="4,2"/><text x={ML+70} y={25} fontSize="8" fill="#334155">予算</text>
                        {hasLY && <><line x1={ML+100} y1={22} x2={ML+116} y2={22} stroke="#94a3b8" strokeWidth="1.5"/><text x={ML+120} y={25} fontSize="8" fill="#334155">昨期</text></>}
                    </svg>
                );
            };

            const SVGDonut = ({ data, colors, labelArr, size = 140 }) => {
                const total = data.reduce((s, v) => s + v, 0);
                if (total === 0) return <svg width={size+160} height={Math.max(size, labelArr.length*18+10)}><text x={size/2} y={size/2} textAnchor="middle" fontSize="11" fill="#94a3b8">データなし</text></svg>;
                const cx = size/2, cy = size/2, R = size*0.42, r = size*0.24;
                let angle = -Math.PI/2;
                const arcs = data.map((val, i) => {
                    const a = Math.min((val/total)*Math.PI*2, Math.PI*2 - 0.0001);
                    const sa = angle, ea = angle + a;
                    const cos = Math.cos, sin = Math.sin;
                    const lg = a > Math.PI ? 1 : 0;
                    const d = `M${cx+R*cos(sa)},${cy+R*sin(sa)} A${R},${R} 0 ${lg},1 ${cx+R*cos(ea)},${cy+R*sin(ea)} L${cx+r*cos(ea)},${cy+r*sin(ea)} A${r},${r} 0 ${lg},0 ${cx+r*cos(sa)},${cy+r*sin(sa)} Z`;
                    angle = ea;
                    return { d, pct: (val/total*100).toFixed(1) };
                });
                return (
                    <svg width={size+170} height={Math.max(size, labelArr.length*18+10)} style={{ display: 'block' }}>
                        {arcs.map((arc, i) => <path key={i} d={arc.d} fill={colors[i]}/>)}
                        {labelArr.map((l, i) => (
                            <g key={i} transform={`translate(${size+8}, ${i*18+12})`}>
                                <rect width="10" height="10" fill={colors[i]} rx="2"/><text x="14" y="9" fontSize="10" fill="#334155">{l} ({arcs[i]?.pct}%)</text>
                            </g>
                        ))}
                    </svg>
                );
            };

            const SVGHorizontalBars = ({ items, width = 680, barH = 20 }) => {
                const maxV = items.length > 0 ? Math.max(...items.map(it => Math.abs(it.value)), 1) : 1;
                const H = items.length * (barH + 6) + 8;
                const lW = 130, vW = 90, barArea = width - lW - vW - 10;
                return (
                    <svg width={width} height={H} style={{ display: 'block' }}>
                        {items.map((it, i) => {
                            const y = i * (barH + 6) + 4;
                            const bW = maxV > 0 ? (it.value / maxV) * barArea : 0;
                            return (
                                <g key={i}>
                                    <text x={lW-6} y={y+barH/2+4} textAnchor="end" fontSize="10" fill="#334155" fontWeight={i<3?'700':'400'}>{it.label.length > 16 ? it.label.substring(0,16)+'…' : it.label}</text>
                                    <rect x={lW} y={y} width={Math.max(bW, 2)} height={barH} fill={it.color || '#3b82f6'} rx="3" opacity={i<3?0.9:0.65}/>
                                    <text x={lW+bW+6} y={y+barH/2+4} fontSize="9" fill="#475569" fontFamily="'Courier New', monospace">{fY(it.value)}</text>
                                </g>
                            );
                        })}
                    </svg>
                );
            };

            const fAxis = (v) => { const a = Math.abs(v), sg = v < 0 ? '-' : ''; if (a >= 100000000) return sg + (a/100000000).toFixed(1) + '億'; if (a >= 10000) return sg + Math.round(a/10000).toLocaleString() + '万'; return sg + Math.round(a).toLocaleString(); };

            const SVGWaterfall = ({ start, end, steps, startLabel, endLabel, width = 680, height = 230 }) => {
                const ML = 56, MR = 10, MT = 22, MB = 34;
                const cW = width - ML - MR, cH = height - MT - MB;
                const bars = [{ label: startLabel, base: 0, val: start, kind: 'total' }];
                let run = start;
                steps.forEach(st => { bars.push({ label: st.label, base: run, val: st.delta, kind: st.delta >= 0 ? 'up' : 'down' }); run += st.delta; });
                bars.push({ label: endLabel, base: 0, val: end, kind: 'total' });
                const pts = bars.flatMap(b => [b.base, b.base + b.val]).concat(0);
                const maxV = Math.max(...pts), minV = Math.min(...pts);
                const span = (maxV - minV) || 1;
                const top = maxV + span * 0.12, bottom = minV < 0 ? minV - span * 0.08 : 0;
                const y = (v) => MT + (top - v) / (top - bottom) * cH;
                const gap = cW / bars.length, bW = Math.min(gap * 0.6, 54);
                const clr = { total: '#1e40af', up: '#10b981', down: '#ef4444' };
                return (
                    <svg width={width} height={height} style={{ display: 'block' }}>
                        <line x1={ML} y1={y(0)} x2={width - MR} y2={y(0)} stroke="#cbd5e1" strokeWidth="1"/>
                        {bars.map((b, i) => {
                            const x = ML + i * gap + (gap - bW) / 2;
                            const y1 = y(Math.max(b.base, b.base + b.val)), y2 = y(Math.min(b.base, b.base + b.val));
                            const valTxt = b.kind === 'total' ? fAxis(b.val) : (b.val >= 0 ? '+' : '') + fAxis(b.val);
                            return (
                                <g key={i}>
                                    <rect x={x} y={y1} width={bW} height={Math.max(y2 - y1, 1.5)} fill={clr[b.kind]} rx="2" opacity={b.kind === 'total' ? 0.9 : 0.8}/>
                                    {i < bars.length - 1 && <line x1={x + bW} y1={y(b.base + b.val)} x2={x + gap} y2={y(b.base + b.val)} stroke="#94a3b8" strokeWidth="1" strokeDasharray="3,2"/>}
                                    <text x={x + bW / 2} y={y1 - 4} textAnchor="middle" fontSize="9" fontWeight="700" fill={clr[b.kind]}>{valTxt}</text>
                                    <text x={x + bW / 2} y={height - 14} textAnchor="middle" fontSize="9" fill="#334155" fontWeight={b.kind === 'total' ? '700' : '400'}>{b.label}</text>
                                </g>
                            );
                        })}
                    </svg>
                );
            };

            const SVGDiverging = ({ items, width = 330, barH = 16 }) => {
                const maxV = Math.max(...items.map(it => Math.abs(it.value)), 1);
                const lW = 130, vW = 80, area = width - lW - vW;
                const H = items.length * (barH + 6) + 4;
                if (items.length === 0) return <div style={{ fontSize: '10px', color: '#94a3b8', padding: '8px 0' }}>該当なし</div>;
                return (
                    <svg width={width} height={H} style={{ display: 'block' }}>
                        {items.map((it, i) => {
                            const yy = i * (barH + 6) + 2, bw = Math.abs(it.value) / maxV * area;
                            return (
                                <g key={i}>
                                    <text x={lW - 6} y={yy + barH / 2 + 4} textAnchor="end" fontSize="10" fill="#334155">{it.label.length > 10 ? it.label.substring(0, 10) + '…' : it.label}</text>
                                    <rect x={lW} y={yy} width={Math.max(bw, 2)} height={barH} fill={it.value >= 0 ? '#10b981' : '#ef4444'} rx="3" opacity="0.8"/>
                                    <text x={lW + bw + 5} y={yy + barH / 2 + 4} fontSize="9" fill="#475569" fontFamily="'Courier New', monospace">{(it.value >= 0 ? '+' : '') + fY(it.value)}</text>
                                </g>
                            );
                        })}
                    </svg>
                );
            };

            const GaugeBar = ({ value, max, label, color }) => {
                const pctVal = max > 0 ? Math.min(value/max*100, 150) : 0;
                const w = 200, h = 18;
                return (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '3px' }}>

                        <svg width={w} height={h}>
                            <rect x="0" y="4" width={w} height="10" fill="#f1f5f9" rx="5"/>
                            <rect x="0" y="4" width={Math.min(pctVal/150*w, w)} height="10" fill={color} rx="5" opacity="0.85"/>
                            <line x1={100/150*w} y1="2" x2={100/150*w} y2="16" stroke="#1e293b" strokeWidth="1.5" strokeDasharray="2,1"/>
                        </svg>
                        <span style={{ fontSize: '10px', fontWeight: '700', color: color, width: '45px', fontFamily: "'Courier New', monospace" }}>{pctVal.toFixed(1)}%</span>
                    </div>

            const jobColors = Object.values(C.CAT_COLORS);

            return (

                    <div className="bg-white p-6 rounded-xl card-shadow flex flex-col md:flex-row justify-between items-center gap-4">

                        <div className="flex items-center gap-3">

                                <select className="bg-transparent text-sm font-bold text-blue-700 focus:outline-none cursor-pointer" value={safeEnd} onChange={(e) => setEndMonth(Math.max(startMonth, Number(e.target.value)))}>

                    </div>

                    <div className="bg-gray-200 p-6 rounded-xl overflow-auto flex justify-center">

                            <div style={{ borderBottom: '3px solid #1e40af', paddingBottom: '14px', marginBottom: '20px' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
                                    <div>
                                        <h1 style={{ fontSize: '22px', fontWeight: '800', color: '#1e40af', margin: '0 0 2px 0' }}>サマリーレポート</h1>
                                        <span style={{ fontSize: '16px', fontWeight: '700', color: '#334155' }}>{currentPeriod}期 {rd.periodLabel}</span>
                                    </div>
                                    <span style={{ fontSize: '11px', color: '#94a3b8' }}>出力日: {new Date().toLocaleDateString('ja-JP')}</span>
                                </div>
                            </div>

                            <div style={{ ...RS.sec, display: 'flex', gap: '14px', alignItems: 'stretch' }}>

                                    <svg width="220" height="130" style={{ display: 'block' }}>
                                        <rect x="0" y="0" width="220" height="130" rx="12" fill={rd.overall.color}/>
                                        <text x="110" y="26" textAnchor="middle" fontSize="11" fontWeight="600" fill="#fff" opacity="0.9" fontFamily="Arial, Helvetica, sans-serif">OVERALL RATING</text>
                                        <text x="110" y="62" textAnchor="middle" fontSize="24" fontWeight="800" fill="#fff" fontFamily="Arial, Helvetica, sans-serif">{rd.overall.label}</text>
                                        <text x="110" y="86" textAnchor="middle" fontSize="16" fill="#fff" opacity="0.9">{'★'.repeat(rd.overall.stars)}{'☆'.repeat(5 - rd.overall.stars)}</text>
                                        <text x="64" y="114" textAnchor="middle" fontSize="10" fill="#fff" opacity="0.9" fontFamily="Arial, Helvetica, sans-serif">予算比 {rd.pBPct.toFixed(1)}%</text>
                                        <text x="158" y="114" textAnchor="middle" fontSize="10" fill="#fff" opacity="0.9" fontFamily="Arial, Helvetica, sans-serif">昨対比 {rd.yoyP.toFixed(1)}%</text>
                                    </svg>
                                </div>

                                            </div>
                                        </div>

                                </div>
                            </div>

                            <div style={RS.sec}>

                                                    <span style={{ fontSize: '10px', color: '#64748b' }}>予算比 {d.budgetPct.toFixed(0)}%</span>
                                                    <RatingBadge rating={d.rating} size="small"/>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div style={RS.sec}>
                                <h2 style={RS.h2}>粗利 昨対の増減要因（{rd.periodLabel}）</h2>
                                {rd.hasLYProjects ? (<>
                                    <div style={{ fontSize: '10px', color: '#64748b', marginBottom: '4px' }}>
                                        昨期同期間 {fY(rd.yoyDrivers.lyTotal)} → 今期 {fY(rd.yoyDrivers.curTotal)}（
                                        <span style={{ fontWeight: '700', color: rd.yoyDrivers.curTotal >= rd.yoyDrivers.lyTotal ? '#10b981' : '#ef4444' }}>
                                            {(rd.yoyDrivers.curTotal >= rd.yoyDrivers.lyTotal ? '+' : '') + fY(rd.yoyDrivers.curTotal - rd.yoyDrivers.lyTotal)}
                                        </span>
                                        {rd.yoyDrivers.lyTotal > 0 && ` / 昨対比 ${(rd.yoyDrivers.curTotal / rd.yoyDrivers.lyTotal * 100).toFixed(1)}%`}）
                                    </div>

                                    <div style={{ display: 'flex', gap: '20px', marginTop: '10px' }}>

                                            <div style={{ fontSize: '10px', fontWeight: '700', color: '#059669', marginBottom: '4px' }}>押し上げた取引先 TOP 5</div>

                                            <div style={{ fontSize: '10px', fontWeight: '700', color: '#dc2626', marginBottom: '4px' }}>押し下げた取引先 TOP 5</div>
                                            <SVGDiverging items={rd.yoyDrivers.down.map(c => ({ label: c.name, value: c.delta }))}/>

                                    </div>
                                    <div style={{ fontSize: '8px', color: '#94a3b8', marginTop: '4px' }}>※ 案件データの合計で比較しているため、上部の全社粗利（予算シート）と数円〜数万円ずれる場合があります。</div>
                                </>) : <div style={{ fontSize: '11px', color: '#94a3b8' }}>昨期の案件データが読み込まれていないため表示できません。</div>}
                            </div>

                            <div style={RS.sec}>
                                <h2 style={RS.h2}>職種別実績（{rd.count}件）</h2>

                                        <SVGDonut data={rd.jobs.map(j=>j.profit)} colors={rd.jobs.map(j=>C.CAT_COLORS[j.name]||'#cbd5e1')} labelArr={rd.jobs.map(j=>j.name)} size={130}/>

                                            ])}

                            <div style={RS.sec}>

                                        <div key={g.key}>
                                            <div style={{ fontSize: '10px', fontWeight: '700', color: '#64748b', marginBottom: '4px' }}>{g.title}</div>
                                            <SVGDonut data={rd.tiers.map(t => t[g.key])} colors={rd.tiers.map(t => t.color)} labelArr={rd.tiers.map(t => `${t.name} ${t.sub}`)} size={120}/>
