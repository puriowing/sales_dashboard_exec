                                <div style={{ marginTop: '6px' }}>
                                    <ReportTable
                                        headers={['#', 'クライアント', '案件数', '売上', '粗利', '粗利率']}
                                        rows={rd.topClients.map((c, i) => [
                                            { v: i+1, style: { fontWeight: '700', color: '#94a3b8', textAlign: 'center' } },
                                            { v: c.name.length > 18 ? c.name.substring(0,18)+'…' : c.name, style: { textAlign: 'left' } },
                                            c.count+'件', fY(c.sales),
                                            { v: fY(c.profit), style: { fontWeight: '700', color: '#1e40af' } },
                                            (c.sales>0?(c.profit/c.sales*100).toFixed(1):'0.0')+'%'
                                        ])}
                                    />
                                </div>
                            </div>

                            <div style={RS.sec}>
                                <h2 style={RS.h2}>作品別 粗利 TOP 10</h2>
                                <SVGHorizontalBars items={rd.topWorks.map((w, i) => ({ label: w.name, value: w.profit, color: i < 3 ? '#7c3aed' : '#a78bfa' }))} width={680}/>
                                <div style={{ marginTop: '6px' }}>
                                    <ReportTable
                                        headers={['#', '作品名', '案件数', '売上', '粗利', '粗利率']}
                                        rows={rd.topWorks.map((w, i) => [
                                            { v: i+1, style: { fontWeight: '700', color: '#94a3b8', textAlign: 'center' } },
                                            { v: w.name.length > 18 ? w.name.substring(0,18)+'…' : w.name, style: { textAlign: 'left' } },
                                            w.count+'件', fY(w.sales),
                                            { v: fY(w.profit), style: { fontWeight: '700', color: '#1e40af' } },
                                            (w.sales>0?(w.profit/w.sales*100).toFixed(1):'0.0')+'%'
                                        ])}
                                    />
                                </div>
                            </div>

                            <div style={{ marginTop: '20px', paddingTop: '10px', borderTop: '1px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <span style={{ fontSize: '9px', color: '#94a3b8' }}>Gaie Dashboard - Confidential</span>
                                <span style={{ fontSize: '8px', color: '#cbd5e1' }}>EXCELLENT: 予算比110%以上+昨対105%以上 / GOOD: 予算比100%以上+昨対100%以上 / AVERAGE: 予算比90%以上or昨対95%以上 / NOT GOOD: その他</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== 週次サマリー（金曜朝の役員会議向け売上報告） =====
        function WeeklySummaryPage({ projectList, worksMaster, releaseSchedule, currentPeriod }) {
            const [weekOffset, setWeekOffset] = useState(0); // 0 = 直近の完了週（金〜木）
            const dateMode = 'regDate'; // 集計は登録日（新規登録ベース）に固定
            const [filterDiv, setFilterDiv] = useState('all'); // all/第1/第2/第3
            const [upDivFilter, setUpDivFilter] = useState('all'); // 公開予定作品の担当事業部フィルタ（配給ベース）
            const [trendDiv, setTrendDiv] = useState('all'); // 週次推移テーブルの事業部フィルタ
            const [trendWeeks, setTrendWeeks] = useState(12); // 週次推移テーブルの表示週数
            const TOPIC_THRESHOLD = 1000000; // 1案件あたりの「大きな数字」しきい値（売上）

            const fmtMD = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
            const fmtYMD = (d) => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
            const WD = ['日', '月', '火', '水', '木', '金', '土'];

            // 金曜〜木曜を1週間とする。offset=0 は「直近で完了した週」（＝金曜朝に報告する対象週）
            const getWeekWindow = (offset) => {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const daysSinceThu = (today.getDay() - 4 + 7) % 7; // 直近の木曜までの日数
                const end = new Date(today); end.setDate(today.getDate() - daysSinceThu + offset * 7); // 木曜
                const start = new Date(end); start.setDate(end.getDate() - 6); // 前の金曜
                return { start, end };
            };

            const divKey = (p) => { const s = String((p && p.div) || ''); if (s.includes('1')) return '第1'; if (s.includes('2')) return '第2'; if (s.includes('3')) return '第3'; return 'その他'; };
            // 配給会社から担当事業部を判定（第1=東宝 / 第2=東宝東和・東和ピクチャーズ / 第3=それ以外）
            const distDiv = (dist) => { const d = String(dist || ''); if (d.includes('東宝東和') || d.includes('東和ピクチャーズ')) return '第2'; if (d.includes('東宝')) return '第1'; return '第3'; };
            const divBadgeCls = (dv) => ({ '第1': 'bg-blue-100 text-blue-700', '第2': 'bg-emerald-100 text-emerald-700', '第3': 'bg-amber-100 text-amber-700' }[dv] || 'bg-gray-100 text-gray-600');
            const aggregate = (list) => { const sales = list.reduce((s, p) => s + (p.sales || 0), 0); const profit = list.reduce((s, p) => s + (p.profit || 0), 0); return { sales, profit, count: list.length, margin: sales > 0 ? profit / sales * 100 : 0 }; };

            const { window, companyCur, companyPrev, divStats, filteredProjects, topics } = useMemo(() => {
                const w = getWeekWindow(weekOffset), pw = getWeekWindow(weekOffset - 1);
                const inRange = (p, win) => {
                    const raw = String(p[dateMode] || '').trim().substring(0, 10);
                    const d = Utils.parseDate(raw);
                    if (d.getFullYear() < 2000) return false;
                    const t = d.getTime();
                    return t >= win.start.getTime() && t <= win.end.getTime();
                };
                const all = projectList || [];
                const cur = all.filter(p => inRange(p, w)), prv = all.filter(p => inRange(p, pw));
                const divs = ['第1', '第2', '第3'];
                const ds = divs.map(dv => ({ div: dv, cur: aggregate(cur.filter(p => divKey(p) === dv)), prev: aggregate(prv.filter(p => divKey(p) === dv)) }));
                const visible = filterDiv === 'all' ? cur : cur.filter(p => divKey(p) === filterDiv);
                const sortedVisible = [...visible].sort((a, b) => b.sales - a.sales);
                let tp = sortedVisible.filter(p => p.sales >= TOPIC_THRESHOLD);
                if (tp.length < 3) tp = sortedVisible.slice(0, Math.min(3, sortedVisible.length));
                return { window: w, companyCur: aggregate(cur), companyPrev: aggregate(prv), divStats: ds, filteredProjects: sortedVisible, topics: tp };
            }, [projectList, weekOffset, dateMode, filterDiv]);

            // 週次の売上・粗利推移（新規登録ベース・直近 trendWeeks 週）
            const weeklyTrend = useMemo(() => {
                const all = projectList || [];
                const rows = [];
                for (let off = 0; off > -trendWeeks; off--) {
                    const w = getWeekWindow(off);
                    let list = all.filter(p => {
                        const d = Utils.parseDate(String(p.regDate || '').trim().substring(0, 10));
                        if (d.getFullYear() < 2000) return false;
                        const t = d.getTime();
                        return t >= w.start.getTime() && t <= w.end.getTime();
                    });
                    if (trendDiv !== 'all') list = list.filter(p => divKey(p) === trendDiv);
                    rows.push({ offset: off, start: w.start, end: w.end, ...aggregate(list) });
                }
                rows.forEach((r, i) => { const older = rows[i + 1]; r.prevSales = older ? older.sales : null; r.prevProfit = older ? older.profit : null; });
                return rows;
            }, [projectList, trendWeeks, trendDiv]);

            // 公開予定作品 × 営業状況（作品ページの「公開作品スケジュール」と連動）
            const upcoming = useMemo(() => {
                const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const dealsByWork = {};
                (projectList || []).forEach(p => { const k = String(p.managerId || '').trim(); if (!k) return; (dealsByWork[k] = dealsByWork[k] || []).push(p); });
                return (releaseSchedule || []).map(wk => {
                    const rel = Utils.parseDate(wk.releaseDate);
                    const daysUntil = Math.ceil((rel.getTime() - today.getTime()) / 86400000);
                    const deals = dealsByWork[String(wk.id || '').trim()] || [];
                    const dealSales = deals.reduce((s, p) => s + (p.sales || 0), 0);
                    const dealProfit = deals.reduce((s, p) => s + (p.profit || 0), 0);
                    const divsSet = [...new Set(deals.map(divKey))].filter(x => x !== 'その他');
                    let latest = null; deals.forEach(p => { const d = Utils.parseDate(String(p.date || p.regDate || '').substring(0, 10)); if (d.getFullYear() > 2000 && (!latest || d > latest)) latest = d; });
                    return { ...wk, releaseDiv: distDiv(wk.distributor), daysUntil, dealCount: deals.length, dealSales, dealProfit, divs: divsSet, latestDeal: latest, status: deals.length > 0 ? 'active' : 'untapped' };
                }).filter(wk => wk.daysUntil >= 0).sort((a, b) => a.releaseDate.localeCompare(b.releaseDate));
            }, [releaseSchedule, projectList]);

            const visibleUpcoming = upDivFilter === 'all' ? upcoming : upcoming.filter(w => w.releaseDiv === upDivFilter);
            const oppSummary = { total: visibleUpcoming.length, untapped: visibleUpcoming.filter(i => i.status === 'untapped').length };
            const isReg = dateMode === 'regDate';
            const dateLabel = isReg ? '登録日（新規登録ベース）' : '請求日（売上計上ベース）';
            const noun = isReg ? '新規登録案件' : '案件';

            const DeltaBadge = ({ cur, prev }) => {
                const diff = cur - prev, up = diff >= 0;
                const pct = prev > 0 ? Math.abs(diff / prev * 100) : (cur > 0 ? 100 : 0);
                return <span className={`text-xs font-bold ${up ? 'text-green-600' : 'text-red-500'}`}>{up ? '▲' : '▼'} {Utils.formatYen(Math.abs(diff))} <span className="font-normal text-gray-400">{prev > 0 ? `(${up ? '+' : '-'}${pct.toFixed(0)}%)` : '(前週0)'}</span></span>;
            };

            const projCols = useMemo(() => [
                { key: dateMode, label: dateMode === 'date' ? '請求日' : '登録日', width: 'w-[10%]', sortable: true, render: (p) => { const v = String(p[dateMode] || '').substring(0, 10); return v || '-'; }, className: 'text-gray-500 font-mono' },
                { key: 'managerId', label: '作品名', width: 'w-[18%]', sortable: true, render: (p) => (worksMaster && worksMaster[p.managerId]) || '-', className: 'font-medium text-indigo-900' },
                { key: 'title', label: '案件名', width: 'w-[22%]', sortable: true, className: 'text-gray-700' },
                { key: 'client', label: 'クライアント', width: 'w-[16%]', sortable: true, className: 'text-gray-500' },
                { key: 'divLabel', label: '事業部', width: 'w-[8%]', sortable: true, render: (p) => divKey(p), className: 'text-gray-500' },
                { key: 'sales', label: '売上', align: 'right', width: 'w-[13%]', sortable: true, render: (p) => Utils.formatYen(p.sales), className: 'text-gray-600 font-mono' },
                { key: 'profit', label: '粗利', align: 'right', width: 'w-[13%]', sortable: true, render: (p) => Utils.formatYen(p.profit), className: 'font-bold text-indigo-600 font-mono' }
            ], [dateMode, worksMaster]);

            const catColor = (c) => ({ '邦画メジャー': 'bg-red-100 text-red-700', '洋画メジャー': 'bg-amber-100 text-amber-700', '邦画独立系': 'bg-purple-100 text-purple-700', '洋画独立系': 'bg-teal-100 text-teal-700' }[c] || 'bg-gray-100 text-gray-600');
            const upCols = useMemo(() => [
                { key: 'releaseDate', label: '公開日', width: 'w-[12%]', sortable: true, render: (w) => <div><div className="font-mono text-gray-700">{w.releaseDate}</div><div className="text-[10px] text-gray-400">{w.daysUntil === 0 ? '本日' : `あと${w.daysUntil}日`}</div></div> },
                { key: 'name', label: '作品名', width: 'w-[22%]', sortable: true, className: 'font-bold text-gray-800' },
                { key: 'category', label: '区分', width: 'w-[12%]', render: (w) => w.category ? <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${catColor(w.category)}`}>{w.category}</span> : '-' },
                { key: 'distributor', label: '配給', width: 'w-[14%]', sortable: true, render: (w) => <div className="flex items-center gap-1.5"><span className={`text-[9px] px-1 py-0.5 rounded font-bold shrink-0 ${divBadgeCls(w.releaseDiv)}`}>{w.releaseDiv}</span><span className="truncate">{w.distributor || '—'}</span></div>, className: 'text-gray-500' },
                { key: 'status', label: '営業状況', width: 'w-[12%]', sortable: true, render: (w) => w.status === 'active' ? <span className="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full font-bold bg-green-100 text-green-700">受注済 {w.dealCount}件</span> : <span className="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full font-bold bg-rose-100 text-rose-600">未着手</span> },
                { key: 'dealSales', label: '受注売上', align: 'right', width: 'w-[12%]', sortable: true, render: (w) => w.dealCount ? Utils.formatYen(w.dealSales) : '-', className: 'font-mono text-gray-600' },
                { key: 'dealProfit', label: '受注粗利', align: 'right', width: 'w-[10%]', sortable: true, render: (w) => w.dealCount ? Utils.formatYen(w.dealProfit) : '-', className: 'font-mono font-bold text-blue-600' },
                { key: 'divs', label: '担当', width: 'w-[8%]', render: (w) => w.divs.length ? w.divs.join('・') : '-', className: 'text-gray-500 text-xs' }
            ], []);

            const divCardColor = { '第1': { bar: 'bg-blue-500', text: 'text-blue-600', bg: 'bg-blue-50' }, '第2': { bar: 'bg-emerald-500', text: 'text-emerald-600', bg: 'bg-emerald-50' }, '第3': { bar: 'bg-amber-500', text: 'text-amber-600', bg: 'bg-amber-50' } };

            return (
                <div className="space-y-6 animate-in">
                    {/* ヘッダー・週ナビゲーション */}
                    <div className="bg-white p-6 rounded-xl card-shadow">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                            <div>
                                <h2 className="text-xl font-bold flex items-center gap-2"><Icon name="Calendar" className="text-blue-600" /> 週次サマリー</h2>
                                <p className="text-xs text-gray-500 mt-1">金曜朝の売上報告用 ／ <span className="font-semibold">金曜〜木曜</span>に{isReg ? '新たに登録された案件（前週からの追加分）' : '売り上げた案件'}を集計（{dateLabel}）</p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex items-center gap-1 bg-gray-50 border border-gray-200 rounded-lg p-1">
                                    <button onClick={() => setWeekOffset(weekOffset - 1)} className="px-2 py-1.5 rounded-md hover:bg-white text-gray-500"><Icon name="ArrowLeft" size={14} /></button>
                                    <div className="text-center px-2 min-w-[170px]">
                                        <div className="text-sm font-bold text-gray-800">{fmtYMD(window.start)}（金）〜 {fmtMD(window.end)}（木）</div>
                                        <div className="text-[10px] text-gray-400">{weekOffset === 0 ? '直近の完了週（報告対象）' : weekOffset < 0 ? `${Math.abs(weekOffset)}週前` : `${weekOffset}週先`}</div>
                                    </div>
                                    <button onClick={() => setWeekOffset(Math.min(0, weekOffset + 1))} disabled={weekOffset >= 0} className={`px-2 py-1.5 rounded-md ${weekOffset >= 0 ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-white text-gray-500'}`}><Icon name="ArrowLeft" size={14} className="rotate-180" /></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 全社サマリー + 事業部別 */}
                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-5 rounded-xl card-shadow">
                            <div className="text-xs font-semibold text-blue-100 mb-1 flex items-center gap-1"><Icon name="Activity" size={14} /> 全社</div>
                            <div className="text-3xl font-extrabold">{Utils.formatYen(companyCur.sales)}</div>
                            <div className="text-xs text-blue-100 mt-0.5">売上 ／ <DeltaBadge cur={companyCur.sales} prev={companyPrev.sales} /></div>
                            <div className="mt-3 pt-3 border-t border-white/20 flex justify-between text-sm">
                                <div><div className="text-[10px] text-blue-100">粗利</div><div className="font-bold">{Utils.formatYen(companyCur.profit)}</div></div>
                                <div><div className="text-[10px] text-blue-100">粗利率</div><div className="font-bold">{companyCur.margin.toFixed(1)}%</div></div>
                                <div><div className="text-[10px] text-blue-100">案件数</div><div className="font-bold">{companyCur.count}件</div></div>
                            </div>
                        </div>
                        {divStats.map(ds => { const col = divCardColor[ds.div]; return (
                            <div key={ds.div} className={`bg-white p-5 rounded-xl card-shadow border-t-4 ${col.bar.replace('bg-', 'border-')}`}>
                                <div className={`text-xs font-bold mb-1 ${col.text}`}>{ds.div}事業部</div>
                                <div className="text-2xl font-extrabold text-gray-800">{Utils.formatYen(ds.cur.sales)}</div>
                                <div className="text-xs text-gray-400 mt-0.5">売上 ／ <DeltaBadge cur={ds.cur.sales} prev={ds.prev.sales} /></div>
                                <div className="mt-3 pt-3 border-t border-gray-100 flex justify-between text-sm">
                                    <div><div className="text-[10px] text-gray-400">粗利</div><div className="font-bold text-gray-700">{Utils.formatYen(ds.cur.profit)}</div></div>
                                    <div><div className="text-[10px] text-gray-400">粗利率</div><div className="font-bold text-gray-700">{ds.cur.margin.toFixed(1)}%</div></div>
                                    <div><div className="text-[10px] text-gray-400">案件数</div><div className="font-bold text-gray-700">{ds.cur.count}件</div></div>
                                </div>
                            </div>
                        ); })}
                    </div>

                    {/* 週次の売上・粗利 推移（表） */}
                    <div className="bg-white p-6 rounded-xl card-shadow">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
                            <div>
                                <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="TrendingUp" size={18} className="text-indigo-600" /> 週次推移<span className="text-xs font-normal text-gray-400">（新規登録ベース・金〜木）</span></h3>
                                <p className="text-xs text-gray-400 mt-1">行をクリックすると、その週のデータを上部の集計に表示します。</p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-2 sm:items-center">
                                <div className="flex gap-1.5 items-center flex-wrap">
                                    <span className="text-xs text-gray-400">事業部:</span>
                                    {[{ v: 'all', l: '全社' }, { v: '第1', l: '第1' }, { v: '第2', l: '第2' }, { v: '第3', l: '第3' }].map(o => (
                                        <button key={o.v} onClick={() => setTrendDiv(o.v)} className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition-colors ${trendDiv === o.v ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-blue-50'}`}>{o.l}</button>
                                    ))}
                                </div>
                                <select className="border border-gray-200 rounded-lg text-xs px-2 py-1.5 bg-gray-50" value={trendWeeks} onChange={(e) => setTrendWeeks(parseInt(e.target.value))}>
                                    <option value={12}>過去12週</option>
                                    <option value={26}>過去26週</option>
                                    <option value={52}>過去52週</option>
                                </select>
                            </div>
                        </div>
                        <div className="overflow-x-auto scrollbar-thin max-h-[480px]">
                            <table className="w-full text-sm text-left whitespace-nowrap">
                                <thead><tr>{['週（金〜木）', '売上', '前週比', '粗利', '前週比', '粗利率', '件数'].map((h, i) => <th key={i} className={`${CLS.TH} ${i === 0 ? 'text-left' : 'text-right'}`}>{h}</th>)}</tr></thead>
                                <tbody className="divide-y divide-gray-100">
                                    {weeklyTrend.map((r, i) => {
                                        const Delta = ({ cur, prev }) => { if (prev == null) return <span className="text-gray-300">—</span>; const diff = cur - prev, up = diff >= 0; return <span className={`text-xs ${up ? 'text-green-600' : 'text-red-500'}`}>{up ? '▲' : '▼'}{Utils.formatYen(Math.abs(diff))}</span>; };
                                        const selected = r.offset === weekOffset;
                                        return (
                                            <tr key={i} onClick={() => { setWeekOffset(r.offset); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`cursor-pointer transition-colors ${selected ? 'bg-blue-100 hover:bg-blue-100 ring-1 ring-inset ring-blue-300' : 'hover:bg-blue-50'}`}>
                                                <td className="px-4 py-2.5 text-gray-700">{fmtMD(r.start)} 〜 {fmtMD(r.end)}{r.offset === 0 && <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 font-bold">今週</span>}{selected && <span className="ml-1.5 text-[10px] px-1.5 py-0.5 rounded bg-indigo-600 text-white font-bold">表示中</span>}</td>
                                                <td className="px-4 py-2.5 text-right font-bold text-gray-800">{Utils.formatYen(r.sales)}</td>
                                                <td className="px-4 py-2.5 text-right"><Delta cur={r.sales} prev={r.prevSales} /></td>
                                                <td className="px-4 py-2.5 text-right font-bold text-indigo-600">{Utils.formatYen(r.profit)}</td>
                                                <td className="px-4 py-2.5 text-right"><Delta cur={r.profit} prev={r.prevProfit} /></td>
                                                <td className="px-4 py-2.5 text-right text-gray-500">{r.margin.toFixed(1)}%</td>
                                                <td className="px-4 py-2.5 text-right text-gray-500">{r.count}件</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* 今週のトピック（大型案件） */}
                    <div className="bg-white p-6 rounded-xl card-shadow">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="Star" size={18} className="text-amber-500" /> 今週のトピック<span className="text-xs font-normal text-gray-400">（売上 {Utils.formatYen(TOPIC_THRESHOLD)} 以上の大型案件）</span></h3>

        // --- 経営会議ビュー（毎週見る4ページ） ---
        const MK = {
            PAGES: [
                { id: 'mk_month', n: 1, label: '今月の粗利', q: '単月の粗利は予算・昨年と比べてどうか。先週から何が増えたか' },
                { id: 'mk_outlook', n: 2, label: '年間の見通し', q: 'いまのペースで、粗利・販管費・営業利益が年間の予算に届くか' },
                { id: 'mk_works', n: 3, label: '注目の作品・案件', q: '大きな粗利が出た作品・案件はどれか。まだ登録されていない有望な案件はないか' },
                { id: 'mk_exp', n: 4, label: '販管費', q: '月々の販管費はどう推移しているか。予算を超えている科目はどこか' }
            ],
            DIVS: ['第1', '第2', '第3'],
            DIV_COLOR: { '第1': '#3b82f6', '第2': '#00ADE7', '第3': '#f59e0b', 'その他': '#94a3b8' },
            TONE: {
                good: { bg: 'bg-sky-50', bd: 'border-sky-300', fg: 'text-sky-700', num: 'text-sky-600' },
                warn: { bg: 'bg-amber-50', bd: 'border-amber-300', fg: 'text-amber-700', num: 'text-amber-600' },
                bad: { bg: 'bg-red-50', bd: 'border-red-300', fg: 'text-red-700', num: 'text-red-600' },
                gray: { bg: 'bg-slate-50', bd: 'border-slate-300', fg: 'text-slate-600', num: 'text-gray-800' }
            },
            BASES: [{ v: 7, l: '1週間前（前回の会議）' }, { v: 14, l: '2週間前' }, { v: 28, l: '4週間前' }],
            sum: (a) => (a || []).reduce((s, v) => s + (Number(v) || 0), 0),
            man: (v) => { const n = Number(v) || 0; return n < 0 ? '▲' + XF.man(-n) : XF.man(n); },
            manS: (v) => { const n = Number(v) || 0; return n < 0 ? '▲' + XF.man(-n) : (n > 0 ? '+' : '±') + XF.man(n); },
            divOf: (p) => { const s = String((p && p.div) || ''); if (s.includes('1')) return '第1'; if (s.includes('2')) return '第2'; if (s.includes('3')) return '第3'; return 'その他'; },
            day0: (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()),
            baseDate: (days) => { const d = MK.day0(new Date()); d.setDate(d.getDate() - days); return d; },
            md: (d) => `${d.getMonth() + 1}/${d.getDate()}`,
            regTime: (p) => { const d = Utils.parseDate(String((p && p.regDate) || '').trim().substring(0, 10)); return d.getFullYear() < 2000 ? null : MK.day0(d).getTime(); },
            isFresh: (p, baseT) => { const t = MK.regTime(p); return t != null && t > baseT; },
            pct: (a, b) => b > 0 ? Math.round(a / b * 100) + '%' : '—',
            short: (s, n = 16) => { const t = String(s || ''); return t.length > n ? t.slice(0, n) + '…' : t; },
            cname: (s) => String(s || '不明').normalize('NFKC').replace(/株式会社|\(株\)|（株）|\s/g, '') || '不明',
            curIdx: (period) => { const t = new Date(); return Math.max(0, Math.min(11, t.getFullYear() * 12 + t.getMonth() - FC.periodStartKey(period))); },
            kArr: (arr) => Array.from({ length: 12 }, (_, i) => (Number((arr || [])[i]) || 0) * 1000),
            workName: (p, master) => (master && p.managerId && master[p.managerId]) || p.title || '名称不明',
            // 作品（管理番号）単位にまとめる。管理番号がない案件は案件名でまとめる
            group: (list, master) => {
                const m = {};
                (list || []).forEach(p => {
                    const key = p.managerId ? 'w:' + p.managerId : 't:' + (p.title || '');
                    const g = m[key] || (m[key] = { key, id: p.managerId || '', name: MK.workName(p, master), profit: 0, sales: 0, count: 0, items: [], divs: {}, clients: {} });
                    g.profit += p.profit || 0; g.sales += p.sales || 0; g.count++; g.items.push(p);
                    const dv = MK.divOf(p); g.divs[dv] = (g.divs[dv] || 0) + (p.profit || 0);
                    const c = p.client || '不明'; g.clients[c] = (g.clients[c] || 0) + (p.profit || 0);
                });
                return Object.values(m).map(g => ({ ...g, div: Object.entries(g.divs).sort((a, b) => b[1] - a[1])[0][0], client: Object.entries(g.clients).sort((a, b) => b[1] - a[1])[0][0], top: g.items.slice().sort((a, b) => b.profit - a.profit)[0] }));
            },
            rng: (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; },
            // 締めた月の予算達成率から、残りの月を見込む。達成確率は達成率のばらつきを使った試算
            outlook: (A, B, curIdx, opt) => {
                const S = MK.sum, o = opt || {};
                const budgetFY = o.budgetFY != null ? o.budgetFY : S(B), closedA = S(A.slice(0, curIdx)), closedB = S(B.slice(0, curIdx));
                const ratios = []; for (let m = 0; m < curIdx; m++) if (B[m] > 0) ratios.push(A[m] / B[m]);
                const rbar = closedB > 0 ? closedA / closedB : null;
                const remB = S(B.slice(curIdx));
                const proj = A.map((a, m) => m < curIdx ? a : Math.max(a || 0, rbar != null ? B[m] * rbar : 0));
                const landing = S(proj);
                const booked = S(A.slice(curIdx));
                const need = budgetFY - closedA;
                const needRatio = remB > 0 ? need / remB : null;
                let prob = null, p10 = null, p90 = null, sims = null;
                if (ratios.length >= 3 && budgetFY > 0) {
                    const rnd = MK.rng(o.seed || 20261021), N = MK.SIMS, out = [];
                    const pick = () => ratios[Math.floor(rnd() * ratios.length)];
                    for (let k = 0; k < N; k++) {
                        const c = pick(); let t = closedA;
                        for (let m = curIdx; m < 12; m++) t += Math.max(A[m] || 0, B[m] * (0.5 * c + 0.5 * pick()));
                        out.push(t);
                    }
                    sims = out.slice();
                    out.sort((x, y) => x - y);
                    prob = out.filter(v => v >= budgetFY).length / N;
                    p10 = out[Math.floor(N * 0.1)]; p90 = out[Math.floor(N * 0.9)];
                }
                const mean = ratios.length ? S(ratios) / ratios.length : null;
                const sd = ratios.length > 1 ? Math.sqrt(S(ratios.map(r => (r - mean) * (r - mean))) / (ratios.length - 1)) : null;
                return { budgetFY, closedA, closedB, ratios, rbar, mean, sd, remB, proj, landing, booked, need, needRatio, prob, p10, p90, sims, remN: 12 - curIdx };
            },
            SIMS: 4000,
            // 昨期の販管費（月別）。昨期の販管費予実表（経営陣用）が連携されているときだけ
            lyExp: (prev) => {
                if (!prev) return null;
                const src = prev.summary && prev.summary.total ? [prev.summary.total] : prev.accounts;
                const arr = EXP.FY.map((_, m) => MK.sum(src.map(a => (a.actual && a.actual[m]) || 0)));
                return arr.some(v => v) ? arr : null;
            },
            // 販管費：経営陣用の予実表があれば科目合計、なければ予算実績リストの全社販管費。予備費は今後使わない前提で見込から外す
            expSeries: (execPL, execItems, monthlyData) => {
                if (execPL) {
                    const md = EXP.build(execPL, execItems, -1);
                    const S = MK.sum, live = md.accounts;
                    const B = EXP.FY.map((_, m) => S(live.map(a => a.budget[m])));
                    const Bfc = EXP.FY.map((_, m) => S(live.filter(a => !a.reserve).map(a => a.budget[m])));
                    const A = EXP.FY.map((_, m) => m <= md.asOf ? S(live.map(a => a.actual[m] || 0)) : 0);
                    return { A, B, Bfc, closed: md.asOf + 1, src: '販管費予実表（経営陣用）' };
                }
                const A = MK.kArr(monthlyData.expenses), B = MK.kArr(monthlyData.expensesBudget);
                let last = -1; A.forEach((v, i) => { if (v) last = i; });
                return { A, B, Bfc: B, closed: last + 1, src: '予算実績リスト（全社販管費）' };
            },
            // 粗利と販管費の見通しをまとめ、営業利益の見通しと確率を出す
            pl: (A, B, curIdx, E) => {
                const S = MK.sum;
                const P = MK.outlook(A, B, curIdx, { seed: 20261021 });
                const X = MK.outlook(E.A, E.Bfc, E.closed, { seed: 777, budgetFY: S(E.B) });
                const opBudget = P.budgetFY - X.budgetFY, opLanding = P.landing - X.landing;
                let opProb = null, op10 = null, op90 = null;
                if (P.sims && X.sims) {
                    const d = P.sims.map((v, k) => v - X.sims[k]);
                    opProb = d.filter(v => v >= opBudget).length / d.length;
                    d.sort((x, y) => x - y); op10 = d[Math.floor(d.length * 0.1)]; op90 = d[Math.floor(d.length * 0.9)];
                }
                const expProb = X.sims ? X.sims.filter(v => v <= X.budgetFY).length / X.sims.length : null;
                const opProj = P.proj.map((v, m) => v - X.proj[m]), opB = B.map((v, m) => v - E.B[m]);
                return { P, X, E, opBudget, opLanding, opProb, op10, op90, expProb, opProj, opB };
            },
            probText: (p) => p == null ? '—' : p >= 0.97 ? '95%以上' : p <= 0.03 ? '5%未満' : '約' + Math.round(p * 20) * 5 + '%',
            probInfo: (p) => p == null ? { tone: 'gray', label: '判定に必要なデータが足りません' } : p >= 0.8 ? { tone: 'good', label: '達成の見込みが高い' } : p >= 0.5 ? { tone: 'good', label: '達成できる可能性のほうが高い' } : p >= 0.2 ? { tone: 'warn', label: '黄信号：このままでは届かない可能性が高い' } : { tone: 'bad', label: '赤信号：大きな上積みが必要' },
            toneOfRatio: (a, b) => b <= 0 ? 'gray' : a >= b ? 'good' : a >= b * 0.95 ? 'warn' : 'bad'
        };

        const MK_DL = { color: '#334155', font: { weight: 'bold', size: 13 } };
        const mkTicksMan = { callback: v => (v / 1e4).toLocaleString() + '万', font: { size: 12 } };

        function MkDiffChart({ rows, goodPositive = true }) {
            const data = useMemo(() => ({ labels: rows.map(r => MK.short(r.label, 18)), datasets: [{ label: '差', data: rows.map(r => r.value), backgroundColor: rows.map(r => ((r.value >= 0) === goodPositive) ? '#00ADE7' : '#E5484D'), borderRadius: 4, barThickness: 24 }] }), [rows, goodPositive]);
            const options = useMemo(() => ({ indexAxis: 'y', layout: { padding: { left: 10, right: 10 } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => MK.manS(c.raw) } }, datalabels: { ...MK_DL, display: true, anchor: c => c.dataset.data[c.dataIndex] >= 0 ? 'end' : 'start', align: c => c.dataset.data[c.dataIndex] >= 0 ? 'end' : 'start', formatter: v => MK.manS(v) } }, scales: { x: { grace: '40%', ticks: mkTicksMan, grid: { color: c => c.tick && c.tick.value === 0 ? '#64748b' : '#f1f5f9' } }, y: { ticks: { font: { size: 14 } }, grid: { display: false } } } }), []);
            if (!rows.length) return <MkEmpty>差の出ている項目はありません</MkEmpty>;
            return <div style={{ height: rows.length * 46 + 50 }}><ChartComponent type="bar" data={data} options={options} /></div>;
        }

        function MkHBars({ labels, sets }) {
            const totals = labels.map((_, i) => sets.reduce((s, d) => s + (d.data[i] || 0), 0));
            const data = useMemo(() => ({ labels: labels.map(l => MK.short(l, 18)), datasets: sets.map((d, k) => ({ label: d.label, data: d.data, backgroundColor: d.color, borderRadius: 4, barThickness: 24, datalabels: { ...MK_DL, display: k === sets.length - 1, anchor: 'end', align: 'end', formatter: (v, c) => MK.man(totals[c.dataIndex]) } })) }), [labels, sets]);
            const options = useMemo(() => ({ indexAxis: 'y', layout: { padding: { right: 90 } }, plugins: { legend: { display: sets.length > 1 && !!sets[0].label, position: 'top', labels: { font: { size: 13 } } }, tooltip: { callbacks: { label: c => `${c.dataset.label || ''} ${MK.man(c.raw)}` } } }, scales: { x: { stacked: true, ticks: mkTicksMan }, y: { stacked: true, ticks: { font: { size: 14 } }, grid: { display: false } } } }), [sets.length]);
            if (!labels.length) return <MkEmpty>該当するデータはありません</MkEmpty>;
            return <div style={{ height: labels.length * 46 + 60 }}><ChartComponent type="bar" data={data} options={options} /></div>;
        }

        function MkBaseSelect({ baseDays, setBaseDays }) {
            return (
                <label className="flex items-center gap-2 text-sm text-gray-600 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">
                    比べる時点
                    <select value={baseDays} onChange={e => setBaseDays(Number(e.target.value))} className="bg-white border border-gray-300 rounded px-2 py-1 text-sm font-bold text-gray-800">
                        {MK.BASES.map(b => <option key={b.v} value={b.v}>{b.l}（{MK.md(MK.baseDate(b.v))}）</option>)}
                    </select>
                </label>
            );
        }

        // ① 今月の粗利
        function MkMonthPage({ monthlyData, projectList, lastYearProjectList, divisionMonthlyData, worksMaster, currentPeriod, view, setView, baseDays, setBaseDays, onGo, reports, reportStatus }) {
            const curIdx = MK.curIdx(currentPeriod);
            const [month, setMonth] = useState(curIdx);
            const [scope, setScope] = useState('month');
            const baseD = MK.baseDate(baseDays), baseT = baseD.getTime(), baseL = MK.md(baseD);
            const M = useMemo(() => {
                const months = scope === 'month' ? [month] : Array.from({ length: month + 1 }, (_, i) => i);
                const inM = (p) => months.includes(Utils.getFiscalMonthIndex(p.date));
                const k = (arr) => months.reduce((s, m) => s + (Number((arr || [])[m]) || 0), 0) * 1000;
                const act = k(monthlyData.actualProfit), bud = k(monthlyData.budgetProfit), ly = k(monthlyData.lastYearProfit);
                const cur = (projectList || []).filter(inM);
                const fresh = cur.filter(p => MK.isFresh(p, baseT));
                const week = MK.sum(fresh.map(p => p.profit));
                const weekWorks = MK.group(fresh, worksMaster).sort((a, b) => b.profit - a.profit);
                const weekDiv = MK.DIVS.concat(['その他']).map(d => ({ div: d, v: MK.sum(fresh.filter(p => MK.divOf(p) === d).map(p => p.profit)) })).filter(x => x.v);
                const divRows = MK.DIVS.map((d, i) => {
                    const dm = (divisionMonthlyData && divisionMonthlyData['div' + (i + 1)]) || {};
                    const a = k(dm.profit), b = k(dm.budgetProfit);
                    const tops = MK.group(cur.filter(p => MK.divOf(p) === d), worksMaster).sort((x, y) => y.profit - x.profit).slice(0, 2);
                    return { div: d + '事業部', act: a, bud: b, diff: a - b, tops };
                });
                const oa = act - MK.sum(divRows.map(r => r.act)), ob = bud - MK.sum(divRows.map(r => r.bud));
                if (Math.abs(oa) >= 10000 || Math.abs(ob) >= 10000) divRows.push({ div: '事業部なし', act: oa, bud: ob, diff: oa - ob, tops: MK.group(cur.filter(p => MK.divOf(p) === 'その他'), worksMaster).sort((x, y) => y.profit - x.profit).slice(0, 2) });
                const lyList = (lastYearProjectList || []).filter(inM);
                const cm = {};
                const add = (p, f) => { const kk = MK.cname(p.client); const o = cm[kk] || (cm[kk] = { name: p.client || '不明', cur: 0, ly: 0 }); o[f] += p.profit || 0; };
                cur.forEach(p => add(p, 'cur')); lyList.forEach(p => add(p, 'ly'));
                const cli = Object.values(cm).map(o => ({ ...o, diff: o.cur - o.ly }));
                const ups = cli.filter(o => o.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 5);
                const downs = cli.filter(o => o.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 5);
                const jm = {};
                cur.forEach(p => { const j = Utils.getJobCategory(p.job); (jm[j] = jm[j] || { name: j, cur: 0, ly: 0 }).cur += p.profit || 0; });
                lyList.forEach(p => { const j = Utils.getJobCategory(p.job); (jm[j] = jm[j] || { name: j, cur: 0, ly: 0 }).ly += p.profit || 0; });
                const jobs = Object.values(jm).map(o => ({ ...o, diff: o.cur - o.ly })).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
                return { act, bud, ly, fresh, week, weekWorks, weekDiv, divRows, ups, downs, jobs };
            }, [monthlyData, projectList, lastYearProjectList, divisionMonthlyData, worksMaster, month, scope, baseT]);

            const label = scope === 'month' || month === 0 ? `${MONTH_LABELS[month]}` : `3月〜${MONTH_LABELS[month]}の累計`;
            const dB = M.act - M.bud, dL = M.act - M.ly;
            const tone = MK.toneOfRatio(M.act, M.bud);
            const divSorted = M.divRows.filter(r => r.bud > 0 || r.act).slice().sort((a, b) => b.diff - a.diff);
            const upDiv = divSorted.find(r => r.diff > 0), downDiv = divSorted.slice().reverse().find(r => r.diff < 0);
            const lines = [
                <span>{label}の粗利は <b>{MK.man(M.act)}</b>。{M.bud > 0 && <>予算を <b className={dB >= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.man(Math.abs(dB))}{dB >= 0 ? '上回って' : '下回って'}</b> います（予算比 {MK.pct(M.act, M.bud)}）。</>}</span>,
                M.ly > 0 && <span>昨年の同じ時期より <b className={dL >= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.man(Math.abs(dL))}{dL >= 0 ? '多く' : '少なく'}</b>、昨対は {MK.pct(M.act, M.ly)} です。</span>,
                M.fresh.length === 0 ? <span>{baseL}より後に新しく登録された案件はありません。</span> : <span>{baseL}から <b>{M.week >= 0 ? '+' : ''}{MK.man(M.week)}</b> 増えました。{M.weekWorks[0] && <>いちばん大きいのは「{M.weekWorks[0].name}」（+{MK.man(M.weekWorks[0].profit)}）です。</>}</span>,
                (upDiv || downDiv) && <span className="text-lg text-gray-700">予算との差：{upDiv && <>{upDiv.div}が {MK.manS(upDiv.diff)} で押し上げ</>}{upDiv && downDiv && '、'}{downDiv && <>{downDiv.div}が {MK.manS(downDiv.diff)} で押し下げ</>}ています。</span>,
                (M.ups[0] || M.downs[0]) && <span className="text-lg text-gray-700">昨年との差：{M.ups[0] && <>「{M.ups[0].name}」が {MK.manS(M.ups[0].diff)}</>}{M.ups[0] && M.downs[0] && '、'}{M.downs[0] && <>「{M.downs[0].name}」が {MK.manS(M.downs[0].diff)}</>} と大きく動いています。</span>
            ];

            const top8 = M.weekWorks.slice(0, 8);
            const weekSets = useMemo(() => [{ label: '', data: top8.map(w => w.profit), color: top8.map(w => MK.DIV_COLOR[w.div]) }], [M]);
            const yoyRows = useMemo(() => M.ups.concat(M.downs.slice().reverse()).map(o => ({ label: o.name, value: o.diff })), [M]);
            const divDiffRows = useMemo(() => M.divRows.map(r => ({ label: r.div, value: r.diff })), [M]);

            const trend = useMemo(() => {
                const A = MK.kArr(monthlyData.actualProfit), B = MK.kArr(monthlyData.budgetProfit), L = MK.kArr(monthlyData.lastYearProfit);
                return { A, B, L, data: { labels: MONTH_LABELS, datasets: [
                    { type: 'bar', label: '粗利（実績）', data: A, backgroundColor: MONTH_LABELS.map((_, i) => i === month ? '#f97316' : '#fdba74'), borderRadius: 4, order: 3 },
                    { type: 'line', label: '予算', data: B, borderColor: '#475569', borderDash: [6, 4], borderWidth: 2, pointRadius: 3, fill: false, order: 1 },
                    { type: 'line', label: '昨年', data: L, borderColor: '#a78bfa', borderWidth: 2, pointRadius: 2, fill: false, order: 2 }
                ] } };
            }, [monthlyData, month]);

            return (
                <div className="space-y-6">
                    <MkHead id="mk_month" view={view} setView={setView} right={<MkBaseSelect baseDays={baseDays} setBaseDays={setBaseDays} />} />
                    <div className="bg-white rounded-2xl card-shadow px-6 py-4 flex flex-col xl:flex-row xl:items-center gap-4">
                        <div className="flex flex-wrap gap-1.5">
                            {MONTH_LABELS.map((l, i) => <button key={i} onClick={() => setMonth(i)} className={`px-3 py-2 rounded-lg text-base font-bold border ${month === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-blue-50'}`}>{l}{i === curIdx && <span className={`ml-1 text-[10px] ${month === i ? 'text-blue-100' : 'text-blue-500'}`}>今月</span>}</button>)}
                        </div>
                        <div className="xl:ml-auto"><ToggleButton options={[{ value: 'month', label: 'この月だけ' }, { value: 'ytd', label: '期首からの累計' }]} value={scope} onChange={setScope} /></div>
                    </div>

                    <MkVerdict tone={tone} lines={lines} />

                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                        <MkBig label={`${label}の粗利`} value={MK.man(M.act)} sub={<>予算 {MK.man(M.bud)} ／ 昨年 {MK.man(M.ly)}</>} />
                        <MkBig label="予算対比" value={MK.pct(M.act, M.bud)} tone={tone} sub={<>予算との差 <b>{MK.manS(dB)}</b></>} />
                        <MkBig label="昨年対比" value={MK.pct(M.act, M.ly)} tone={MK.toneOfRatio(M.act, M.ly)} sub={<>昨年との差 <b>{MK.manS(dL)}</b></>} />
                        <MkBig label={`${baseL}からの増加`} value={(M.week >= 0 ? '+' : '') + MK.man(M.week)} tone={M.week > 0 ? 'good' : 'gray'} sub={<>{M.fresh.length}件の案件が新たに登録されました</>} />
                    </div>

                    <ErrorBoundary label="事業部長の報告"><MkReports reports={reports} status={reportStatus} month={month} scope={scope} /></ErrorBoundary>

                    <MkSection title="なぜ？ その1：先週から何が増えたか" lead={`${baseL}より後に登録された案件を、作品ごとにまとめています（色は事業部）。`}
                        right={M.weekDiv.length > 0 && <div className="flex flex-wrap gap-2">{M.weekDiv.map(x => <span key={x.div} className="text-sm font-bold px-3 py-1.5 rounded-full text-white" style={{ background: MK.DIV_COLOR[x.div] }}>{x.div === 'その他' ? '事業部なし' : x.div} +{MK.man(x.v)}</span>)}</div>}>
                        {M.fresh.length === 0 ? <MkEmpty>{baseL}より後に登録された案件はありません</MkEmpty> : view === 'chart' ? <MkHBars labels={top8.map(w => w.name)} sets={weekSets} /> : (
                            <MkTable head={['作品', '事業部', 'クライアント', '主な案件', '件数', '粗利']} align={['l', 'l', 'l', 'l', 'r', 'r']}
                                rows={M.weekWorks.map(w => ({ cells: [<span className="font-bold">{w.name}</span>, w.div, w.client, <span className="text-gray-500">{MK.short(w.top.title, 22)}</span>, w.count + '件', <b>{MK.man(w.profit)}</b>] }))} />
                        )}
                        {view === 'chart' && M.weekWorks.length > 8 && <p className="text-sm text-gray-500 mt-2">ほか {M.weekWorks.length - 8}作品（計 {MK.man(MK.sum(M.weekWorks.slice(8).map(w => w.profit)))}）。すべて見るには「表」に切り替えてください。</p>}
                    </MkSection>

                    <MkSection title="なぜ？ その2：予算との差はどこから来ているか" lead="事業部ごとの「粗利 − 予算」です。緑は予算を上回り、赤は下回っています。">
                        {view === 'chart' ? <MkDiffChart rows={divDiffRows} /> : (
                            <MkTable head={['事業部', '粗利', '予算', '差', '予算比', '粗利の大きい作品']} align={['l', 'r', 'r', 'r', 'r', 'l']}
                                rows={M.divRows.map(r => ({ cells: [<b>{r.div}</b>, MK.man(r.act), MK.man(r.bud), <b className={r.diff >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(r.diff)}</b>, MK.pct(r.act, r.bud), <span className="text-gray-600 text-sm">{r.tops.map(t => `${MK.short(t.name, 14)}（${MK.man(t.profit)}）`).join('、') || '—'}</span>] }))} />
                        )}
                        {view === 'chart' && <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3">{M.divRows.filter(r => r.div !== '事業部なし').map(r => <div key={r.div} className="text-sm bg-gray-50 rounded-xl p-3"><div className="font-bold text-gray-700 mb-1">{r.div}の粗利の大きい作品</div>{r.tops.length ? r.tops.map(t => <div key={t.key} className="flex justify-between gap-2"><span className="truncate">{t.name}</span><span className="font-mono shrink-0">{MK.man(t.profit)}</span></div>) : <span className="text-gray-400">なし</span>}</div>)}</div>}
                    </MkSection>

                    <MkSection title="なぜ？ その3：昨年との差はどこから来ているか" lead="クライアントごとに昨年の同じ時期と比べ、増えた上位5社・減った上位5社を出しています。">
                        {M.ly <= 0 ? <MkEmpty>昨年の実績が読み込まれていません</MkEmpty> : view === 'chart' ? <MkDiffChart rows={yoyRows} /> : (
                            <MkTable head={['クライアント', '今期', '昨年', '差']} align={['l', 'r', 'r', 'r']}
                                rows={M.ups.concat(M.downs).map(o => ({ cells: [<b>{o.name}</b>, MK.man(o.cur), MK.man(o.ly), <b className={o.diff >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(o.diff)}</b>] }))} />
                        )}
                    </MkSection>

                    <MkMore title="月ごとの推移（予算・昨年と比べて）">
                        {view === 'chart' ? <div className="h-80"><ChartComponent type="bar" data={trend.data} options={{ plugins: { legend: { labels: { font: { size: 13 } } } }, scales: { y: { ticks: mkTicksMan } } }} /></div> : (
                            <MkTable head={['月', '粗利', '予算', '予算との差', '昨年', '昨年との差']} align={['l', 'r', 'r', 'r', 'r', 'r']}
                                rows={MONTH_LABELS.map((l, i) => ({ cls: i === month ? 'bg-orange-50' : '', cells: [l, MK.man(trend.A[i]), MK.man(trend.B[i]), <span className={trend.A[i] - trend.B[i] >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(trend.A[i] - trend.B[i])}</span>, MK.man(trend.L[i]), <span className={trend.A[i] - trend.L[i] >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(trend.A[i] - trend.L[i])}</span>] }))} />
                        )}
                    </MkMore>
                    <MkMore title="職種ごとの昨年との差">
                        {view === 'chart' ? <MkDiffChart rows={M.jobs.map(o => ({ label: o.name, value: o.diff }))} /> : <MkTable head={['職種', '今期', '昨年', '差']} align={['l', 'r', 'r', 'r']} rows={M.jobs.map(o => ({ cells: [o.name, MK.man(o.cur), MK.man(o.ly), <b className={o.diff >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(o.diff)}</b>] }))} />}
                    </MkMore>
                    <MkMore title="数字の見方・計算のルール">
                        <ul className="text-base text-gray-600 list-disc ml-5 space-y-1">
                            <li>粗利は売上シート（board）の請求日で月を判定しています。</li>
                            <li>「先週からの増加」は、登録日が比べる時点より後の案件の合計です。登録済み案件の金額修正・削除はこの数字には反映されません。</li>
                            <li>昨年との比較は、昨期売上シートの同じ月どうしで比べています。クライアント名は「株式会社」や空白の違いをそろえてから集計しています。</li>
                            <li>「事業部なし」は、売上シートの事業部欄が第1〜第3以外（空欄を含む）の案件と、全社予算のうち事業部に割り振られていない分です。</li>
                        </ul>
                    </MkMore>
                    <MkNext id="mk_month" onGo={onGo} />
                </div>
            );
        }

        // ② 年間の見通し
        function MkOutlookPage({ monthlyData, divisionMonthlyData, execPL, execItems, execPrev, currentPeriod, view, setView, onGo }) {
            const curIdx = MK.curIdx(currentPeriod);
            const A = useMemo(() => MK.kArr(monthlyData.actualProfit), [monthlyData]);
            const B = useMemo(() => MK.kArr(monthlyData.budgetProfit), [monthlyData]);
            const L = useMemo(() => MK.kArr(monthlyData.lastYearProfit), [monthlyData]);
            const E = useMemo(() => MK.expSeries(execPL, execItems, monthlyData), [execPL, execItems, monthlyData]);
            const PL = useMemo(() => MK.pl(A, B, curIdx, E), [A, B, curIdx, E]);
            const O = PL.P, X = PL.X;
            const actN = Math.min(curIdx, E.closed);
            const expClosedL = E.closed > 0 ? MONTH_LABELS[E.closed - 1] : null;
            const opGap = PL.opLanding - PL.opBudget, xGap = X.landing - X.budgetFY;
            const OPI = MK.probInfo(PL.opProb);
            const XPI = PL.expProb == null ? { tone: 'gray', label: '判定に必要なデータが足りません' } : PL.expProb >= 0.8 ? { tone: 'good', label: '予算内に収まる見込みが高い' } : PL.expProb >= 0.5 ? { tone: 'good', label: '予算内に収まる可能性のほうが高い' } : PL.expProb >= 0.2 ? { tone: 'warn', label: '黄信号：予算を超える可能性が高い' } : { tone: 'bad', label: '赤信号：予算超過がほぼ確実' };
            const divs = useMemo(() => MK.DIVS.map((d, i) => {
                const dm = (divisionMonthlyData && divisionMonthlyData['div' + (i + 1)]) || {};
                return { div: d + '事業部', ...MK.outlook(MK.kArr(dm.profit), MK.kArr(dm.budgetProfit), curIdx) };
            }), [divisionMonthlyData, curIdx]);
            const P = MK.probInfo(O.prob);
            const gap = O.landing - O.budgetFY;
            const progress = MK.sum(A.slice(0, curIdx + 1)), budToNow = MK.sum(B.slice(0, curIdx + 1));
            const lyFY = MK.sum(L), lyToNow = MK.sum(L.slice(0, curIdx + 1));
            const lastClosed = curIdx > 0 ? MONTH_LABELS[curIdx - 1] : null;
            const LE = useMemo(() => MK.lyExp(execPrev), [execPrev]);
            const lyX = LE ? MK.sum(LE) : null, lyOP = LE ? lyFY - lyX : null;
            const lyOPm = LE ? L.map((v, m) => v - LE[m]) : null;
            const NOW = (() => {
                const S = MK.sum, n = actN;
                const pA = S(A.slice(0, n)), pB = S(B.slice(0, n)), pL = S(L.slice(0, n));
                const xA = S(E.A.slice(0, n)), xB = S(E.B.slice(0, n)), xL = LE ? S(LE.slice(0, n)) : null;
                return { n, label: n > 0 ? (n === 1 ? '3月' : `3月〜${MONTH_LABELS[n - 1]}`) : '', rows: [
                    { k: '粗利', a: pA, b: pB, ly: pL > 0 ? pL : null, fy: O.budgetFY, land: O.landing },
                    { k: '販管費', a: xA, b: xB, ly: xL, fy: X.budgetFY, land: X.landing, lowGood: true },
                    { k: '営業利益', a: pA - xA, b: pB - xB, ly: xL != null ? pL - xL : null, fy: PL.opBudget, land: PL.opLanding, main: true }
                ] };
            })();
            const worst = divs.filter(d => d.budgetFY > 0).slice().sort((a, b) => (a.landing - a.budgetFY) - (b.landing - b.budgetFY))[0];

            const lines = O.budgetFY <= 0 ? ['予算が読み込まれていないため、見通しを出せません。'] : curIdx === 0 ? ['期が始まったばかりのため、まだ見通しを出せません（締めた月が3か月以上で計算します）。'] : [
                NOW.n > 0 && <span><b>いまの実績</b>（{NOW.label}の累計）：粗利 <b>{MK.man(NOW.rows[0].a)}</b>（予算比 {MK.pct(NOW.rows[0].a, NOW.rows[0].b)}）、販管費 <b>{MK.man(NOW.rows[1].a)}</b>（予算比 {MK.pct(NOW.rows[1].a, NOW.rows[1].b)}）、営業利益 <b className={NOW.rows[2].a >= NOW.rows[2].b ? 'text-sky-700' : 'text-red-700'}>{MK.man(NOW.rows[2].a)}</b>（予算に {MK.manS(NOW.rows[2].a - NOW.rows[2].b)}）。</span>,
                <span>このままのペースなら、年間の粗利は <b>約{MK.man(O.landing)}</b>（予算に <b className={gap >= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.manS(gap)}</b>）、販管費は <b>約{MK.man(X.landing)}</b>（予算に <b className={xGap <= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.manS(xGap)}</b>）。</span>,
                X.budgetFY > 0 && <span>その結果、営業利益は <b>約{MK.man(PL.opLanding)}</b> で、予算 {MK.man(PL.opBudget)} に <b className={opGap >= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.man(Math.abs(opGap))}{opGap >= 0 ? '届く' : '足りない'}</b> 見込みです。</span>,
                lyFY > 0 && <span>昨年と比べると、粗利は <b className={O.landing >= lyFY ? 'text-sky-700' : 'text-red-700'}>{MK.manS(O.landing - lyFY)}</b>（昨対 {MK.pct(O.landing, lyFY)}）{lyOP != null && <>、販管費は <b className={X.landing <= lyX ? 'text-sky-700' : 'text-red-700'}>{MK.manS(X.landing - lyX)}</b>（昨対 {MK.pct(X.landing, lyX)}）、営業利益は <b className={PL.opLanding >= lyOP ? 'text-sky-700' : 'text-red-700'}>{MK.manS(PL.opLanding - lyOP)}</b>{lyOP > 0 && <>（昨対 {MK.pct(PL.opLanding, lyOP)}）</>}</>} の見込みです。</span>,
                (O.prob != null || PL.opProb != null) && <span>予算を達成できる確率は、粗利 <b>{MK.probText(O.prob)}</b>・営業利益 <b>{MK.probText(PL.opProb)}</b> です。</span>,
                O.needRatio != null && <span>{lastClosed}までの予算達成率は平均 <b>{Math.round(O.rbar * 100)}%</b>。残り{O.remN}か月で予算の <b>{Math.round(O.needRatio * 100)}%</b> を出せば達成できます。</span>,
                worst && worst.landing < worst.budgetFY && <span className="text-lg text-gray-700">いちばん予算に届きにくいのは{worst.div}（見込 {MK.manS(worst.landing - worst.budgetFY)}）です。</span>
            ];

            const chart = useMemo(() => {
                const cum = (arr) => { let s = 0; return arr.map(v => s += v); };
                const cA = cum(A), cP = cum(O.proj), cB = cum(B), cL = cum(L);
                return { labels: MONTH_LABELS, datasets: [
                    { type: 'line', label: '実績（累計）', data: cA.map((v, i) => i < curIdx ? v : null), borderColor: '#f97316', backgroundColor: '#f97316', borderWidth: 4, pointRadius: 4, fill: false, order: 1 },
                    { type: 'line', label: 'このままのペース（見込）', data: cP.map((v, i) => i >= curIdx - 1 && curIdx > 0 ? v : null), borderColor: '#f97316', borderDash: [6, 5], borderWidth: 3, pointRadius: 3, fill: false, order: 2 },
                    { type: 'line', label: '予算（累計）', data: cB, borderColor: '#475569', borderDash: [3, 3], borderWidth: 2, pointRadius: 0, fill: false, order: 3 },
                    { type: 'line', label: '昨年（累計）', data: cL, borderColor: '#c4b5fd', borderWidth: 2, pointRadius: 0, fill: false, order: 4 }

            }, [A, B, L, O, curIdx]);
            const [divMetric, setDivMetric] = useState('o');
            const divPL = useMemo(() => MK.DIVS.map((d, i) => {
                const dm = (divisionMonthlyData && divisionMonthlyData['div' + (i + 1)]) || {};
                const EA = MK.kArr(dm.expenses), EB = MK.kArr(dm.expensesBudget);
                let last = -1; EA.forEach((v, m) => { if (v) last = m; });
                const PLd = MK.pl(MK.kArr(dm.profit), MK.kArr(dm.budgetProfit), curIdx, { A: EA, B: EB, Bfc: EB, closed: last + 1 });
                const n = Math.min(curIdx, last + 1), pA = MK.kArr(dm.profit);
                const ytdP = MK.sum(pA.slice(0, n)), ytdX = MK.sum(EA.slice(0, n));
                return { div: d + '事業部', hasExp: last >= 0 || MK.sum(EB) > 0, n,
                    p: { land: PLd.P.landing, bud: PLd.P.budgetFY, prob: PLd.P.prob, ytd: ytdP },
                    x: { land: PLd.X.landing, bud: PLd.X.budgetFY, prob: PLd.expProb, ytd: ytdX },
                    o: { land: PLd.opLanding, bud: PLd.opBudget, prob: PLd.opProb, ytd: ytdP - ytdX } };
            }), [divisionMonthlyData, curIdx]);
            const DM = { p: { l: '粗利', low: false }, x: { l: '販管費', low: true }, o: { l: '営業利益', low: false } };
            const divDiff = useMemo(() => divPL.filter(d => d[divMetric].bud !== 0).map(d => ({ label: d.div, value: d[divMetric].land - d[divMetric].bud })), [divPL, divMetric]);
            const opChart = useMemo(() => {
                const cum = (arr) => { let s = 0; return arr.map(v => s += v); };
                const cO = cum(PL.opProj), cB = cum(PL.opB);
                return { labels: MONTH_LABELS, datasets: [
                    { type: 'bar', label: '営業利益（月ごと）', data: PL.opProj, backgroundColor: PL.opProj.map((v, i) => i < actN ? (v >= 0 ? '#93c5fd' : '#fca5a5') : (v >= 0 ? 'rgba(147,197,253,0.4)' : 'rgba(252,165,165,0.4)')), borderRadius: 4, order: 4 },
                    { type: 'line', label: '実績（累計）', data: cO.map((v, i) => i < actN ? v : null), borderColor: '#2563eb', backgroundColor: '#2563eb', borderWidth: 4, pointRadius: 4, fill: false, order: 1 },
                    { type: 'line', label: 'このままのペース（累計）', data: cO.map((v, i) => i >= actN - 1 && actN > 0 ? v : null), borderColor: '#2563eb', borderDash: [6, 5], borderWidth: 3, pointRadius: 3, fill: false, order: 2 },
                    { type: 'line', label: '予算（累計）', data: cB, borderColor: '#475569', borderDash: [3, 3], borderWidth: 2, pointRadius: 0, fill: false, order: 3 },
                    ...(lyOPm ? [{ type: 'line', label: '昨年（累計）', data: cum(lyOPm), borderColor: '#c4b5fd', borderWidth: 2, pointRadius: 0, fill: false, order: 5 }] : [])
                ] };
            }, [PL, actN, lyOPm]);

            return (
                <div className="space-y-6">
                    <MkHead id="mk_outlook" view={view} setView={setView} />
                    <MkVerdict tone={PL.opProb != null ? OPI.tone : O.prob == null ? MK.toneOfRatio(O.landing, O.budgetFY) : P.tone} lines={lines} />
                    <MkSection title={`いまの実績（${NOW.label || '—'}の累計）`} lead={`締めた月までの実績です。${E.closed < curIdx && NOW.n > 0 ? `販管費が${MONTH_LABELS[NOW.n - 1]}までしか締まっていないため、粗利もそろえて${MONTH_LABELS[NOW.n - 1]}までで比べています。` : ''}予算・昨年は同じ期間どうしで比べています。`}>
                        {NOW.n === 0 ? <MkEmpty>締めた月がまだありません</MkEmpty> : view === 'table' ? (
                            <MkTable head={['', '累計の実績', '同じ期間の予算', '予算比', '予算との差', '昨年の同じ期間', '昨対', '昨年との差', '通期予算に対する進み具合']} align={['l', 'r', 'r', 'r', 'r', 'r', 'r', 'r', 'r']}
                                rows={NOW.rows.map(r => { const okB = r.lowGood ? r.a <= r.b : r.a >= r.b, okL = r.ly == null ? null : (r.lowGood ? r.a <= r.ly : r.a >= r.ly); return { cls: r.main ? 'bg-sky-50/50 font-bold' : '', cells: [<b>{r.k}</b>, <b>{MK.man(r.a)}</b>, MK.man(r.b), MK.pct(r.a, r.b), <span className={okB ? 'text-sky-600' : 'text-red-600'}>{MK.manS(r.a - r.b)}</span>, r.ly == null ? '—' : MK.man(r.ly), r.ly > 0 ? MK.pct(r.a, r.ly) : '—', r.ly == null ? '—' : <span className={okL ? 'text-sky-600' : 'text-red-600'}>{MK.manS(r.a - r.ly)}</span>, r.fy > 0 ? `${MK.pct(r.a, r.fy)}（予算どおりなら${MK.pct(r.b, r.fy)}）` : '—'] }; })} />
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                                {NOW.rows.map(r => {
                                    const okB = r.lowGood ? r.a <= r.b : r.a >= r.b, cB = okB ? 'text-sky-700' : 'text-red-700';
                                    const okL = r.ly == null ? null : (r.lowGood ? r.a <= r.ly : r.a >= r.ly), cL = okL ? 'text-sky-700' : 'text-red-700';
                                    const prog = r.fy > 0 ? Math.max(0, Math.min(1, r.a / r.fy)) : null, pace = r.fy > 0 ? Math.max(0, Math.min(1, r.b / r.fy)) : null;
                                    return (
                                        <div key={r.k} className={`rounded-2xl border p-5 bg-gray-50 ${r.main ? 'border-sky-300' : 'border-gray-200'}`}>
                                            <div className="text-lg font-bold text-gray-700">{r.k}<span className="text-sm font-normal text-gray-400 ml-2">累計の実績</span></div>
                                            <div className="text-3xl font-extrabold text-gray-800 mt-1">{MK.man(r.a)}</div>
