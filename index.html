path:m19 12-7 7-7", Alert: "path:M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01", Calendar: "rect:3,4,18,18,2,2|line:16,2,16,6|line:8,2,8,6|line:3,10,21,10", Upload: "path:M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4|polyline:17 8 12 3 7 8|line:12,3,12,15", Div1: "circle:12,12,10|text:1", Div2: "rect:4,4,16,16,2|text:2", Div3: "polygon:12 2 22 22 2 22|text:3", Tier1: "circle:12,12,10|text:1", Tier2: "circle:12,12,10|text:2", Tier3: "circle:12,12,10|text:3", Film: "rect:2,2,20,20,2.18,2.18|line:7,2,7,22|line:17,2,17,22|line:2,12,22,12|line:2,7,7,7|line:2,17,7,17|line:17,7,22,7|line:17,17,22,17", History: "circle:12,12,9|polyline:12 6 12 12 16 14",
            Download: "path:M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4|polyline:7 10 12 15 17 10|line:12,15,12,3",
            FileText: "path:M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z|polyline:14 2 14 8 20 8|line:16,13,8,13|line:16,17,8,17|polyline:10 9 9 9 8 9"
        };
        const CLS = { TH: "px-4 py-3 text-xs font-semibold text-gray-500 uppercase bg-gray-100 border-b border-gray-200 whitespace-nowrap sticky top-0 z-10 select-none", TD: "px-4 py-4 text-sm text-gray-700 border-b border-gray-100 align-middle", NAV_BTN: "px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200 cursor-pointer flex items-center justify-start gap-1 select-none whitespace-nowrap flex-shrink-0 border border-gray-300", NAV_BTN_ACTIVE: "bg-blue-600 text-white shadow-lg shadow-blue-500/50 font-extrabold border-blue-700", NAV_BTN_INACTIVE: "bg-white text-gray-700 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-700" };

        function Icon({ name, size = 20, color = "currentColor", className = "" }) {
            const d = ICONS[name]; if (!d) return <svg width={size} height={size} className={className} />;
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{d.includes('|') ? d.split('|').map((p, i) => { const [t, v] = p.split(':'); if (t === 'circle') { const [cx, cy, r] = v.split(','); return <circle key={i} cx={cx} cy={cy} r={r} /> } if (t === 'rect') { const [x, y, w, h, rx, ry] = v.split(','); return <rect key={i} x={x} y={y} width={w} height={h} rx={rx} ry={ry} /> } if (t === 'line') { const [x1, y1, x2, y2] = v.split(','); return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} /> } if (t === 'polyline') return <polyline key={i} points={v} />; if (t === 'polygon') return <polygon key={i} points={v} />; if (t === 'text') return <text key={i} x="12" y="16" fontSize="12" textAnchor="middle" stroke="none" fill="currentColor">{v}</text>; return <path key={i} d={v} /> }) : <path d={d} />}</svg>;
        }

        // --- 3. Utils ---
        const Utils = {
            parseCurrency: (s) => { if (!s) return 0; if (typeof s === 'number') return s; const r = parseInt(String(s).replace(/[¥￥,，\s"”]/g, ''), 10); return isNaN(r) ? 0 : r; },
            formatYen: (n) => '¥' + (isNaN(Number(n)) ? 0 : Math.floor(Number(n))).toLocaleString(),
            safeSum: (arr) => (Array.isArray(arr) ? arr : []).reduce((a, b) => a + (Number(b) || 0), 0) * 1000,
            parseDate: (s) => { if (!s) return new Date(0); if (s instanceof Date) return s; const str = String(s).trim(); if (!str) return new Date(0); let d = new Date(str); if (!isNaN(d.getTime())) return d; d = new Date(str.replace(/-/g, '/')); if (!isNaN(d.getTime())) return d; if (str.includes('T')) { d = new Date(str.split('T')[0].replace(/-/g, '/')); if (!isNaN(d.getTime())) return d; } return new Date(0); },
            getFiscalMonthIndex: (dStr) => { if (!dStr) return -1; const d = Utils.parseDate(dStr); if (isNaN(d.getTime()) || d.getFullYear() < 2000) return -1; const m = d.getMonth(); let i = m - 2; if (i < 0) i += 12; return i; },
            getJobCategory: (n) => { if (!n) return 'その他案件'; const name = String(n); for (const k of ['広告', 'パブ', 'SNS', 'WEB', '制作', '宣伝', 'プロ']) if (name.includes(k)) return k === 'SNS' ? 'SNS運用' : (k === 'WEB' || k === '制作') ? 'WEB制作' : (k === '宣伝' || k === 'プロ') ? '宣プロ' : k; return 'その他案件'; },
            calculateCumulative: (d) => { let s = 0; return (Array.isArray(d) ? d : []).map(v => s += (Number(v) || 0)); }
        };

        // --- 3.5 Forecast Engine（計上カーブ自動算出） ---
        const FC = {
            BUILD: 'v15.3',
            OFFSETS: [-7, -6, -5, -4, -3, -2, -1, 0, 1, 2, 3],
            JOBS: [
                { db: 'パブ', cat: 'パブ' },
                { db: 'SNS', cat: 'SNS運用' },
                { db: '制作', cat: 'WEB制作' },
                { db: '広告', cat: '広告' },
                { db: 'その他', cat: 'その他案件' }
            ],
            FALLBACK: { '-7': 0.02, '-6': 0.04, '-5': 0.07, '-4': 0.11, '-3': 0.16, '-2': 0.20, '-1': 0.20, '0': 0.13, '1': 0.05, '2': 0.02, '3': 0.00 },
            MIN_SAMPLE: 25,
            MIN_CONSUMED: 0.20,
            monthKey: (v) => { const d = Utils.parseDate(v); if (!d || isNaN(d.getTime()) || d.getFullYear() < 2000) return null; return d.getFullYear() * 12 + d.getMonth(); },
            periodStartKey: (period) => (1995 + Number(period || 0)) * 12 + 2,
            // 年まで見て当期内の会計月(0=3月)を返す。期外は -1
            fiscalIdx: (v, pStart) => { const k = FC.monthKey(v); if (k == null) return -1; const i = k - pStart; return (i >= 0 && i <= 11) ? i : -1; },
            ERA: { current: { label: '今期公開', cls: 'bg-blue-50 text-blue-600 border-blue-200' }, future: { label: '来期公開', cls: 'bg-indigo-50 text-indigo-600 border-indigo-200' }, past: { label: '過年度公開', cls: 'bg-gray-100 text-gray-500 border-gray-200' }, unknown: { label: '公開日不明', cls: 'bg-gray-100 text-gray-400 border-gray-200' } },
            normalize: (obj) => { const t = FC.OFFSETS.reduce((s, o) => s + (obj[o] || 0), 0); const out = {}; FC.OFFSETS.forEach(o => out[o] = t > 0 ? (obj[o] || 0) / t : 0); return out; },

            build: (pool, workMap) => {
                const raw = {}, margin = {}, n = {};
                C.CATS.forEach(c => { raw[c] = {}; FC.OFFSETS.forEach(o => raw[c][o] = 0); margin[c] = { s: 0, p: 0 }; n[c] = 0; });
                const rawAll = {}; FC.OFFSETS.forEach(o => rawAll[o] = 0);
                let matched = 0, unmatched = 0, amtAll = 0, mS = 0, mP = 0;
                (pool || []).forEach(p => {
                    const cat = Utils.getJobCategory(p.job);
                    const s = Number(p.sales) || 0, pr = Number(p.profit) || 0;
                    if (s > 0) { margin[cat].s += s; margin[cat].p += pr; mS += s; mP += pr; }
                    const w = workMap[String(p.managerId || '').trim()];
                    const bk = FC.monthKey(p.date);
                    if (s <= 0) return;
                    if (!w || w.relKey == null || bk == null) { unmatched++; return; }
                    const off = bk - w.relKey;
                    if (off < FC.OFFSETS[0] || off > FC.OFFSETS[FC.OFFSETS.length - 1]) { unmatched++; return; }
                    raw[cat][off] += s; rawAll[off] += s; n[cat]++; matched++; amtAll += s;
                });
                const overall = amtAll > 0 ? FC.normalize(rawAll) : FC.FALLBACK;
                const curves = {};
                C.CATS.forEach(c => {
                    const tot = FC.OFFSETS.reduce((a, o) => a + raw[c][o], 0);
                    const enough = n[c] >= FC.MIN_SAMPLE && tot > 0;
                    curves[c] = {
                        shares: enough ? FC.normalize(raw[c]) : overall,
                        n: n[c], amount: tot,
                        source: enough ? 'own' : (amtAll > 0 ? 'overall' : 'default'),
                        margin: margin[c].s > 0 ? margin[c].p / margin[c].s : 0
                    };
                });
                return { curves, overall, matched, unmatched, amount: amtAll, overallMargin: mS > 0 ? mP / mS : 0, ready: matched > 0 };
            },

            blendShares: (fc, jobAmounts) => {
                let tot = 0; C.CATS.forEach(c => tot += (jobAmounts && jobAmounts[c]) || 0);
                if (tot <= 0) return fc.overall;
                const out = {}; FC.OFFSETS.forEach(o => out[o] = 0);
                C.CATS.forEach(c => {
                    const a = (jobAmounts && jobAmounts[c]) || 0; if (a <= 0) return;
                    const sh = (fc.curves[c] && fc.curves[c].shares) || fc.overall;
                    FC.OFFSETS.forEach(o => out[o] += (sh[o] || 0) * a / tot);
                });
                return FC.normalize(out);
            },

            blendMargin: (fc, jobAmounts) => {
                let tot = 0, acc = 0;
                C.CATS.forEach(c => { const a = (jobAmounts && jobAmounts[c]) || 0; if (a <= 0) return; tot += a; acc += a * ((fc.curves[c] && fc.curves[c].margin) || 0); });
                return tot > 0 ? acc / tot : fc.overallMargin;
            },

            // 残額を将来月（minIdx以降）へカーブ比率で配分
            distribute: (amount, relKey, pStart, shares, minIdx) => {
                const out = Array(12).fill(0);
                if (!amount || amount <= 0 || relKey == null) return out;
                const slots = []; let w = 0;
                FC.OFFSETS.forEach(o => {
                    const sh = shares[o] || 0; if (sh <= 0) return;
                    const fi = relKey + o - pStart;
                    if (fi < 0 || fi > 11 || fi < minIdx) return;
                    slots.push({ fi, sh }); w += sh;
                });
                if (w <= 0) {
                    let fi = relKey - pStart; if (fi < minIdx) fi = minIdx;
                    if (fi < 0 || fi > 11) return out;
                    out[fi] += amount; return out;
                }
                slots.forEach(s => { out[s.fi] += amount * s.sh / w; });
                return out;
            },

            // 期内の将来月にカーブの受け皿があるか
            hasFutureSlot: (relKey, pStart, shares, minIdx) => {
                if (relKey == null) return false;
                return FC.OFFSETS.some(o => (shares[o] || 0) > 0.005 && (relKey + o - pStart) >= minIdx && (relKey + o - pStart) <= 11);
            },

            // 継続計上の見込。単発計上は対象外にし、直近の減衰トレンドを反映して逓減させる
            runRateFc: (arr, curIdx, factor) => {
                const out = Array(12).fill(0);
                if (!arr || factor <= 0 || curIdx >= 12) return out;
                const win = (a, b) => { const xs = []; for (let i = Math.max(0, a); i < Math.max(0, b); i++) xs.push(Number(arr[i]) || 0); return xs; };
                const rec = win(curIdx - 3, curIdx);
                if (rec.length < 2) return out;
                if (rec.filter(v => v > 0).length < 2) return out;   // 単発の計上は継続と見なさない
                const recent = rec.reduce((a, b) => a + b, 0) / rec.length;
                if (recent <= 0) return out;
                const pri = win(curIdx - 6, curIdx - 3);
                const prior = pri.length ? pri.reduce((a, b) => a + b, 0) / pri.length : 0;
                const trend = prior > 0 ? Math.min(1, recent / prior) : 1;   // 増加は見込まない
                const decay = Math.pow(trend, 1 / 3);
                let v = recent * factor;
                for (let i = curIdx; i < 12; i++) { v = v * decay; out[i] = Math.max(0, v - (i === curIdx ? (Number(arr[i]) || 0) : 0)); }
                return out;
            },

            // 締め済み月までに本来消化されているはずの比率
            consumedShare: (relKey, shares, lastClosedKey) => {
                if (relKey == null) return 0;
                let acc = 0;
                FC.OFFSETS.forEach(o => { if (relKey + o <= lastClosedKey) acc += (shares[o] || 0); });
                return acc;
            }
        };

        // --- 4. Logic ---
        const DataProcessor = {
            processLastYearData: (rows) => {
                if (!rows || !Array.isArray(rows) || rows.length === 0) return null;
                let headerIndex = -1; let header = null;

                <div className="flex bg-gray-100 p-1 rounded-lg">

        // --- 7. Section Components ---
        function RecentGrowthCard({ title, data, period, setPeriod, recentProjects, worksMaster }) {
            const cols = useMemo(() => [
                { key: 'date', label: '請求日', sortable: true, render: (p)=>p.date?p.date.substring(0,10):'-', className: 'text-gray-500 font-mono' },
                { key: 'managerId', label: '作品名', sortable: true, render: (p)=>(worksMaster&&worksMaster[p.managerId])||'-', className: 'font-medium text-indigo-900' },

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                        <div className="flex flex-col items-center justify-center p-3 bg-white rounded-xl border border-blue-100 shadow-sm"><span className="text-xs text-gray-500 font-medium mb-1">件数</span><span className="text-xl font-extrabold text-blue-600 font-mono">{data.totalCount.toLocaleString()}<span className="text-xs text-gray-400 ml-1 font-normal font-sans">件</span></span></div>
                        <div className="flex flex-col items-center justify-center p-3 bg-white rounded-xl border border-indigo-100 shadow-sm"><span className="text-xs text-gray-500 font-medium mb-1">売上</span><span className="text-xl font-extrabold text-indigo-600 font-mono">{Utils.formatYen(data.totalSales)}</span></div>
                        <div className="flex flex-col items-center justify-center p-3 bg-white rounded-xl border border-green-100 shadow-sm"><span className="text-xs text-gray-500 font-medium mb-1">粗利</span><span className="text-xl font-extrabold text-green-600 font-mono">{Utils.formatYen(data.totalProfit)}</span></div>
                        <div className="flex flex-col items-center justify-center p-3 bg-white rounded-xl border border-yellow-100 shadow-sm"><span className="text-xs text-gray-500 font-medium mb-1">粗利率</span><span className="text-xl font-extrabold text-yellow-600 font-mono">{data.marginRate.toFixed(1)}<span className="text-sm ml-0.5 font-sans">%</span></span></div>
                    </div>
                    <div className="bg-white rounded-lg border border-indigo-100 overflow-hidden"><DataTable columns={cols} data={recentProjects} defaultSort={defaultSort} height="h-auto" /></div>
                </div>
            );
        }

        function ProfitShareSection({ projects, title }) {
            const map = {}; C.CATS.forEach(c => map[c]=0); (projects||[]).forEach(p => { map[Utils.getJobCategory(p.job)] += p.profit/1000; });
            const data = { labels: C.CATS, datasets: [{ data: C.CATS.map(c=>map[c]), backgroundColor: C.CATS.map(c=>C.CAT_COLORS[c]) }] };
            return (
                <div className="bg-white p-6 rounded-xl card-shadow mt-6"><div className="flex justify-between items-center mb-4"><h2 className="text-lg font-bold text-gray-800 flex items-center"><span className="mr-2 text-blue-600"><Icon name="PieChart" size={20}/></span> {title}</h2></div><div className="h-64 w-full"><ChartComponent type="doughnut" data={data} options={{ plugins: { legend: { position: 'right' }, tooltip: { callbacks: { label: (c) => { let sum=0; c.chart.data.datasets[0].data.forEach(d=>sum+=d); const pct=sum>0?(c.raw/sum*100).toFixed(1):'0.0'; return `${c.label}: ${Utils.formatYen(c.raw*1000)} (${pct}%)`; } } }, datalabels: { color: '#fff', font: { weight: 'bold' }, formatter: (value, ctx) => { let sum = 0; ctx.chart.data.datasets[0].data.map(d=>sum+=d); return sum===0?"":(value*100/sum).toFixed(1)+"%"; } } } }} /></div></div>
            );

        function DashboardDivisionAnalysis({ monthlyData, divisionMonthlyData, divisionData }) {
            const getDivData = (key) => (divisionMonthlyData && divisionMonthlyData[key]) ? divisionMonthlyData[key] : {};
            const getProfit = (key) => (getDivData(key).profit || Array(12).fill(0));
            const stackedData = { labels: monthlyData.labels || [], datasets: [ { label: '第1事業部', data: getProfit('div1').map(v=>(v||0)*1000), backgroundColor: '#60A5FA', stack: 'stack' }, { label: '第2事業部', data: getProfit('div2').map(v=>(v||0)*1000), backgroundColor: '#34D399', stack: 'stack' }, { label: '第3事業部', data: getProfit('div3').map(v=>(v||0)*1000), backgroundColor: '#FBBF24', stack: 'stack' } ] };
            const donutData = { labels: ['第1事業部', '第2事業部', '第3事業部'], datasets: [{ data: (divisionData.profit || [0,0,0]).map(v=>(v||0)*1000), backgroundColor: ['#60A5FA', '#34D399', '#FBBF24'] }] };
            return (
                <div className="bg-white p-6 rounded-xl card-shadow mt-6"><div className="flex justify-between items-center mb-6"><h2 className="text-lg font-bold text-gray-800 flex items-center"><span className="mr-2 text-blue-600"><Icon name="TrendingUp" size={20}/></span> 事業部別 粗利分析</h2></div><div className="grid grid-cols-1 lg:grid-cols-3 gap-8"><div className="lg:col-span-2 border-r border-gray-100 pr-0 lg:pr-8"><h3 className="text-sm font-bold text-gray-500 mb-4 text-center">月次 粗利推移 (積み上げ)</h3><div className="h-64 w-full"><ChartComponent type="bar" data={stackedData} options={{ scales: { x: { stacked: true }, y: { stacked: true, ticks: { callback: v => Utils.formatYen(v) } } } }} /></div></div><div className="lg:col-span-1"><h3 className="text-sm font-bold text-gray-500 mb-4 text-center">年間 粗利構成比</h3><div className="h-64 w-full"><ChartComponent type="doughnut" data={donutData} options={{ plugins: { tooltip: { callbacks: { label: (c) => { let sum=0; c.chart.data.datasets[0].data.forEach(d=>sum+=d); const pct=sum>0?(c.raw/sum*100).toFixed(1):'0.0'; return `${c.label}: ${Utils.formatYen(c.raw)} (${pct}%)`; } } }, datalabels: { color: '#fff', formatter: (v,c)=>{ let s=0; c.chart.data.datasets[0].data.map(d=>s+=d); return s===0?"":(v/s*100).toFixed(1)+"%"; } } } }} /></div></div></div></div>
            );
        }

        function RankedProjectsSection({ projects, title }) {
            const cols = [
                { key: 'index', label: '#', align: 'center', width: 'w-8', render: (r,i)=>i+1, className: 'font-bold text-gray-500' },
                { key: 'name', label: '作品名', className: 'font-medium text-gray-800 truncate max-w-[200px]' },
                { key: 'clientDisplay', label: 'クライアント名', className: 'text-gray-600 truncate max-w-[150px]' },
                { key: 'sales', label: '売上', align: 'right', render: (r)=>Utils.formatYen(r.sales), className: 'font-mono text-gray-600' },
                { key: 'profit', label: '粗利', align: 'right', render: (r)=>Utils.formatYen(r.profit), className: 'font-mono text-blue-600 font-bold' },
                { key: 'margin', label: '粗利率', align: 'right', render: (r)=>(r.sales>0?r.profit/r.sales*100:0).toFixed(1)+'%', className: 'font-mono text-gray-500' },
                { key: 'count', label: '案件数', align: 'right', className: 'font-mono text-gray-500' }

            return (
                <div className="bg-white p-6 rounded-xl card-shadow mt-6"><h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center"><span className="mr-2 text-yellow-500"><Icon name="Star" size={20}/></span> {title}</h3><DataTable columns={cols} data={projects} height="h-auto" /></div>
            );
        }

        function RankedClientsSection({ clients }) {
            const cols = [
                { key: 'index', label: '#', align: 'center', width: 'w-8', render: (r,i)=>i+1, className: 'font-bold text-gray-500' },
                { key: 'name', label: 'クライアント', className: 'font-medium text-gray-800 truncate max-w-[150px]' },
                { key: 'profit', label: '粗利', align: 'right', render: (r)=>Utils.formatYen(r.profit), className: 'font-mono text-blue-600' },

            return (
                <div className="bg-white p-6 rounded-xl card-shadow"><h3 className="text-lg font-bold text-gray-800 mb-4">主要クライアント (Top 10) - 粗利</h3><DataTable columns={cols} data={clients} height="h-auto" /></div>
            );
        }

        // --- 8. Page Components ---

        function HistoricalPage({ monthlyData, historicalData, projectList, lastYearProjectList, currentPeriod }) {
            const [historyViewMode, setHistoryViewMode] = useState('profit');

            const { dataSet, jobChartData, unitPriceData, clientConcentrationData } = useMemo(() => {
                const combined = [];
                const aggregateProjects = (projects, yearLabel) => {
                    const jobMap = {}; C.CATS.forEach(c => jobMap[c] = 0);
                    let totalProfit = 0, projectCount = 0; const clientMap = {};
                    if(projects && Array.isArray(projects)) {
                        projects.forEach(p => {
                            const j = Utils.getJobCategory(p.job);
                            if (jobMap[j] !== undefined) jobMap[j] += p.profit; else jobMap['その他案件'] = (jobMap['その他案件']||0) + p.profit;
                            totalProfit += p.profit; projectCount += 1; clientMap[p.client] = (clientMap[p.client] || 0) + p.profit;
                        });
                    }
                    const sortedClients = Object.values(clientMap).sort((a, b) => b - a);
                    const top5Profit = sortedClients.slice(0, 5).reduce((a, b) => a + b, 0);
                    return { jobMap, projectCount, concentration: totalProfit > 0 ? (top5Profit / totalProfit * 100) : 0 };
                };

                Object.keys(historicalData).sort().forEach(year => {
                   const d = historicalData[year];
                   if(d && d.agg) {
                       const s = Utils.safeSum(d.agg.s), p = Utils.safeSum(d.agg.p);
                       let js = { jobMap: {}, projectCount: 0, concentration: 0 };
                       if (d.projects) js = aggregateProjects(d.projects, year);
                       combined.push({ year: year + '期', sales: s, profit: p, monthly: d.agg.p, jobBreakdown: js.jobMap, count: js.projectCount, avgProfit: js.projectCount > 0 ? p / js.projectCount : 0, concentration: js.concentration });
                   }
                });

                const lastPeriod = currentPeriod - 1;
                if (!combined.some(d => d.year === lastPeriod + '期') && monthlyData.lastYear) {
                    const s = Utils.safeSum(monthlyData.lastYear), p = Utils.safeSum(monthlyData.lastYearProfit);
                    const js = lastYearProjectList ? aggregateProjects(lastYearProjectList, String(lastPeriod)) : { jobMap: {}, projectCount: 0, concentration: 0 };
                    combined.push({ year: lastPeriod + '期', sales: s, profit: p, monthly: monthlyData.lastYearProfit, jobBreakdown: js.jobMap, count: js.projectCount, avgProfit: js.projectCount > 0 ? p / js.projectCount : 0, concentration: js.concentration });
                }

                if (monthlyData.actual) {
                    const s = Utils.safeSum(monthlyData.actual), p = Utils.safeSum(monthlyData.actualProfit);
                    const js = projectList ? aggregateProjects(projectList, String(currentPeriod)) : { jobMap: {}, projectCount: 0, concentration: 0 };
                    combined.push({ year: currentPeriod + '期(今期)', sales: s, profit: p, monthly: monthlyData.actualProfit, jobBreakdown: js.jobMap, count: js.projectCount, avgProfit: js.projectCount > 0 ? p / js.projectCount : 0, concentration: js.concentration });
                }

                combined.sort((a, b) => parseInt(a.year) - parseInt(b.year));
                const periods = combined.map(d => d.year);
                const tableData = combined.map((d, i, arr) => ({ ...d, margin: d.sales > 0 ? d.profit / d.sales * 100 : 0, yoy: i > 0 && arr[i-1].profit > 0 ? (d.profit / arr[i-1].profit * 100) : 0 }));
                const jobDatasets = C.CATS.map(cat => ({ label: cat, data: combined.map(d => (d.jobBreakdown && d.jobBreakdown[cat]) || 0), backgroundColor: C.CAT_COLORS[cat], stack: 'stack1' }));
                const unitPriceDatasets = [
                    { label: '平均案件粗利 (単価)', data: combined.map(d => d.avgProfit), borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3 },
                    { label: '案件数', data: combined.map(d => d.count), hidden: true }
                ];
                const concentrationDatasets = [{ label: '上位5社 粗利シェア (%)', data: combined.map(d => d.concentration), borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.2)', fill: true, tension: 0.3 }];

                return { dataSet: tableData, jobChartData: { labels: periods, datasets: jobDatasets }, unitPriceData: { labels: periods, datasets: unitPriceDatasets }, clientConcentrationData: { labels: periods, datasets: concentrationDatasets } };
            }, [monthlyData, historicalData, projectList, lastYearProjectList, currentPeriod]);

            const monthlyAverages = useMemo(() => {
                const sums = Array(12).fill(0);
                const counts = Array(12).fill(0);
                dataSet.forEach(d => {
                    (d.monthly || []).forEach((val, idx) => {
                        if (val !== 0) {
                            sums[idx] += val;
                            counts[idx]++;
                        }
                    });
                });
                return sums.map((s, i) => counts[i] ? s / counts[i] : 0);
            }, [dataSet]);

            const historyChartData = useMemo(() => {
                const labels = dataSet.map(d => d.year);
                if (historyViewMode === 'sales') {
                    return { labels, datasets: [ { type: 'line', label: '案件数', data: dataSet.map(d => d.count), yAxisID: 'y1', borderColor: '#ef4444', borderWidth: 2, fill: false, tension: 0.1 }, { type: 'bar', label: '売上', data: dataSet.map(d => d.sales), yAxisID: 'y', backgroundColor: '#3b82f6', borderRadius: 4, order: 2, barPercentage: 0.5 } ] };
                } else {
                    return { labels, datasets: [ { type: 'line', label: '粗利率', data: dataSet.map(d => d.margin), yAxisID: 'y1', borderColor: '#ef4444', borderWidth: 2, fill: false, tension: 0.1 }, { type: 'bar', label: '粗利', data: dataSet.map(d => d.profit), yAxisID: 'y', backgroundColor: '#f97316', borderRadius: 4, order: 2, barPercentage: 0.5 } ] };
                }
            }, [dataSet, historyViewMode]);

            const lineData = {
                labels: MONTH_LABELS,
                datasets: [
                    ...dataSet.map((d, i) => ({ label: d.year, data: (d.monthly || []).map(v => v * 1000), borderColor: i === dataSet.length - 1 ? '#3b82f6' : C.CHART[i % C.CHART.length], backgroundColor: 'transparent', borderWidth: i === dataSet.length - 1 ? 3 : 2, borderDash: i === dataSet.length - 1 ? [] : [2,2], hidden: false })),
                    { label: '過去平均', data: monthlyAverages.map(v => v * 1000), borderColor: '#1e293b', borderWidth: 4, pointRadius: 0, tension: 0.4, fill: false, order: 0 }
                ]
            };

            const cols = [
                { key: 'year', label: '期', className: 'font-bold' },
                { key: 'sales', label: '売上', align: 'right', className: 'font-mono text-gray-600', render: (r) => Utils.formatYen(r.sales) },
                { key: 'profit', label: '粗利', align: 'right', className: 'font-mono font-bold text-blue-600', render: (r) => Utils.formatYen(r.profit) },
                { key: 'margin', label: '利益率', align: 'right', className: 'font-mono text-gray-600', render: (r) => r.margin.toFixed(1) + '%' },
                { key: 'count', label: '案件数', align: 'right', className: 'font-mono text-gray-600', render: (r) => r.count + '件' },
                { key: 'yoy', label: '粗利昨対', align: 'right', className: 'font-mono', render: (r) => r.yoy ? r.yoy.toFixed(1) + '%' : '-', className: r => r.yoy >= 100 ? 'text-green-600 font-mono' : 'text-red-500 font-mono' },
                { key: 'avgProfit', label: '平均単価', align: 'right', className: 'font-mono text-gray-600', render: (r) => Utils.formatYen(r.avgProfit) }
            ];

            // 職種別データを転置（縦軸=職種、横軸=期）
            const jobTableData = useMemo(() => {
                return C.CATS.map(cat => {
                    const row = { jobCategory: cat };
                    dataSet.forEach(d => {
                        row[d.year] = (d.jobBreakdown && d.jobBreakdown[cat]) || 0;
                    });
                    return row;
                });
            }, [dataSet]);

            const periods = dataSet.map(d => d.year);
            const periodCount = periods.length;
            // グラフと揃えるため、職種列は固定幅、各期の列は均等配分
            const jobCategoryWidth = '100px';
            const periodWidth = `calc((100% - 100px) / ${periodCount})`;

            const jobTableCols = [
                { key: 'jobCategory', label: '職種', className: 'font-bold text-xs whitespace-nowrap', style: { width: jobCategoryWidth, minWidth: jobCategoryWidth } },
                ...periods.map(p => ({
                    key: p,
                    label: p,
                    align: 'center',
                    className: 'font-mono text-gray-600 text-xs',
                    style: { width: periodWidth, minWidth: periodWidth },
                    render: (r) => Utils.formatYen(r[p] || 0)
                }))
            ];

            return (
                <div className="space-y-6 animate-in">
                    <div className="bg-white p-6 rounded-xl card-shadow">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="TrendingUp" /> 長期業績推移 (23期〜{currentPeriod}期)</h2>
                            <div className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setHistoryViewMode('sales')} className={`px-4 py-1.5 text-xs font-bold rounded-md transition-all ${historyViewMode === 'sales' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}>売上・案件数</button>
                                <button onClick={() => setHistoryViewMode('profit')} className={`px-4 py-1.5 text-xs font-bold rounded-md transition-all ${historyViewMode === 'profit' ? 'bg-white text-orange-600 shadow-sm' : 'text-gray-500'}`}>粗利・粗利率</button>
                            </div>
                        </div>
                        <div className="h-80 w-full">
                            <ChartComponent type="bar" data={historyChartData} options={{ responsive: true, maintainAspectRatio: false, layout: { padding: { left: 0, right: 0 } }, scales: { x: { grid: { offset: false } }, y: { type: 'linear', position: 'left', ticks: { callback: v => Utils.formatYen(v) } }, y1: { type: 'linear', position: 'right', grid: { display: false }, ticks: { callback: v => historyViewMode === 'sales' ? v + '件' : v + '%' }, min: 0 } }, datasets: { bar: { barPercentage: 0.5, categoryPercentage: 0.8 } }, plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.dataset.type === 'line' ? (historyViewMode==='sales'?c.raw+'件':c.raw.toFixed(1)+'%') : Utils.formatYen(c.raw)}` } } } }} />
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl card-shadow mt-6">
                        <h2 className="text-lg font-bold text-gray-800 mb-4">職種別 粗利構成の推移</h2>
                        <div className="flex flex-col gap-6">
                            <div className="w-full h-80">
                                <ChartComponent type="bar" data={jobChartData} options={{ maintainAspectRatio: false, layout: { padding: { left: 0, right: 0 } }, scales: { x: { stacked: true, grid: { offset: false } }, y: { stacked: true, ticks: { callback: v => Utils.formatYen(v) } } }, datasets: { bar: { barPercentage: 0.5, categoryPercentage: 0.8 } }, plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${Utils.formatYen(c.raw)}` } } } }} />
                            </div>
                            <div className="w-full">
                                <h4 className="text-sm font-bold text-gray-500 mb-2">詳細データ</h4>
                                <div className="overflow-x-auto">
                                    <DataTable columns={jobTableCols} data={jobTableData} height="h-auto" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl card-shadow mt-6">
                        <h2 className="text-lg font-bold text-gray-800 mb-4">月次 粗利トレンド比較 (季節性分析)</h2>
                        <div className="w-full h-80">
                            <ChartComponent type="line" data={lineData} options={{ responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { callback: v => Utils.formatYen(v) } } }, plugins: { legend: { position: 'bottom' } } }} />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
                        <div className="bg-white p-6 rounded-xl card-shadow"><h2 className="text-lg font-bold text-gray-800 mb-4">平均案件粗利 (生産性指標)</h2><div className="h-64 w-full"><ChartComponent type="line" data={unitPriceData} options={{ scales: { y: { ticks: { callback: v => Utils.formatYen(v) } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { const datasetIndex = context.datasetIndex; const dataIndex = context.dataIndex; if (datasetIndex === 0) { const avgProfit = context.parsed.y; const count = context.chart.data.datasets[1].data[dataIndex]; return [`案件数: ${count}件`, `平均案件粗利（単価）: ¥${Math.floor(avgProfit).toLocaleString()}`]; } return ''; } } } } }} /></div></div>
                        <div className="bg-white p-6 rounded-xl card-shadow"><h2 className="text-lg font-bold text-gray-800 mb-4">上位5社 粗利依存度 (リスク指標)</h2><div className="h-64 w-full"><ChartComponent type="line" data={clientConcentrationData} options={{ scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } }, plugins: { legend: { display: false } } }} /></div></div>
                    </div>

                        <div className="bg-white p-5 rounded-xl card-shadow flex justify-between items-center"><div><h3 className="text-xs font-medium text-gray-500 mb-1">月次平均（実績）</h3><div className="text-2xl font-bold text-gray-800 mb-1">{Utils.formatYen(expenseDetails.categories.filter(c=>!HIDDEN_EXPENSE_ITEMS.includes(c.name)).reduce((s,c)=>s+(c.totalActual||0),0)/12)}</div></div><div className="text-gray-300"><Icon name="Calendar" size={40} /></div></div>

        // --- 経営陣版：販管費モデル ---
        const EXP = (() => {
            const FY = ['3月','4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月'];
            const nk = (s) => String(s == null ? '' : s).normalize('NFKC').replace(/\s/g, '').toLowerCase();
            const num = (v) => {
                if (v === null || v === undefined) return null;
                if (typeof v === 'number') return isFinite(v) ? v : null;
                let s = String(v).normalize('NFKC').replace(/[¥,"\s]/g, '');
                if (s === '' || s.charAt(0) === '#') return null;
                s = s.replace(/^[△▲]/, '-').replace(/^\((.*)\)$/, '-$1');
                const n = Number(s);
                return isFinite(n) ? n : null;
            };
            const PERSONNEL = ['役員報酬','退職給付費用','給料手当','賞与','退職金','法定福利費','福利厚生費','賞与引当金繰入額','退職給付繰入額','旅費交通費のうち通勤手当'].map(nk);
            const RESERVE = ['バッファ','予備費'].map(nk);
            const TOTAL_ROWS = ['販売管理費計','販管費計'].map(nk);
            const NATURE = {
                fixed: { label: '定額（毎月ほぼ同額）', short: '定額', color: '#3b82f6' },
                recurring: { label: '毎月（金額は変動）', short: '毎月変動', color: '#93c5fd' },
                irregular: { label: '不定期', short: '不定期', color: '#fbbf24' },
                spot: { label: 'スポット（年払い含む）', short: 'スポット', color: '#f87171' },
                none: { label: '未発生', short: '未発生', color: '#e5e7eb' }
            };
            const THEMES = [
                { key: '3f', label: '3F工事', color: '#f97316', kw: ['3f統合','3fリニューアル','3f工事'] },
                { key: 'ai', label: 'AI', color: '#8b5cf6', kw: ['cursor','claude','chatgpt','openai','perplexity','gamma','supermind','slidesai','人工知能','ai関連','生成ai','gemini','copilot'] },
                { key: 'security', label: 'セキュリティ', color: '#ef4444', kw: ['securenavi','セキュリティ','trend','edr','標的型','sso','isms','プライバシーマーク','fortigate','mvision','サイバー保険','ismcloud'] },
                { key: 'data', label: 'データ・分析ツール', color: '#0ea5e9', kw: ['supermetrics','looker','quid','netbase','dockpit','perscope','tableau','datorama','marketingcloud','fanpagekarma','exolyt','accountactivityapi','statusbrew','メディアレーダー','switchhitter'] },
                { key: 'welfare', label: '社員向け（福利厚生）', color: '#10b981', kw: ['社内','マット','水・コーヒー','aed','慶弔','弔電','置き薬','受診料','健診','ストレスチェック','共通券','懇親会'] },
                { key: 'people', label: '人事・採用・研修', color: '#ec4899', kw: ['研修','求人','人材紹介','spi','ミキワメ','グラビティフロー','人事施策','カウンセリング','産業医','社労士','給与計算','成果人事','hrbrain'] },
                { key: 'pro', label: '専門家・コンサル', color: '#64748b', kw: ['弁護士','税理士','司法書士','つばさ','税務申告','コンサルティング'] },
                { key: 'it', label: 'IT基盤・業務ツール', color: '#14b8a6', kw: ['gmail','googleworkspace','office365','slack','zoom','backlog','box','dropbox','bitbucket','board','勤次郎','freee','楽楽精算','cloudsign','キントーン','amazonwebservice','googlecloud','サーバー','adobe','モリサワ','envato','インターリンク','オレンジメ','ドメイン','ssl','yourdesk','トリセツ','イーベ','ネクスタメイシ','ラクスルプライム','たよれーる','evoto','パソコン','iphone','インボイス','コピー機'] },
                { key: 'comm', label: '通信・配送', color: '#06b6d4', kw: ['ntt','kddi','宅急便','郵送','バイク便','切手','配送','エコ便','電話秘書'] },
                { key: 'bank', label: '振込・金融手数料', color: '#a3a3a3', kw: ['振込','送金','eb手数料','ビジネスダイレクト','納付手数料','残高証明','貿易業務'] },
                { key: 'travel', label: '交通・出張', color: '#22c55e', kw: ['交通費','タクシー','駐車場','宿泊','出張','航空券'] },
                { key: 'entertain', label: '交際・会議', color: '#eab308', kw: ['飲食','贈答','供花','会議室','k-mtg','名刺交換'] },
                { key: 'office', label: 'オフィス・備品', color: '#f59e0b', kw: ['事務所','清掃','トランクルーム','観葉植物','水道光熱','シュレッダー','複合機','電話機','コピー用紙','封筒','電話設定','csアンテナ','不用品','不良品','火災保険','消耗品','防災','セキュリティカード','名刺印刷'] },
                { key: 'info', label: '情報収集・会費', color: '#84cc16', kw: ['資料用','購読','帝国','日経','視聴料','協会','総研','研究所','懇話会','会費','amazonプライム','xpremium','cosmosnet'] }
            ];
            const PAYROLL_THEME = { key: 'payroll', label: '給与連動（社会保険・通勤手当）', color: '#e2e8f0' };
            const OTHER_THEME = { key: 'other', label: 'その他', color: '#cbd5e1' };

            const parsePL = (rows) => {
                if (!Array.isArray(rows)) return null;
                const hIdx = rows.findIndex(r => Array.isArray(r) && r.filter(c => nk(c) === '予算').length >= 12);
                if (hIdx < 0) return null;
                const h = rows[hIdx], cols = [];
                const pairs = [];
                for (let c = 0; c < h.length - 1; c++) if (nk(h[c]) === '予算' && nk(h[c + 1]) === '実績') pairs.push(c);
                if (pairs.length < 12) return null;
                cols.push(...pairs.slice(0, 12));
                const fyCol = pairs.length >= 19 ? pairs[18] : -1;
                const accounts = [], summary = {};
                rows.slice(hIdx + 1).forEach(r => {
                    if (!Array.isArray(r)) return;
                    const name = String(r[0] == null ? '' : r[0]).trim(), key = nk(name);
                    if (!name) return;
                    const budget = cols.map(c => num(r[c]) || 0), actual = cols.map(c => num(r[c + 1]));
                    if (TOTAL_ROWS.includes(key)) { summary.total = { budget, actual }; return; }
                    if (key === '月次販管費') return;
                    if (key === '人件費') { summary.personnel = { budget, actual }; return; }
                    if (key === '経費') { summary.other = { budget, actual }; return; }
                    accounts.push({ name, key, budget, actual, personnel: PERSONNEL.includes(key), reserve: RESERVE.includes(key), sheetFY: fyCol >= 0 ? { budget: num(r[fyCol]), actual: num(r[fyCol + 1]) } : null });
                });
                return accounts.length ? { accounts, summary } : null;
            };

            const parseItems = (rows) => {
                if (!Array.isArray(rows)) return null;
                const hIdx = rows.findIndex(r => Array.isArray(r) && r.some(c => nk(c) === '項目') && r.some(c => nk(c) === '分類'));
                if (hIdx < 0) return null;
                const h = rows[hIdx].map(nk);
                const nameI = h.indexOf('項目'), clsI = h.indexOf('分類'), themeI = h.indexOf('テーマ');
                const mCols = FY.map(m => h.indexOf(nk(m)));
                if (mCols.some(c => c < 0)) return null;
                const items = [];
                rows.slice(hIdx + 1).forEach((r, i) => {
                    if (!Array.isArray(r)) return;
                    const name = String(r[nameI] == null ? '' : r[nameI]).trim();
                    if (!name) return;
                    items.push({ id: 'i' + i, name, cls: String(r[clsI] == null ? '' : r[clsI]).trim(), themeOverride: themeI >= 0 ? String(r[themeI] || '').trim() : '', values: mCols.map(c => num(r[c])) });
                });
                return items.length ? items : null;
            };

            const accountKeyOf = (it) => {
                if (!it.cls) return nk(it.name);
                if (nk(it.cls) === '旅費交通費') return nk(it.name).includes('通勤手当') ? nk('旅費交通費のうち通勤手当') : nk('旅費交通費（通勤手当除く）');
                return nk(it.cls);
            };
            const themeOf = (it, accountKey) => {
                if (accountKey === nk('法定福利費') || accountKey === nk('旅費交通費のうち通勤手当')) return PAYROLL_THEME;
                if (it.themeOverride) return THEMES.find(t => t.label === it.themeOverride) || { key: 'custom:' + it.themeOverride, label: it.themeOverride, color: '#94a3b8' };
                const n = nk(it.name);
                return THEMES.find(t => t.kw.some(k => n.includes(k))) || OTHER_THEME;
            };
            const natureOf = (vals) => {
                const nz = vals.filter(v => v);
                if (!nz.length) return 'none';
                if (nz.length <= 2 && vals.length >= 4) return 'spot';
                if (nz.length >= Math.max(3, vals.length - 1)) {
                    const pos = nz.every(v => v > 0), mx = Math.max(...nz), mn = Math.min(...nz);
                    return pos && mx <= mn * 1.15 ? 'fixed' : 'recurring';
                }
                return nz.length <= 2 ? 'spot' : 'irregular';
            };
            const sum = (a) => a.reduce((s, v) => s + (v || 0), 0);
            const lastClosed = (pl) => {
                const t = (pl.summary.total && pl.summary.total.actual) || FY.map((_, m) => sum(pl.accounts.map(a => a.actual[m])));
                let last = -1;
                t.forEach((v, m) => { if (v) last = m; });
                return last;
            };

            const build = (pl, rawItems, asOfIn) => {
                if (!pl) return null;
                const last = lastClosed(pl);
                const asOf = Math.max(0, Math.min(asOfIn == null || asOfIn < 0 ? last : asOfIn, 11));
                const N = asOf + 1;
                const accMap = {};
                const accounts = pl.accounts.map(a => {
                    const act = a.actual.map((v, m) => m <= asOf ? (v || 0) : null);
                    const budgetYTD = sum(a.budget.slice(0, N)), actualYTD = sum(act.slice(0, N));
                    const budgetFY = sum(a.budget), remainBudget = sum(a.budget.slice(N));
                    const recent = act.slice(Math.max(0, N - 3), N), pace = recent.length ? sum(recent) / recent.length : 0;
                    const o = { ...a, actual: act, items: [], budgetYTD, actualYTD, diffYTD: actualYTD - budgetYTD, ratioYTD: budgetYTD > 0 ? actualYTD / budgetYTD : null, budgetFY,
                        forecastPlan: a.reserve ? actualYTD : actualYTD + remainBudget, forecastPace: a.reserve ? actualYTD : actualYTD + pace * (12 - N),
                        cur: act[asOf] || 0, curBudget: a.budget[asOf] || 0,
                        empty: budgetFY === 0 && a.actual.every(v => !v) };
                    accMap[a.key] = o;
                    return o;
                });

                const items = (rawItems || []).map(it => {
                    const vals = it.values.map((v, m) => m <= asOf ? (v || 0) : null);
                    const closed = vals.slice(0, N);
                    const accountKey = accountKeyOf(it), theme = themeOf(it, accountKey);
                    const o = { ...it, values: vals, accountKey, theme, nature: natureOf(closed), ytd: sum(closed), cur: vals[asOf] || 0, prev: asOf > 0 ? (vals[asOf - 1] || 0) : 0 };
                    o.account = accMap[o.accountKey] || null;
                    if (o.account) o.account.items.push(o);
                    return o;
                });

                const issues = [];
                const push = (level, kind, title, detail, extra) => issues.push({ level, kind, title, detail, ...(extra || {}) });
                const yen = (v) => Math.round(v).toLocaleString() + '円';

                items.filter(i => !i.account).forEach(i => push('red', 'unmapped', '予実表にない分類です', `「${i.name}」の分類「${i.cls || '（空欄）'}」が予実表の科目に見つかりません。集計から漏れています。`, { amount: i.ytd, itemId: i.id }));

                accounts.filter(a => a.items.length).forEach(a => {
                    const bad = [];
                    for (let m = 0; m <= asOf; m++) {
                        const d = sum(a.items.map(i => i.values[m])), p = a.actual[m] || 0;
                        if (Math.abs(d - p) >= 1) bad.push({ m, d, p });
                    }
                    if (bad.length) push('red', 'mismatch', '予実表と詳細の合計が合いません', `${a.name}：` + bad.map(b => `${FY[b.m]} 予実表${yen(b.p)} / 詳細${yen(b.d)}（差${yen(b.d - b.p)}）`).join('、'), { amount: Math.max(...bad.map(b => Math.abs(b.d - b.p))), accountKey: a.key });
                });

                accounts.filter(a => a.sheetFY).forEach(a => {
                    const fb = sum(a.budget), fa = sum(pl.accounts.find(x => x.key === a.key).actual), sb = a.sheetFY.budget || 0, sa = a.sheetFY.actual || 0;
                    const msg = [];
                    if (Math.abs(fb - sb) >= 1) msg.push(`予算：月別の合計 ${yen(fb)} ／ 期間累計欄 ${yen(sb)}（差${yen(fb - sb)}）`);
                    if (Math.abs(fa - sa) >= 1) msg.push(`実績：月別の合計 ${yen(fa)} ／ 期間累計欄 ${yen(sa)}（差${yen(fa - sa)}）`);
                    if (msg.length) push('amber', 'formula', '予実表の累計欄が月別の合計と合いません', `${a.name}：${msg.join('、')}。四半期・累計欄の数式をご確認ください。`, { amount: Math.abs(fb - sb) + Math.abs(fa - sa), accountKey: a.key });
                });

                ['personnel', 'other'].forEach(k => {
                    const s = pl.summary[k]; if (!s) return;
                    const bad = [];
                    for (let m = 0; m <= asOf; m++) {
                        const calc = sum(accounts.filter(a => k === 'personnel' ? a.personnel : !a.personnel).map(a => a.actual[m]));
                        if (Math.abs(calc - (s.actual[m] || 0)) >= 1) bad.push(FY[m]);
                    }
                    if (bad.length) push('amber', 'split', `「${k === 'personnel' ? '人件費' : '経費'}」の内訳が予実表の小計と合いません`, `${bad.join('、')}：ダッシュボードの人件費／経費の振り分けが予実表と異なります。`, { amount: 0 });
                });

                if (asOf > 0) {
                    items.forEach(i => {
                        const prevVals = i.values.slice(Math.max(0, asOf - 3), asOf).map(v => v || 0);
                        const prevNZ = prevVals.filter(v => v), avg = prevNZ.length ? sum(prevNZ) / prevNZ.length : 0;
                        const everBefore = i.values.slice(0, asOf).some(v => v);
                        if (i.cur > 0 && !everBefore && i.cur >= 10000) push('amber', 'new', '今期はじめて発生した項目', `${i.name}（${i.cls || i.name}）：${FY[asOf]} ${yen(i.cur)}`, { amount: i.cur, itemId: i.id });
                        else if (i.cur > 0 && avg > 0 && i.cur - avg >= 100000 && i.cur >= avg * 1.5) push('amber', 'surge', '直近3か月の平均から急増', `${i.name}：${FY[asOf]} ${yen(i.cur)}（直近平均 ${yen(avg)} の ${(i.cur / avg).toFixed(1)}倍）`, { amount: i.cur - avg, itemId: i.id });
                        if (!i.cur && asOf >= 3 && prevVals.length === 3 && prevVals.every(v => v > 0) && i.nature !== 'spot') push('info', 'stopped', '毎月出ていた費用が今月はゼロ', `${i.name}：${FY[asOf - 1]}まで毎月計上 → ${FY[asOf]}は計上なし（解約・計上漏れ・時期ずれの確認を）`, { amount: avg, itemId: i.id });
                        const negs = i.values.slice(0, N).map((v, m) => v < 0 ? m : -1).filter(m => m >= 0);
                        if (negs.length) push('info', 'negative', 'マイナス計上（返金・振替など）', `${i.name}：` + negs.map(m => `${FY[m]} ${yen(i.values[m])}`).join('、'), { amount: Math.abs(sum(negs.map(m => i.values[m]))), itemId: i.id });
                    });
                }

                accounts.filter(a => !a.reserve).forEach(a => {
                    const ms = []; for (let m = 0; m <= asOf; m++) if (!a.budget[m] && a.actual[m] > 0) ms.push(m);
                    if (ms.length) push('info', 'nobudget', '予算を置いていない月に発生', `${a.name}：` + ms.map(m => `${FY[m]} ${yen(a.actual[m])}`).join('、'), { amount: sum(ms.map(m => a.actual[m])), accountKey: a.key });
                });

                const byName = {};
                items.forEach(i => { const k = nk(i.name); (byName[k] = byName[k] || []).push(i); });
                Object.values(byName).filter(g => g.length > 1 && g.some(i => i.ytd)).forEach(g => push('info', 'duplicate', '同じ名前の項目が複数あります', `${g[0].name}：` + g.map(i => `${i.cls || '分類なし'} ${yen(i.ytd)}`).join(' / ') + '（二重計上や科目の揺れがないか確認を）', { amount: sum(g.map(i => i.ytd)), itemId: g[0].id }));

                const LV = { red: 0, amber: 1, info: 2 };
                issues.sort((a, b) => LV[a.level] - LV[b.level] || (b.amount || 0) - (a.amount || 0));

                const live = accounts.filter(a => !a.empty);
                const pick = (f) => live.filter(f);
                const agg = (list) => {
                    const budget = FY.map((_, m) => sum(list.map(a => a.budget[m]))), actual = FY.map((_, m) => m <= asOf ? sum(list.map(a => a.actual[m])) : null);
                    return { budget, actual, budgetYTD: sum(budget.slice(0, N)), actualYTD: sum(actual.slice(0, N)), budgetFY: sum(budget), forecastPlan: sum(list.map(a => a.forecastPlan)), forecastPace: sum(list.map(a => a.forecastPace)), cur: actual[asOf] || 0, curBudget: budget[asOf] || 0 };
                };
                const totals = { all: agg(live), personnel: agg(pick(a => a.personnel)), other: agg(pick(a => !a.personnel && !a.reserve)), reserve: agg(pick(a => a.reserve)) };

                const natureMonthly = {};
                Object.keys(NATURE).forEach(k => { natureMonthly[k] = FY.map((_, m) => m <= asOf ? sum(items.filter(i => i.nature === k).map(i => i.values[m])) : null); });

                const themeMap = {};
                items.forEach(i => {
                    const t = themeMap[i.theme.key] || (themeMap[i.theme.key] = { ...i.theme, items: [], monthly: FY.map((_, m) => m <= asOf ? 0 : null) });
                    t.items.push(i);
                    for (let m = 0; m <= asOf; m++) t.monthly[m] += i.values[m] || 0;
                });
                const themes = Object.values(themeMap).map(t => ({ ...t, kw: undefined, ytd: sum(t.monthly), cur: t.monthly[asOf] || 0, first: t.monthly[0] || 0 }))
                    .filter(t => t.key !== 'payroll').sort((a, b) => (a.key === 'other') - (b.key === 'other') || b.ytd - a.ytd);

                return { FY, asOf, last, N, accounts: live, allAccounts: accounts, items, issues, totals, natureMonthly, themes, hasItems: !!(rawItems && rawItems.length) };
            };

            const hints = (md) => {
                if (!md || !md.hasItems) return [];
                const { FY, asOf, N, items, accounts } = md;
                const out = [];
                const man = (v) => Math.round(v / 1e4).toLocaleString() + '万円';
                const nzCount = (i) => i.values.slice(0, N).filter(v => v).length;
                const annualOf = (i) => (i.nature === 'fixed' || i.nature === 'recurring') ? (i.ytd / Math.max(1, nzCount(i))) * 12 : i.ytd;
                const avgOf = (i, from, to) => { const v = i.values.slice(from, to + 1).map(x => x || 0); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : 0; };
                const FIXED_ACC = ['減価償却費', '利息費用', '租税公課', '保険料', '教育訓練費', '寄付金'].map(nk);
                const usable = items.filter(i => i.account && i.theme.key !== 'payroll' && i.ytd > 0);

                if (N >= 5) {
                    const grow = [];
                    usable.filter(i => (i.nature === 'fixed' || i.nature === 'recurring') && !FIXED_ACC.includes(i.accountKey) && nk(i.name) !== i.accountKey).forEach(i => {
                        const base = avgOf(i, 0, 2), recent = avgOf(i, asOf - 2, asOf);
                        if (base > 0 && recent >= base * 1.5 && recent - base >= 50000) {
                            grow.push({ kind: 'growth', tag: '増加の抑制', title: `${i.name} が期初の${(recent / base).toFixed(1)}倍に増えています`,
                                detail: `3〜5月の月平均 ${man(base)} → 直近3か月の月平均 ${man(recent)}。` + (i.theme.key === 'travel' ? '増えた理由（案件・出張の増加か、利用ルールの緩みか）を確認し、必要なら利用の目安を決めてください。' : '増えた理由（利用人数・プラン・単価）を確認し、アカウント数の上限や追加時の承認ルールを決めると増加を止められます。'),
                                base: recent * 12, saving: (recent - base) * 12, savingLabel: '期初の水準に戻した場合', accountKey: i.accountKey });
                        }
                    });
                    out.push(...grow.sort((a, b) => b.saving - a.saving).slice(0, 4));
                }

                const byName = {};
                usable.forEach(i => { const k = nk(i.name); (byName[k] = byName[k] || []).push(i); });
                Object.values(byName).forEach(g => {
                    if (g.length < 2 || new Set(g.map(i => i.accountKey)).size < 2 || nk(g[0].name).includes('工事')) return;
                    const ann = g.map(annualOf), small = Math.min(...ann);
                    out.push({ kind: 'duplicate', tag: '重複の整理', title: `${g[0].name} が${g.length}つの科目に計上されています`,
                        detail: g.map(i => `${i.account.name}（年 約${man(annualOf(i))}）`).join('、') + '。同じサービスを二重に契約していないか、ライセンスを1本にまとめられないかを確認してください。',
                        base: ann.reduce((s, v) => s + v, 0), saving: small, savingLabel: '小さい方の契約をなくせた場合', accountKey: g[0].accountKey });
                });

                accounts.filter(a => !a.personnel && !a.reserve && a.budgetFY > 0 && !FIXED_ACC.includes(a.key)).forEach(a => {
                    const steady = a.items.length ? a.items.filter(i => i.nature !== 'spot') : null;
                    const recentAvg = steady ? [asOf - 2, asOf - 1, asOf].filter(m => m >= 0).reduce((s, m, _, arr) => s + steady.reduce((t, i) => t + (i.values[m] || 0), 0) / arr.length, 0) : null;
                    const pace = steady ? a.actualYTD + recentAvg * (12 - N) : a.forecastPace;
                    const over = pace - a.budgetFY;
                    if (over >= 300000 && pace > a.budgetFY * 1.05) {
                        const top = (steady || []).filter(i => i.cur > 0).sort((x, y) => y.cur - x.cur).slice(0, 2).map(i => i.name).join('、');
                        out.push({ kind: 'pace', tag: '予算ペース', title: `${a.name} はこのペースだと通期で予算を${man(over)}超えます`,
                            detail: `PC購入や工事などの一時的な支出を除いた直近3か月のペースが続くと、通期 ${man(pace)}（予算 ${man(a.budgetFY)}）。${top ? `いま大きいのは ${top}。` : ''}残りの月の使い方を担当部署とすり合わせてください。`,
                            base: pace, saving: over, savingLabel: '予算内に収めた場合', accountKey: a.key });
                    }
                });

                const AI = usable.filter(i => i.theme.key === 'ai' && i.accountKey === nk('通信費') && i.nature !== 'spot' && i.cur > 0);
                if (AI.length >= 3) {
                    const cur = AI.reduce((s, i) => s + i.cur, 0);
                    out.push({ kind: 'ai', tag: '投資の整理', title: `AIツールが${AI.length}種類並行して契約されています`,
                        detail: `${AI.map(i => i.name.normalize('NFKC').replace(/\(.*$/, '').trim()).join('、')}（${FY[asOf]} 合計 ${man(cur)}）。AIへの投資は続けつつ、用途が重なるものは全社で使うツールを絞ると、管理の手間と費用を抑えられます。`,
                        base: cur * 12, saving: null, accountKey: AI[0].accountKey });
                }

                const big = usable.filter(i => (i.nature === 'fixed' || i.nature === 'recurring') && ['it', 'data', 'ai', 'pro', 'people', 'security', 'info'].includes(i.theme.key) && annualOf(i) / 12 >= 200000)
                    .sort((a, b) => annualOf(b) - annualOf(a)).slice(0, 5);
                if (big.length) {
                    const total = big.reduce((s, i) => s + annualOf(i), 0);
                    out.push({ kind: 'contract', tag: '大口契約の見直し', title: `毎月20万円以上の継続契約 上位${big.length}件で年 約${man(total)}`,
                        detail: big.map(i => `${i.name}（年 約${man(annualOf(i))}）`).join('、') + '。更新の前に、利用状況・成果と金額が見合っているかを確認してください。',
                        base: total, saving: total * 0.1, savingLabel: '1割下げられた場合', accountKey: big[0].accountKey });
                }

                const small = usable.filter(i => ['it', 'data', 'ai', 'info', 'security'].includes(i.theme.key) && (i.nature === 'fixed' || i.nature === 'recurring') && annualOf(i) / 12 < 50000 && i.cur > 0);
                if (small.length >= 5) {
                    const total = small.reduce((s, i) => s + annualOf(i), 0);
                    out.push({ kind: 'subs', tag: '少額契約の棚卸し', title: `月5万円未満のツール・サービスが${small.length}件、年 約${man(total)}`,
                        detail: '少額のため見落とされやすい契約です。半年に一度、使っている人がいるか・代わりのツールがないかを確認すると、解約漏れを防げます。',
                        base: total, saving: null, accountKey: small[0].accountKey });
                }

                const toIdx = (m) => (m - 3 + 12) % 12;
                const soon = [asOf + 1, asOf + 2].filter(m => m <= 11);
                const ren = [];
                items.forEach(i => {
                    const n = String(i.name).normalize('NFKC');
                    const m = n.match(/(\d{1,2})月更新/) || n.match(/(\d{1,2})月\s*[-‐－〜~]\s*\d{1,2}月/) || n.match(/(\d{1,2})月より/);
                    if (!m) return;
                    const idx = toIdx(Number(m[1]));
                    if (soon.includes(idx)) ren.push({ i, idx });
                });
                if (ren.length) {
                    out.push({ kind: 'renewal', tag: '更新前の判断', title: `${soon.map(m => FY[m]).join('・')}に更新を迎える契約が${ren.length}件あります`,
                        detail: ren.map(r => r.i.name).join('、') + '。自動更新される前に、続けるかどうかを決めてください。',
                        base: null, saving: null, accountKey: ren[0].i.accountKey, urgent: true });
                }

                const score = (h) => h.urgent ? 1e12 : (h.saving != null ? h.saving : (h.base || 0) * 0.05);
                return out.sort((a, b) => score(b) - score(a));
            };

            const compare = (md, prevPL) => {
                if (!md || !prevPL) return null;
                const { N, asOf } = md;
                const mapKey = (k) => k.startsWith(nk('手数料のうち')) ? nk('手数料') : k.startsWith(nk('通信費のうち')) ? nk('通信費') : k;
                const prev = {};
                prevPL.accounts.forEach(a => {
                    const k = mapKey(a.key), p = prev[k] || (prev[k] = { monthly: Array(12).fill(0), parts: [] });
                    a.actual.forEach((v, m) => { p.monthly[m] += v || 0; });
                    if (k !== a.key && a.actual.some(v => v)) p.parts.push(a.name);
                });
                const used = new Set();
                const rows = md.allAccounts.filter(a => !a.reserve).map(a => {
                    const p = prev[a.key]; if (p) used.add(a.key);
                    const pm = p ? p.monthly : Array(12).fill(0);
                    return { key: a.key, name: a.name, personnel: a.personnel, parts: p ? p.parts : [], hasPrev: !!p,
                        prevMonthly: pm, curMonthly: a.actual.map(v => v || 0),
                        prevYTD: sum(pm.slice(0, N)), curYTD: a.actualYTD, prevCur: pm[asOf] || 0, curCur: a.cur, prevFY: sum(pm), curFY: a.forecastPlan };
                });
                Object.keys(prev).filter(k => !used.has(k) && prev[k].monthly.some(v => v)).forEach(k => {
                    const src = prevPL.accounts.find(a => mapKey(a.key) === k), pm = prev[k].monthly;
                    rows.push({ key: k, name: src ? src.name : k, personnel: src ? src.personnel : false, parts: [], hasPrev: true, onlyPrev: true, prevMonthly: pm, curMonthly: Array(12).fill(0),
                        prevYTD: sum(pm.slice(0, N)), curYTD: 0, prevCur: pm[asOf] || 0, curCur: 0, prevFY: sum(pm), curFY: 0 });
                });
                const live = rows.filter(r => r.prevFY || r.curFY || r.prevYTD || r.curYTD);
                const tot = (f) => ['prevYTD', 'curYTD', 'prevCur', 'curCur', 'prevFY', 'curFY'].reduce((o, k) => (o[k] = sum(live.filter(f).map(r => r[k])), o), {});
                return { rows: live, total: tot(() => true), personnel: tot(r => r.personnel), other: tot(r => !r.personnel), prevMonthlyTotal: FY.map((_, m) => sum(live.map(r => r.prevMonthly[m]))) };
            };

            return { FY, NATURE, THEMES, parsePL, parseItems, build, hints, compare, accountKeyOf, nk, num };
        })();

        // --- 経営陣版：販管費ページ ---
        const XF = {
            man: (v) => { const n = Number(v) || 0; if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(2) + '億円'; return Math.round(n / 1e4).toLocaleString() + '万円'; },
            manS: (v) => { const n = Number(v) || 0; return (n > 0 ? '+' : n < 0 ? '−' : '±') + XF.man(Math.abs(n)); },
            yen: (v) => v == null ? '' : Math.round(v).toLocaleString(),
            pct: (r) => r == null || !isFinite(r) ? '—' : Math.round(r * 100) + '%',
            heat: (b, a) => {
                if (!b && !a) return { bg: '#ffffff', fg: '#cbd5e1', txt: '–' };
                if (!b) return { bg: '#fed7aa', fg: '#9a3412', txt: '予算外' };
                const r = a / b;
                if (r >= 1.5) return { bg: '#b91c1c', fg: '#ffffff', r };
                if (r >= 1.2) return { bg: '#ef4444', fg: '#ffffff', r };
                if (r >= 1.05) return { bg: '#fecaca', fg: '#991b1b', r };
                if (r > 0.95) return { bg: '#f1f5f9', fg: '#334155', r };
                if (r >= 0.8) return { bg: '#d1fae5', fg: '#065f46', r };
                return { bg: '#a7f3d0', fg: '#065f46', r };
            },
            LEVEL: { red: { label: '要対応', bg: '#fef2f2', bd: '#fca5a5', fg: '#b91c1c' }, amber: { label: '要確認', bg: '#fffbeb', bd: '#fcd34d', fg: '#b45309' }, info: { label: '参考', bg: '#f8fafc', bd: '#cbd5e1', fg: '#475569' } }
        };

        function XKpi({ label, value, sub, tone }) {
            const c = tone === 'bad' ? 'text-red-600' : tone === 'good' ? 'text-emerald-600' : 'text-gray-500';
            return (
                <div className="bg-white p-5 rounded-xl card-shadow">
                    <h3 className="text-xs font-medium text-gray-500 mb-1">{label}</h3>
                    <div className="text-2xl font-bold text-gray-800">{value}</div>
                    <div className={`text-xs font-medium mt-1 ${c}`}>{sub}</div>
                </div>
            );
        }

        function XSpark({ values, color }) {
            const v = values.map(x => x || 0), mx = Math.max(1, ...v.map(Math.abs)), w = 120, h = 32, bw = w / v.length;
            return <svg width={w} height={h}>{v.map((x, i) => { const bh = Math.max(1, Math.abs(x) / mx * (h - 2)); return <rect key={i} x={i * bw + 1} y={h - bh} width={bw - 2} height={bh} rx="1" fill={color} opacity={i === v.length - 1 ? 1 : 0.45} />; })}</svg>;
        }

        function XNatureBadge({ k }) {
            const n = EXP.NATURE[k] || EXP.NATURE.none;
            return <span className="inline-block px-2 py-0.5 rounded text-[10px] font-bold" style={{ background: n.color + '33', color: '#334155', border: '1px solid ' + n.color }}>{n.short}</span>;
        }

        function XAccountDrill({ acc, model, onClose, prevRow, prevItems, prevPeriod }) {
            const { FY, asOf, N } = model;
            const chart = useMemo(() => ({
                labels: FY,
                datasets: [
                    { type: 'bar', label: '実績', data: acc.actual.map(v => v == null ? null : v), backgroundColor: '#64748b', borderRadius: 4, order: 2 },
                    { type: 'line', label: '予算', data: acc.budget, borderColor: '#f97316', borderWidth: 2, borderDash: [5, 5], pointRadius: 2, fill: false, order: 1 },
                    ...(prevRow ? [{ type: 'line', label: pp + '期実績', data: prevRow.prevMonthly, borderColor: '#a855f7', borderWidth: 2, pointRadius: 2, fill: false, order: 0 }] : [])
                ]
            }), [acc, prevRow]);
            const pp = prevPeriod;
            const prevMap = useMemo(() => {
                if (!prevItems) return null;
                const m = {};
                prevItems.filter(it => EXP.accountKeyOf(it) === acc.key).forEach(it => {
                    const k = EXP.nk(it.name), o = m[k] || (m[k] = { name: it.name, ytd: 0 });
                    o.ytd += it.values.slice(0, N).reduce((s, v) => s + (v || 0), 0);
                });
                return m;
            }, [prevItems, acc.key, N]);
            const [sortBy, setSortBy] = useState('diff');
            const rowsCur = acc.items.filter(i => i.ytd || i.cur).map(i => { const p = prevMap && prevMap[EXP.nk(i.name)]; return { ...i, prevYTD: p ? p.ytd : 0, matched: !!p }; });
            const curKeys = new Set(acc.items.map(i => EXP.nk(i.name)));
            const rowsPrev = prevMap ? Object.entries(prevMap).filter(([k, p]) => !curKeys.has(k) && p.ytd).map(([k, p]) => ({ id: 'p:' + k, name: p.name, onlyPrev: true, prevYTD: p.ytd, ytd: 0, cur: 0, prev: 0, values: [], nature: 'none', theme: { key: 'x', label: '—' } })) : [];
            const items = [...rowsCur, ...rowsPrev].sort((a, b) => prevMap && sortBy === 'diff' ? Math.abs(b.ytd - b.prevYTD) - Math.abs(a.ytd - a.prevYTD) : b.ytd - a.ytd);
            const prevItemsSum = rowsCur.reduce((s, i) => s + i.prevYTD, 0) + rowsPrev.reduce((s, i) => s + i.prevYTD, 0);
            const prevAccYTD = prevRow ? prevRow.prevYTD : null;
            const months = FY.slice(0, N);
            const detailSum = months.map((_, m) => items.reduce((s, i) => s + (i.values[m] || 0), 0));
            const mismatch = months.some((_, m) => Math.abs(detailSum[m] - (acc.actual[m] || 0)) >= 1);
            return (
                <div className="bg-white rounded-xl card-shadow border-2 border-blue-200 p-6 mt-4" id="exp-drill">
                    <div className="flex justify-between items-start mb-4">
                        <div>
                            <p className="text-xs text-gray-500">{acc.personnel ? '人件費' : '経費'}の科目</p>
                            <h3 className="text-lg font-bold text-gray-800">{acc.name}</h3>
                            <p className="text-sm text-gray-600 mt-1">累計 {XF.man(acc.actualYTD)} ／ 予算 {XF.man(acc.budgetYTD)}　<span className={acc.diffYTD > 0 ? 'text-red-600 font-bold' : 'text-emerald-600 font-bold'}>{XF.manS(acc.diffYTD)}（{XF.pct(acc.ratioYTD)}）</span></p>
                            {prevRow && <p className="text-sm text-gray-600">{pp}期の同じ期間 {XF.man(prevAccYTD)} → 今期 {XF.man(acc.actualYTD)}　<span className={acc.actualYTD > prevAccYTD ? 'text-red-600 font-bold' : 'text-emerald-600 font-bold'}>{XF.manS(acc.actualYTD - prevAccYTD)}{prevAccYTD > 0 ? `（${acc.actualYTD >= prevAccYTD ? '+' : ''}${((acc.actualYTD - prevAccYTD) / prevAccYTD * 100).toFixed(1)}%）` : ''}</span></p>}
                        </div>
                        <button onClick={onClose} className="text-sm text-gray-400 hover:text-gray-700 px-2">閉じる ✕</button>
                    </div>
                    <div className="h-56 w-full mb-4"><ChartComponent type="bar" data={chart} options={{ scales: { y: { ticks: { callback: v => (v / 1e4).toLocaleString() + '万' } } } }} /></div>
                    {items.length > 0 && (prevMap ? (
                        <div className="flex items-center gap-3 mb-2"><span className="text-xs text-gray-500">並べ方</span><ToggleButton options={[{ value: 'diff', label: `${pp}期からの増減が大きい順` }, { value: 'ytd', label: '今期の累計が大きい順' }]} value={sortBy} onChange={setSortBy} /></div>
                    ) : prevRow && <p className="text-xs text-amber-700 bg-amber-50 rounded p-2 mb-2">{pp}期の項目別データ（{pp}期販管費詳細）が未連携のため、項目ごとの{pp}期比は表示できません。科目の合計の比較は上の数字とグラフでご覧いただけます。</p>)}
                    {items.length === 0 ? <p className="text-sm text-gray-500 bg-gray-50 rounded p-4">この科目には明細がありません（給与・賞与・引当金など、予実表のみで管理している科目です）。</p> : (

                            <table className="w-full text-xs whitespace-nowrap">

                                    {months.map(m => <th key={m} className="px-2 py-2 text-right">{m}</th>)}
                                    {!prevMap && <th className="px-2 py-2 text-right">累計</th>}<th className="px-2 py-2 text-right">前月比</th>
                                </tr></thead>
                                <tbody>
                                    {items.map(i => {
                                        const d = i.cur - i.prev;
                                        return (
                                            <tr key={i.id} className={`border-t border-gray-100 hover:bg-blue-50 ${i.onlyPrev ? 'text-gray-400' : ''}`}>

                                                {prevMap && (() => { const dd = i.ytd - i.prevYTD; return <><td className="px-2 py-1.5 text-right font-mono font-bold bg-purple-50/40">{XF.yen(i.ytd)}</td><td className="px-2 py-1.5 text-right font-mono bg-purple-50/40 text-gray-500">{i.prevYTD ? XF.yen(i.prevYTD) : ''}</td><td className={`px-2 py-1.5 text-right font-mono font-bold bg-purple-50/40 ${dd > 0 ? 'text-red-600' : dd < 0 ? 'text-emerald-600' : 'text-gray-400'}`}>{dd ? (dd > 0 ? '+' : '') + XF.yen(dd) : '±0'}</td></>; })()}
                                                {months.map((_, m) => <td key={m} className={`px-2 py-1.5 text-right font-mono ${(i.values[m] || 0) < 0 ? 'text-red-600' : ''}`}>{i.values[m] ? XF.yen(i.values[m]) : ''}</td>)}
                                                {!prevMap && <td className="px-2 py-1.5 text-right font-mono font-bold">{XF.yen(i.ytd)}</td>}
                                                <td className={`px-2 py-1.5 text-right font-mono ${d > 0 ? 'text-red-600' : d < 0 ? 'text-emerald-600' : 'text-gray-400'}`}>{asOf > 0 && d ? (d > 0 ? '+' : '') + XF.yen(d) : ''}</td>
                                            </tr>
                                        );
                                    })}
                                    <tr className="border-t-2 border-gray-300 bg-gray-50 font-bold">
                                        <td className="px-2 py-1.5 sticky left-0 bg-gray-50" colSpan={3}>明細の合計</td>
                                        {prevMap && <><td className="px-2 py-1.5 text-right font-mono">{XF.yen(detailSum.reduce((s, v) => s + v, 0))}</td><td className="px-2 py-1.5 text-right font-mono">{XF.yen(prevItemsSum)}</td><td className="px-2 py-1.5 text-right font-mono">{(detailSum.reduce((s, v) => s + v, 0) - prevItemsSum > 0 ? '+' : '') + XF.yen(detailSum.reduce((s, v) => s + v, 0) - prevItemsSum)}</td></>}
                                        {detailSum.map((v, m) => <td key={m} className="px-2 py-1.5 text-right font-mono">{XF.yen(v)}</td>)}
                                        {!prevMap && <td className="px-2 py-1.5 text-right font-mono">{XF.yen(detailSum.reduce((s, v) => s + v, 0))}</td>}<td></td>
                                    </tr>
                                    {prevMap && prevAccYTD != null && Math.abs(prevAccYTD - prevItemsSum) >= 1 && <tr className="text-purple-700 bg-purple-50/40"><td className="px-2 py-1.5 sticky left-0 bg-purple-50" colSpan={4}>{pp}期の予実表の金額との差（{prevRow.parts.length ? `「${prevRow.parts.join('・')}」など、` : ''}項目データにない分）</td><td className="px-2 py-1.5 text-right font-mono">{XF.yen(prevAccYTD - prevItemsSum)}</td><td colSpan={months.length + 2}></td></tr>}
                                    {mismatch && <tr className="bg-red-50 text-red-700 font-bold">
                                        <td className="px-2 py-1.5 sticky left-0 bg-red-50" colSpan={3}>予実表の実績（不一致あり）</td>
                                        {prevMap && <><td className="px-2 py-1.5 text-right font-mono">{XF.yen(acc.actualYTD)}</td><td colSpan={2}></td></>}
                                        {months.map((_, m) => <td key={m} className="px-2 py-1.5 text-right font-mono">{XF.yen(acc.actual[m] || 0)}</td>)}
                                        {!prevMap && <td className="px-2 py-1.5 text-right font-mono">{XF.yen(acc.actualYTD)}</td>}<td></td>
                                    </tr>}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>

        }

        function ExecExpensesPage({ execPL, execItems, execPrev, execPrevItems, prevPeriod, asOf, setAsOf, execStatus, onOpenSettings, onOpenReport, fallback }) {
            const [cmpMode, setCmpMode] = useState('ytd');
            const [cmpSort, setCmpSort] = useState('book');

            const [cumulative, setCumulative] = useState('monthly');

            const [hmSort, setHmSort] = useState('book');
            const [selKey, setSelKey] = useState(null);
            const [selTheme, setSelTheme] = useState('ai');
            const [natureFilter, setNatureFilter] = useState('fixed');
            const [issueFilter, setIssueFilter] = useState('all');
            const model = useMemo(() => execPL ? EXP.build(execPL, execItems, asOf) : null, [execPL, execItems, asOf]);

            const inScope = useCallback((a) => !a.reserve && (scope === 'all' || (scope === 'personnel' ? a.personnel : !a.personnel)), [scope]);
            const openAccount = (key) => { setSelKey(key); setTimeout(() => { const el = document.getElementById('exp-drill'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' }); }, 80); };

            const mainChart = useMemo(() => {
                if (!model) return null;
                const cum = (arr) => { let s = 0; return arr.map(v => v == null ? null : (s += v)); };
                const f = cumulative === 'cumulative' ? cum : (x) => x;
                const t = model.totals, ds = [];
                if (scope !== 'other') ds.push({ type: 'bar', label: '人件費 実績', data: f(t.personnel.actual), backgroundColor: '#94a3b8', stack: 'a', order: 2 });
                if (scope !== 'personnel') ds.push({ type: 'bar', label: '経費 実績', data: f(t.other.actual), backgroundColor: '#3b82f6', stack: 'a', order: 2 });
                const bud = scope === 'all' ? t.all.budget.map((v, m) => v - t.reserve.budget[m]) : scope === 'personnel' ? t.personnel.budget : t.other.budget;
                ds.push({ type: 'line', label: '予算（バッファ除く）', data: f(bud), borderColor: '#f97316', borderWidth: 2, borderDash: [5, 5], pointRadius: 2, fill: false, order: 1 });
                return { labels: model.FY, datasets: ds };
            }, [model, scope, cumulative]);

            const natureChart = useMemo(() => {
                if (!model) return null;
                const keys = ['fixed', 'recurring', 'irregular', 'spot'];
                const its = model.items.filter(i => i.account && inScope(i.account) && i.theme.key !== 'payroll');
                return { labels: model.FY.slice(0, model.N), datasets: keys.map(k => ({ label: EXP.NATURE[k].label, data: model.FY.slice(0, model.N).map((_, m) => its.filter(i => i.nature === k).reduce((s, i) => s + (i.values[m] || 0), 0)), backgroundColor: EXP.NATURE[k].color, stack: 'n' })) };
            }, [model, inScope]);

            if (!execPL) {
                return (
                    <div className="space-y-6">
                        <div className="bg-white rounded-xl card-shadow p-6 border-l-4 border-blue-600">

                            <p className="text-sm text-gray-600 mb-3">{execStatus || '「役員会資料（31期）」の販管費予実表・販管費詳細を読み込むと、詳しい分析ページが表示されます。'}</p>

                        </div>
                        {fallback}
                    </div>

            }

            const { FY, N, totals, accounts, items, issues, themes } = model;
            const curLabel = FY[model.asOf];
            const tAll = totals.all;
            const scoped = accounts.filter(inScope);
            const over = scoped.filter(a => a.diffYTD > 0).sort((a, b) => b.diffYTD - a.diffYTD);
            const under = scoped.filter(a => a.diffYTD < 0).sort((a, b) => a.diffYTD - b.diffYTD).slice(0, 6);
            const maxOver = Math.max(1, ...over.map(a => a.diffYTD));
            const hmRows = hmSort === 'over' ? [...scoped].sort((a, b) => b.diffYTD - a.diffYTD) : scoped;
            const selAcc = selKey ? model.allAccounts.find(a => a.key === selKey) : null;

            const natItems = items.filter(i => i.account && inScope(i.account) && i.theme.key !== 'payroll');
            const natSum = (k) => natItems.filter(i => i.nature === k);
            const fixedCur = natSum('fixed').reduce((s, i) => s + i.cur, 0);
            const recurAvg = natSum('recurring').reduce((s, i) => s + i.ytd, 0) / N;
            const spotYTD = natSum('spot').reduce((s, i) => s + i.ytd, 0) + natSum('irregular').reduce((s, i) => s + i.ytd, 0);
            const natList = natItems.filter(i => i.nature === natureFilter && (i.ytd || i.cur)).sort((a, b) => (natureFilter === 'fixed' ? b.cur - a.cur : b.ytd - a.ytd));

            const theme = themes.find(t => t.key === selTheme) || themes[0];
            const themeItems = theme ? theme.items.filter(i => i.ytd || i.cur).sort((a, b) => b.ytd - a.ytd) : [];
            const issueCounts = { red: 0, amber: 0, info: 0 }; issues.forEach(i => issueCounts[i.level]++);
            const shownIssues = issueFilter === 'all' ? issues : issues.filter(i => i.level === issueFilter);
            const issueTarget = (i) => i.accountKey || (i.itemId && (items.find(x => x.id === i.itemId) || {}).accountKey) || null;
            const hintList = EXP.hints(model);
            const cmp = EXP.compare(model, execPrev);
            const PK = { ytd: ['prevYTD', 'curYTD'], cur: ['prevCur', 'curCur'], fy: ['prevFY', 'curFY'] }[cmpMode];
            const cmpRows = cmp ? cmp.rows.filter(r => scope === 'all' || (scope === 'personnel' ? r.personnel : !r.personnel)) : [];
            const cmpSorted = cmpSort === 'diff' ? [...cmpRows].sort((a, b) => Math.abs(b[PK[1]] - b[PK[0]]) - Math.abs(a[PK[1]] - a[PK[0]])) : cmpRows;
            const cmpMax = Math.max(1, ...cmpRows.map(r => Math.abs(r[PK[1]] - r[PK[0]])));
            const cmpTot = cmp ? (scope === 'all' ? cmp.total : scope === 'personnel' ? cmp.personnel : cmp.other) : null;
            const pp = prevPeriod;
            const jump = (id) => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' }); };

            return (
                <div className="space-y-6 animate-in">
                    <div className="bg-white rounded-xl card-shadow p-4 flex flex-wrap items-center gap-3">
                        <span className="px-2 py-0.5 rounded bg-red-600 text-white text-[10px] font-bold">経営陣限定</span>
                        <h2 className="text-base font-bold text-gray-800 mr-2">販管費</h2>
                        <select className="border rounded-lg text-sm px-3 py-1.5 bg-gray-50" value={model.asOf} onChange={(e) => setAsOf(Number(e.target.value))}>
