                Object.values(historicalData || {}).forEach(h => { if (h && h.projects) pool.push.apply(pool, h.projects); });
                if (lastYearProjectList) pool.push.apply(pool, lastYearProjectList);
                if (projectList) pool.push.apply(pool, projectList);
                return FC.build(pool, workMap);
            }, [workMap, historicalData, lastYearProjectList, projectList]);

            const distDivMap = useMemo(() => {
                const agg = {};
                (projectList || []).forEach(p => {
                    const w = workMap[String(p.managerId || '').trim()]; if (!w || !w.distributor || !p.div) return;
                    if (!agg[w.distributor]) agg[w.distributor] = {};
                    agg[w.distributor][p.div] = (agg[w.distributor][p.div] || 0) + (p.sales || 0);
                });
                const out = {};
                Object.entries(agg).forEach(([d, m]) => { out[d] = Object.entries(m).sort((a, b) => b[1] - a[1])[0][0]; });
                return out;
            }, [projectList, workMap]);

            // 作品ごとの全期間実績（過去期の売上シートを含む）。DB見込額は作品の通算総額なので、残額はこれを基準に出す。
            const lifetimeAct = useMemo(() => {
                const m = {};
                const add = (list) => (list || []).forEach(p => {
                    const id = String(p.managerId || '').trim(); if (!id) return;
                    if (!m[id]) m[id] = { s: 0, p: 0 };
                    m[id].s += Number(p.sales) || 0; m[id].p += Number(p.profit) || 0;
                });
                Object.values(historicalData || {}).forEach(h => { if (h && h.projects) add(h.projects); });
                add(lastYearProjectList); add(projectList);
                return m;
            }, [historicalData, lastYearProjectList, projectList]);

            const matrix = useMemo(() => {
                const act = {}, noWork = { sales: Array(12).fill(0), profit: Array(12).fill(0) }, nwDiv = {};
                const skipped = { count: 0, sales: 0 }, actDiv = {};
                (projectList || []).forEach(p => {
                    const fi = FC.fiscalIdx(p.date, pStart);
                    if (fi < 0) { skipped.count++; skipped.sales += (p.sales || 0); return; }
                    const dk = p.div || '未配分';
                    if (!actDiv[dk]) actDiv[dk] = { s: 0, p: 0 };
                    actDiv[dk].s += (p.sales || 0); actDiv[dk].p += (p.profit || 0);
                    const id = String(p.managerId || '').trim();
                    if (!id || !workMap[id]) {
                        noWork.sales[fi] += (p.sales || 0); noWork.profit[fi] += (p.profit || 0);
                        const dv = p.div || '未配分';
                        if (!nwDiv[dv]) nwDiv[dv] = { sales: Array(12).fill(0), profit: Array(12).fill(0) };
                        nwDiv[dv].sales[fi] += (p.sales || 0); nwDiv[dv].profit[fi] += (p.profit || 0);
                        return;
                    }
                    if (!act[id]) act[id] = { sales: Array(12).fill(0), profit: Array(12).fill(0), jobs: {}, jobsP: {}, divs: {}, clients: {} };
                    const a = act[id];
                    a.sales[fi] += (p.sales || 0); a.profit[fi] += (p.profit || 0);
                    const c = Utils.getJobCategory(p.job);
                    a.jobs[c] = (a.jobs[c] || 0) + (p.sales || 0); a.jobsP[c] = (a.jobsP[c] || 0) + (p.profit || 0);
                    if (p.div) a.divs[p.div] = (a.divs[p.div] || 0) + (p.sales || 0);
                    if (p.client) a.clients[p.client] = (a.clients[p.client] || 0) + (p.profit || 0);
                });

                const ids = {};
                (releaseSchedule || []).forEach(w => { if (w.id && workMap[w.id]) ids[w.id] = 1; });
                Object.keys(act).forEach(id => ids[id] = 1);

                const rows = Object.keys(ids).map(id => {
                    const w = workMap[id];
                    const a = act[id] || { sales: Array(12).fill(0), profit: Array(12).fill(0), jobs: {}, jobsP: {}, divs: {}, clients: {} };
                    const planJobs = w.planJobs || {};
                    let planJobTotal = 0; C.CATS.forEach(c => planJobTotal += (planJobs[c] || 0));
                    const mix = planJobTotal > 0 ? planJobs : a.jobs;
                    const shares = FC.blendShares(fc, mix);
                    const actS = a.sales.reduce((x, y) => x + y, 0), actP = a.profit.reduce((x, y) => x + y, 0);
                    const planS = (w.planSales || 0) > 0 ? w.planSales : planJobTotal;
                    let planP = w.planProfit || 0;
                    if (planS > 0 && planP <= 0) planP = planS * FC.blendMargin(fc, mix);

                    const relFi = w.relKey != null ? w.relKey - pStart : null;
                    const life = lifetimeAct[id] || { s: 0, p: 0 };
                    const isPast = relFi != null && relFi < 0;
                    let remS = 0, remP = 0, src = 'none';
                    let fcS = Array(12).fill(0), fcP = Array(12).fill(0);

                    let lagS = 0, lagP = 0;
                    if (isPast) {
                        // 過年度公開：DB見込額は過去期に計上済みのため使わず、継続計上の実績トレンドから推計
                        const ts = FC.runRateFc(a.sales, curIdx, runRate), tp = FC.runRateFc(a.profit, curIdx, runRate);
                        if (ts.some(v => v > 0)) { src = 'tail'; fcS = ts; fcP = tp; } else src = 'actual';
                    } else {
                        if (planS > 0) {
                            src = 'plan';
                            remS = Math.max(0, planS - life.s); remP = Math.max(0, planP - life.p);
                        } else if (life.s > 0) {
                            const cons = FC.consumedShare(w.relKey, shares, lastClosedKey);
                            if (cons >= FC.MIN_CONSUMED && cons < 0.985) {
                                src = 'curve';
                                // 逆算の倍率に上限を設ける（薄い実績からの過大推計を防ぐ）
                                const mult = Math.min(1 / cons, curveCap);
                                remS = Math.max(0, life.s * mult - life.s); remP = Math.max(0, life.p * mult - life.p);
                            } else src = 'actual';
                        }
                        if (remS > 0 && (src === 'plan' || src === 'curve') && !FC.hasFutureSlot(w.relKey, pStart, shares, curIdx)) src = 'lag';
                        fcS = FC.distribute(remS, w.relKey, pStart, shares, curIdx);
                        fcP = FC.distribute(remP, w.relKey, pStart, shares, curIdx);
                        if (src === 'lag') {
                            lagS = fcS.reduce((x, y) => x + y, 0); lagP = fcP.reduce((x, y) => x + y, 0);
                            if (!includeLag) { fcS = Array(12).fill(0); fcP = Array(12).fill(0); }
                        }
                    }
                    // 当期に配分された分だけを「見込」として扱う（期をまたぐ分は当期の着地に含めない）
                    remS = fcS.reduce((x, y) => x + y, 0); remP = fcP.reduce((x, y) => x + y, 0);
                    const landS = actS + remS, landP = actP + remP;
                    const era = relFi == null ? 'unknown' : relFi < 0 ? 'past' : relFi > 11 ? 'future' : 'current';
                    const relYear = w.releaseDate ? w.releaseDate.substring(0, 4) : '';
                    const domDiv = Object.entries(a.divs).sort((x, y) => y[1] - x[1])[0];
                    const div = domDiv ? domDiv[0] : (distDivMap[w.distributor] || '');
                    const domCli = Object.entries(a.clients).sort((x, y) => y[1] - x[1])[0];
                    return {
                        id, name: w.name || worksMaster[id] || id, releaseDate: w.releaseDate, relFi, era, relYear,
                        distributor: w.distributor, category: w.category, div, client: domCli ? domCli[0] : '',
                        actMS: a.sales, actMP: a.profit, fcMS: fcS, fcMP: fcP,
                        actS, actP, landS, landP, remS, remP, planS, planP, src, lifeS: life.s, lifeP: life.p, lagS, lagP,
                        jobsAct: a.jobs, jobsActP: a.jobsP, planJobs, shares
                    };
                });

                // 作品コード紐付なし（一般案件）: 直近3ヶ月のランレートで残月を推計
                const sum12 = (x) => x.reduce((a, b) => a + b, 0);
                const nwFcS = Array(12).fill(0), nwFcP = Array(12).fill(0), nwDivFc = {};
                Object.entries(nwDiv).forEach(([dv, o]) => {
                    const fs = FC.runRateFc(o.sales, curIdx, runRate), fp = FC.runRateFc(o.profit, curIdx, runRate);
                    for (let i = 0; i < 12; i++) { nwFcS[i] += fs[i]; nwFcP[i] += fp[i]; }
                    nwDivFc[dv] = { actS: sum12(o.sales), actP: sum12(o.profit), remS: sum12(fs), remP: sum12(fp) };
                });
                const nwActS = noWork.sales.reduce((x, y) => x + y, 0), nwActP = noWork.profit.reduce((x, y) => x + y, 0);
                const nwRow = {
                    id: '__nowork__', name: '作品コード紐付なし（一般案件ほか）', releaseDate: '', relFi: null, era: 'unknown', relYear: '',

                    actMS: noWork.sales, actMP: noWork.profit, fcMS: nwFcS, fcMP: nwFcP,
                    actS: nwActS, actP: nwActP,
                    landS: nwActS + nwFcS.reduce((x, y) => x + y, 0), landP: nwActP + nwFcP.reduce((x, y) => x + y, 0),
                    remS: nwFcS.reduce((x, y) => x + y, 0), remP: nwFcP.reduce((x, y) => x + y, 0),
                    planS: 0, planP: 0, src: 'runrate', lifeS: 0, lifeP: 0, lagS: 0, lagP: 0, jobsAct: {}, jobsActP: {}, planJobs: {}, shares: {}
                };
                return { rows, nwRow, nwDivFc, skipped, actDiv };

            const divs = useMemo(() => {
                const s = {}; matrix.rows.forEach(r => { if (r.div) s[r.div] = 1; });

            const shown = useMemo(() => {

                if (q) { const k = q.toLowerCase(); rs = rs.filter(r => (r.name || '').toLowerCase().includes(k) || (r.distributor || '').toLowerCase().includes(k) || (r.client || '').toLowerCase().includes(k) || (r.id || '').toLowerCase().includes(k)); }
                const key = metric === 'sales' ? 'landS' : 'landP', rkey = metric === 'sales' ? 'remS' : 'remP';
                const grp = { current: 0, future: 1, past: 2, unknown: 3 };
                const inner = sortKey === 'release'

            const showNw = useMemo(() => (matrix.nwRow.actS > 0 || matrix.nwRow.remS > 0)

            const AS = { runRate, setRunRate, includeLag, setIncludeLag, curveCap, setCurveCap };

            const bud = useMemo(() => {

            const aggregate = useCallback((rs) => {

                const sum = (x) => x.reduce((s, v) => s + v, 0);

            const totals = useMemo(() => aggregate(shown.concat(showNw ? [matrix.nwRow] : [])), [aggregate, shown, showNw, matrix]);
            const totalsAll = useMemo(() => aggregate(matrix.rows.concat(matrix.nwRow.actS > 0 || matrix.nwRow.remS > 0 ? [matrix.nwRow] : [])), [aggregate, matrix]);

            const maxCell = useMemo(() => {
                let m = 0; shown.forEach(r => { const a = metric === 'sales' ? r.actMS : r.actMP, f = metric === 'sales' ? r.fcMS : r.fcMP; for (let i = 0; i < 12; i++) m = Math.max(m, a[i] + f[i]); });
                return m || 1;
            }, [shown, metric]);

            const noneCount = matrix.rows.filter(r => r.src === 'none' && r.relFi != null && r.relFi >= curIdx).length;
            const lagRows = matrix.rows.filter(r => r.src === 'lag');
            const lagAmt = lagRows.reduce((s, r) => s + (metric === 'sales' ? r.lagS : r.lagP), 0);
            const hasBudget = totalsAll.budget > 0;
            const tail = useMemo(() => {

                return { n: rs.length, act: rs.reduce((a, r) => a + (metric === 'sales' ? r.actS : r.actP), 0) };
            }, [matrix, metric]);
            const gap = totalsAll.land - totalsAll.budget;

            const summary = useMemo(() => {
                const pick = (r) => metric === 'sales' ? r.remS : r.remP;
                const bucket = (t) => matrix.rows.filter(r => r.src === t).reduce((a, r) => a + pick(r), 0);
                return {
                    act: totalsAll.act,
                    planFc: bucket('plan'), curveFc: bucket('curve'), lagFc: bucket('lag'),
                    tailFc: bucket('tail'),
                    nwFc: metric === 'sales' ? matrix.nwRow.remS : matrix.nwRow.remP,
                    land: totalsAll.land, budget: totalsAll.budget,
                    cntPlan: matrix.rows.filter(r => r.src === 'plan').length,
                    cntCurve: matrix.rows.filter(r => r.src === 'curve').length,
                    cntLag: lagRows.length
                };
            }, [matrix, totalsAll, metric, lagRows]);

            const breakdown = useMemo(() => {
                const defs = [
                    { k: 'plan', how: '案件管理DBの見込額 − 過去期を含む通算実績' },
                    { k: 'curve', how: `通算実績 × 計上カーブによる逆算（上限${curveCap === 99 ? 'なし' : curveCap + '倍'}）` },
                    { k: 'tail', how: `過年度公開作品の直近3ヶ月平均 × ${Math.round(runRate * 100)}%。直近の減速トレンドに合わせて毎月逓減。単発計上のみの作品は対象外` },
                    { k: 'runrate', how: `一般案件の直近3ヶ月平均 × ${Math.round(runRate * 100)}%。同じく減速トレンドを反映して逓減` },
                    { k: 'lag', how: includeLag ? '公開済み・請求残を当月に計上（着地に算入）' : '公開済み・請求残（着地には含めていない）' },
                    { k: 'actual', how: '計上完了とみなし、追加の見込なし' },
                    { k: 'none', how: 'DBに見込額がなく実績もない（見込ゼロ扱い）' }
                ];
                const all = matrix.rows.concat([matrix.nwRow]);
                return defs.map(d => {
                    const rs = all.filter(r => r.src === d.k);
                    const act = rs.reduce((a, r) => a + (metric === 'sales' ? r.actS : r.actP), 0);
                    const fcst = rs.reduce((a, r) => a + (metric === 'sales' ? r.remS : r.remP), 0);
                    const pot = d.k === 'lag' && !includeLag ? rs.reduce((a, r) => a + (metric === 'sales' ? r.lagS : r.lagP), 0) : 0;
                    return { ...d, label: FCSRC[d.k].label, cls: FCSRC[d.k].cls, n: rs.length, act, fcst, pot, land: act + fcst };
                }).filter(d => d.n > 0);
            }, [matrix, metric, curveCap, runRate, includeLag]);

            const divRows = useMemo(() => {
                const kSum = (arr) => (arr || []).reduce((a, v) => a + (Number(v) || 0), 0) * 1000;
                const known = { '第1': 1, '第2': 1, '第3': 1 };
                const rows = FDIVS.map(d => {

                    const budget = kSum(metric === 'sales' ? dm.budget : dm.budgetProfit);

                    const act = metric === 'sales' ? ad.s : ad.p;
                    const works = matrix.rows.filter(r => r.div === d.short).reduce((a, r) => a + (metric === 'sales' ? r.remS : r.remP), 0);
                    const nw = matrix.nwDivFc[d.short] || {};

                    return { ...d, budget, act, fc, land: act + fc, works, gen: metric === 'sales' ? (nw.remS || 0) : (nw.remP || 0) };
                });
                const sb = rows.reduce((a, r) => a + r.budget, 0), sa = rows.reduce((a, r) => a + r.act, 0), sf = rows.reduce((a, r) => a + r.fc, 0);
                const un = { k: 'un', label: '未配分・差分', short: '', color: '#cbd5e1', budget: totalsAll.budget - sb, act: totalsAll.act - sa, fc: totalsAll.fcst - sf };
                un.land = un.act + un.fc;
                const scale = Math.max(Math.abs(totalsAll.land), 1);
                const showUn = Math.abs(un.act) + Math.abs(un.fc) + Math.abs(un.budget) > scale * 0.005;
                return { rows, un, showUn, total: { label: '全社', budget: totalsAll.budget, act: totalsAll.act, fc: totalsAll.fcst, land: totalsAll.land } };
            }, [matrix, divisionMonthlyData, metric, totalsAll]);

            const actionLists = useMemo(() => ({
                none: matrix.rows.filter(r => r.src === 'none' && r.relFi != null && r.relFi >= curIdx).sort((a, b) => (a.releaseDate || '').localeCompare(b.releaseDate || '')).slice(0, 12),
                lag: lagRows.slice().sort((a, b) => (metric === 'sales' ? b.remS - a.remS : b.remP - a.remP)).slice(0, 12)
            }), [matrix, lagRows, curIdx, metric]);

            const exportCsv = () => {
                const head = ['管理番号', '作品名', '公開日', '公開時期', '配給', '事業部', '顧客', '区分', metric === 'sales' ? '着地売上' : '着地粗利', '実績', '見込'].concat(MONTH_LABELS.map(m => m + '実績')).concat(MONTH_LABELS.map(m => m + '見込'));
                const body = shown.concat(showNw ? [matrix.nwRow] : []).map(r => {
                    const a = metric === 'sales' ? r.actMS : r.actMP, f = metric === 'sales' ? r.fcMS : r.fcMP;
                    return [r.id, r.name, r.releaseDate, (FC.ERA[r.era] || {}).label || '', r.distributor, r.div, r.client, FCSRC[r.src].label,
                        Math.round(metric === 'sales' ? r.landS : r.landP), Math.round(metric === 'sales' ? r.actS : r.actP), Math.round(metric === 'sales' ? r.remS : r.remP)]
                        .concat(a.map(v => Math.round(v))).concat(f.map(v => Math.round(v)));

                const csv = '\uFEFF' + [head].concat(body).map(row => row.map(esc).join(',')).join('\n');

            const Th = ({ children, className = '' }) => <th className={`px-2 py-2 text-[11px] font-semibold text-gray-500 bg-gray-100 border-b border-gray-200 whitespace-nowrap ${className}`}>{children}</th>;

            const Row = ({ r }) => {

                        <tr className={`hover:bg-blue-50/50 cursor-pointer ${open ? 'bg-blue-50' : ''}`} onClick={() => setOpenId(open ? null : r.id)}>

        // --- 5.4 予実テーブル（月次 + 四半期 + 上期/下期の小計行つき） ---
        // 期は3月始まり。小計は月次の素データから計算するため、累計表示に切り替えても各期間の合計を示す。
        const SUBTOTAL_ROWS = [
            { key: 'q1',   after: 2,  label: '第1四半期 (3-5月)',  from: 0, to: 2,  tone: 'q' },
            { key: 'q2',   after: 5,  label: '第2四半期 (6-8月)',  from: 3, to: 5,  tone: 'q' },
            { key: 'h1',   after: 5,  label: '上期 (3-8月)',       from: 0, to: 5,  tone: 'half' },
            { key: 'q3',   after: 8,  label: '第3四半期 (9-11月)', from: 6, to: 8,  tone: 'q' },
            { key: 'q4',   after: 11, label: '第4四半期 (12-2月)', from: 9, to: 11, tone: 'q' },
            { key: 'h2',   after: 11, label: '下期 (9-2月)',       from: 6, to: 11, tone: 'half' },
            { key: 'year', after: 11, label: '通期',               from: 0, to: 11, tone: 'year' }
        ];
        const SUBTOTAL_TONE = {
            q:    { row: 'bg-blue-50 border-b-2 border-blue-200',        label: 'text-blue-800', value: 'text-blue-900', colorGap: true },
            half: { row: 'bg-[#f5f0e6] border-b-2 border-[#e5dccb]',     label: 'text-blue-800', value: 'text-blue-800', colorGap: false },
            year: { row: 'bg-[#e8dcc8] border-b-2 border-[#cdbb9f]',     label: 'text-blue-800', value: 'text-blue-800', colorGap: false }
        };
        function BudgetActualTable({ labels, budgetRow, actualRow, rawBudget, rawActual, lowerIsBetter }) {
            const yen = (v) => Utils.formatYen((Number(v) || 0) * 1000);
            const pick = (arr, i) => Number((arr || [])[i] || 0);
            const sum = (arr, from, to) => { let t = 0; for (let i = from; i <= to; i++) t += pick(arr, i); return t; };
            const gapCls = (gap, strong) => ((lowerIsBetter ? gap <= 0 : gap >= 0) ? (strong ? 'text-green-700' : 'text-green-600') : (strong ? 'text-red-700' : 'text-red-600'));
            const rows = [];
            (labels || []).forEach((label, i) => {
                const b = pick(budgetRow, i), a = pick(actualRow, i), g = a - b;
                rows.push(
                    <tr key={'m' + i} className="hover:bg-gray-50">
                        <td className="px-3 py-3 border-b text-gray-700 font-medium whitespace-nowrap">{label}</td>
                        <td className="px-3 py-3 border-b text-right text-gray-700 whitespace-nowrap">{yen(b)}</td>
                        <td className="px-3 py-3 border-b text-right text-gray-800 font-semibold whitespace-nowrap">{yen(a)}</td>
                        <td className={`px-3 py-3 border-b text-right font-semibold whitespace-nowrap ${gapCls(g)}`}>{yen(g)}</td>
                    </tr>
                );
                SUBTOTAL_ROWS.forEach(st => {
                    if (st.after !== i) return;
                    const b2 = sum(rawBudget, st.from, st.to), a2 = sum(rawActual, st.from, st.to), g2 = a2 - b2;
                    const t = SUBTOTAL_TONE[st.tone];
                    return rows.push(
                        <tr key={st.key} className={t.row}>
                            <td className={`px-3 py-3 font-bold whitespace-nowrap ${t.label}`}>{st.label}</td>
                            <td className={`px-3 py-3 text-right font-bold whitespace-nowrap ${t.value}`}>{yen(b2)}</td>
                            <td className={`px-3 py-3 text-right font-bold whitespace-nowrap ${t.value}`}>{yen(a2)}</td>
                            <td className={`px-3 py-3 text-right font-bold whitespace-nowrap ${t.colorGap ? gapCls(g2, true) : t.value}`}>{yen(g2)}</td>
                        </tr>
                    );
                });
            });
            return (
                <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                        <thead><tr className="bg-gray-50">
                            <th className="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase border-b whitespace-nowrap">月</th>
                            <th className="px-3 py-3 text-right text-xs font-semibold text-gray-600 uppercase border-b whitespace-nowrap">予算</th>
                            <th className="px-3 py-3 text-right text-xs font-semibold text-gray-600 uppercase border-b whitespace-nowrap">実績</th>
                            <th className="px-3 py-3 text-right text-xs font-semibold text-gray-600 uppercase border-b whitespace-nowrap">予実GAP</th>
                        </tr></thead>
                        <tbody>{rows}</tbody>
                    </table>
                </div>
            );
        }

        // --- 5.5 スプレッドシート同期レイヤー（リトライ / タイムアウト / 同時実行制御） ---
        const SYNC = {
            CORE_TYPES: ['actual', 'budget', 'expenses', 'expense_details', 'last_year', 'works', 'release_schedule'],
            TIMEOUT_MS: 90000,
            MAX_ATTEMPTS: 3,
            CONCURRENCY: 4,
            LABELS: { config: '期の設定', actual: '今期 売上実績', budget: '今期 予算', expenses: '販管費 実績', expense_details: '販管費 内訳', last_year: '昨期 売上実績', works: '作品コード表', release_schedule: '案件管理DB（公開作品）', exp_pl: '販管費予実表（経営陣用）', exp_items: '販管費詳細（経営陣用）', exp_pl_prev: '昨期の販管費予実表（比較用）', exp_items_prev: '昨期の販管費詳細（比較用）' },
            label: (type) => String(type).startsWith('history_') ? String(type).split('_')[1] + '期 売上実績' : (SYNC.LABELS[type] || type),
            // 無くてもダッシュボードの主要画面は成立する種別（過去実績タブ・販管費内訳のみ影響）
            optional: (type) => type === 'expense_details' || type === 'exp_pl_prev' || type === 'exp_items_prev' || String(type).startsWith('history_'),
            expectedSheets: (p) => {
                const list = [
                    { type: 'budget', sheet: '予算（読込用）' },
                    { type: 'actual', sheet: p + '期売上（boardから抜粋）' },
                    { type: 'last_year', sheet: (p - 1) + '期売上（昨期実績）' },
                    { type: 'expenses', sheet: '予算実績リスト' },
                    { type: 'expense_details', sheet: '販管費内訳' },
                    { type: 'works', sheet: '作品コード表' },
                    { type: 'release_schedule', sheet: '案件管理DB' }
                ];
                for (let i = 23; i <= p - 2; i++) list.push({ type: 'history_' + i, sheet: i + '期売上（boardから抜粋）' });
                return list;
            },
            url: (base, type) => base + (base.indexOf('?') >= 0 ? '&' : '?') + 'type=' + encodeURIComponent(type) + '&_=' + Date.now(),
            wait: (ms) => new Promise(r => setTimeout(r, ms)),
            err: (message, retryable) => { const e = new Error(message); e.retryable = retryable; return e; },

            // 1回だけ取得する。HTTPステータス・HTML応答・JSON破損をすべて例外として扱う
            fetchOnce: async (url) => {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), SYNC.TIMEOUT_MS);
                try {
                    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store', redirect: 'follow' });
                    const text = await res.text();
                    if (!res.ok) {
                        // Apps Script は exec URL から script.googleusercontent.com へ転送される。
                        // この転送が一時的に失敗すると 404 / 403 が返るため、これらも再試行の対象にする。
                        const transient = (res.status === 403 || res.status === 404 || res.status === 408 || res.status === 429 || res.status >= 500);
                        const hint = (res.status === 404 || res.status === 403) ? '（何度も出る場合は、連携URLが最新のデプロイのものかご確認ください）' : '';
                        throw SYNC.err('スプレッドシート側がエラーを返しました (HTTP ' + res.status + ')' + hint, transient);
                    }
                    const head = text.slice(0, 600).trim().toLowerCase();
                    if (head.charAt(0) === '<') {
                        if (head.indexOf('accounts.google') >= 0 || head.indexOf('servicelogin') >= 0 || head.indexOf('signin') >= 0) {
                            throw SYNC.err('Googleのログイン画面が返りました。Apps Scriptの「アクセスできるユーザー」の設定をご確認ください', false);
                        }
                        throw SYNC.err('スプレッドシート側がエラーページを返しました（Apps Scriptの実行エラーの可能性）', true);
                    }
                    try { return JSON.parse(text); }
                    catch (pe) { throw SYNC.err('応答が途中で切れています（データ量が多すぎる可能性）', true); }
                } catch (e) {
                    if (ctrl.signal.aborted) throw SYNC.err('応答がありません（タイムアウト）', true);
                    if (e instanceof TypeError) throw SYNC.err('通信できませんでした（ネットワークかURLをご確認ください）', true);
                    throw e;
                } finally { clearTimeout(timer); }
            },

            // 失敗したら待ち時間を延ばしながら最大 MAX_ATTEMPTS 回まで取り直す
            fetchJson: async (base, type, onRetry) => {
                let last = null;
                for (let attempt = 1; attempt <= SYNC.MAX_ATTEMPTS; attempt++) {
                    try {
                        const json = await SYNC.fetchOnce(SYNC.url(base, type));
                        if (json && json.error) throw SYNC.err(String(json.error), false);
                        return json;
                    } catch (e) {
                        last = e;
                        if (e.retryable === false || attempt === SYNC.MAX_ATTEMPTS) break;
                        const ms = Math.round(1000 * Math.pow(2, attempt - 1) * (0.7 + Math.random() * 0.6));
                        if (onRetry) onRetry(attempt, e, ms);
                        console.warn('[sync] ' + type + ' 失敗(' + attempt + '回目): ' + e.message + ' → ' + ms + 'ms後に再取得');
                        await SYNC.wait(ms);
                    }
                }
                throw last;
            },

            // 同時に走らせる本数を絞る（Apps Script は同時アクセスに弱いため）
            pool: async (items, limit, worker) => {
                let cursor = 0;
                const run = async () => { while (true) { const i = cursor++; if (i >= items.length) return; await worker(items[i], i); } };
                await Promise.all(Array.from({ length: Math.max(1, Math.min(limit, items.length)) }, run));
            }
        };

                        const pm = flat.match(/(\d+)期販管費予実/);
                        if (pm && Number(pm[1]) < (currentPeriodRef.current || 31)) { identifyAndProcess(rows, 'exp_pl_prev'); return; }
                        if (flat.includes('販管費予実') || (flat.includes('勘定科目') && flat.includes('予算') && flat.includes('実績'))) { identifyAndProcess(rows, 'exp_pl'); return; }
                        if (flat.includes('項目') && flat.includes('分類') && flat.includes('3月') && !flat.includes('予算')) { identifyAndProcess(rows, 'exp_items'); return; }
                        if (flat.includes('売上予算') || (flat.includes('予算') && flat.includes('全社'))) { identifyAndProcess(rows, 'budget'); return; }
                        if (flat.includes('売上') && (flat.includes('請求日') || flat.includes('計上日'))) { identifyAndProcess(rows, 'actual'); return; }
                        if (flat.includes('販管費') && flat.includes('実績')) { identifyAndProcess(rows, 'expenses'); return; }
                        if (flat.includes('粗利') && flat.includes('請求日')) { identifyAndProcess(rows, 'last_year'); return; }
                        if (flat.includes('管理番号') && flat.includes('作品名') && flat.includes('公開日') && flat.includes('配給')) { identifyAndProcess(rows, 'release_schedule'); return; }
                        if (flat.includes('管理番号') && flat.includes('作品名')) { identifyAndProcess(rows, 'works'); return; }
                        return;
                    }
                    let d, ok = null;
                    switch (type) {
                        case 'budget':
                            console.log('[identifyAndProcess] Processing budget, rows count:', rows?.length);
                            d = DataProcessor.processBudget(rows);
                            if(d) {
                                console.log('[identifyAndProcess] Budget processed successfully:', d.main);
                                setMonthlyData(p=>{
                                    const newData = {...p, ...d.main};
                                    console.log('[identifyAndProcess] monthlyData updated - budget:', newData.budget, 'budgetProfit:', newData.budgetProfit);
                                    return newData;
                                });
                                setDivisionMonthlyData(prev => ({ div1: {...prev.div1, ...d.div1}, div2: {...prev.div2, ...d.div2}, div3: {...prev.div3, ...d.div3} }));
                            }
                            break;
                        case 'actual':
                            d = DataProcessor.processBoardSales(rows);
                            if(d) {
                                setProjectList(d.projects); setDivisionData({labels:['第1','第2','第3'],sales:[d.divTotal.d1.s, d.divTotal.d2.s, d.divTotal.d3.s], profit:[d.divTotal.d1.p, d.divTotal.d2.p, d.divTotal.d3.p]});
                                setDivisionMonthlyData(prev => ({ div1: { ...prev.div1, actual: d.divAgg.d1.s, profit: d.divAgg.d1.p, op: (prev.div1.expenses || Array(12).fill(0)).map((e,i)=>d.divAgg.d1.p[i]-e) }, div2: { ...prev.div2, actual: d.divAgg.d2.s, profit: d.divAgg.d2.p, op: (prev.div2.expenses || Array(12).fill(0)).map((e,i)=>d.divAgg.d2.p[i]-e) }, div3: { ...prev.div3, actual: d.divAgg.d3.s, profit: d.divAgg.d3.p, op: (prev.div3.expenses || Array(12).fill(0)).map((e,i)=>d.divAgg.d3.p[i]-e) } }));
                                setMonthlyData(p=>{ const newActualProfit = d.agg.p; const currentExpenses = p.expenses || Array(12).fill(0); const newOp = newActualProfit.map((val, i) => val - currentExpenses[i]); return {...p, actual:d.agg.s, actualProfit:newActualProfit, operatingProfit: newOp}; });
                            }
                            break;
                        case 'last_year':
                            d = DataProcessor.processLastYearData(rows);
                            if(d) { setMonthlyData(p=>({...p, lastYear:d.agg.s, lastYearProfit:d.agg.p})); setLastYearClientStats(d.cAgg); setLastYearProjectList(d.lyProjects); }
                            break;
                        case 'expenses':
                            d = DataProcessor.processExpenses(rows);
                            if(d) {
                                setMonthlyData(p=> { const newExpenses = d.exp; const currentActualProfit = p.actualProfit || Array(12).fill(0); const newOp = currentActualProfit.map((val, i) => val - newExpenses[i]); return {...p, expenses:newExpenses, operatingProfit: newOp}; });
                                setDivisionMonthlyData(prev => ({ div1: { ...prev.div1, expenses: d.de.d1, op: (prev.div1.profit||Array(12).fill(0)).map((p,i)=>p-d.de.d1[i]) }, div2: { ...prev.div2, expenses: d.de.d2, op: (prev.div2.profit||Array(12).fill(0)).map((p,i)=>p-d.de.d2[i]) }, div3: { ...prev.div3, expenses: d.de.d3, op: (prev.div3.profit||Array(12).fill(0)).map((p,i)=>p-d.de.d3[i]) } }));
                            }
                            break;
                        case 'works':
                            const header = rows[0].map(String), iId = header.findIndex(h => h.includes("管理番号")), iName = header.findIndex(h => h.includes("作品名"));
                            if (iId !== -1 && iName !== -1) { const m = {}; rows.slice(1).forEach(r => { const id = String(r[iId] || "").trim(), name = String(r[iName] || "").trim(); if (id) m[id] = name; }); setWorksMaster(m); ok = true; } else { ok = false; }
                            break;
                        case 'release_schedule': {
                            let hIdx = -1;
                            for (let ri = 0; ri < Math.min(rows.length, 5); ri++) {
                                if (!rows[ri] || !Array.isArray(rows[ri])) continue;
                                const rowStr = rows[ri].map(String).join(' ');
                                if (rowStr.includes('作品名') && rowStr.includes('公開日')) { hIdx = ri; break; }
                            }
                            if (hIdx === -1) { console.warn('[release_schedule] Header row not found'); ok = false; break; }
                            const h = rows[hIdx].map(c => String(c || '').replace(/\n/g, ''));
                            console.log('[release_schedule] Header found at row', hIdx, ':', h.slice(0, 8));
                            const findCol = (keyword) => h.findIndex(c => c.includes(keyword));
                            const idx = { id: findCol('管理番号'), name: findCol('作品名'), date: findCol('公開日'), dist: findCol('配給'), country: findCol('製作国'), anime: findCol('アニメ'), director: findCol('スタッフ'), cast: findCol('キャスト'), sales: findCol('全体売上'), profit: findCol('全体粗利'), boxOffice: findCol('初週興行収入'), screens: findCol('初週館数') };
                            const jobCols = FC.JOBS.map(j => ({ cat: j.cat, s: findCol(j.db + '売上'), p: findCol(j.db + '粗利') }));
                            console.log('[release_schedule] Column indices:', idx);
                            if (idx.date === -1 || idx.name === -1) { console.warn('[release_schedule] Required columns not found'); ok = false; break; }
                            const JP_MAJOR = ['東宝','松竹','東映','ワーナー'];
                            const FO_MAJOR = ['東宝東和','東和ピクチャーズ','ワーナー','ディズニー','ソニー'];
                            const matchDist = (dist, list) => { const d = (dist||''); return list.some(m => d.includes(m)); };
                            const classifyCategory = (country, dist) => {
                                const jp = (country||'').includes('日本');
                                if (jp && matchDist(dist, JP_MAJOR)) return '邦画メジャー';
                                if (!jp && matchDist(dist, FO_MAJOR)) return '洋画メジャー';
                                if (jp) return '邦画独立系';
                                return '洋画独立系';
                            };
                            const items = [];
                            const allItems = [];
                            const toDateStr = (val) => {
                                if (!val) return '';
                                if (val instanceof Date) {
                                    const yy = val.getFullYear(), mm = val.getMonth() + 1, dd = val.getDate();
                                    return `${yy}/${String(mm).padStart(2,'0')}/${String(dd).padStart(2,'0')}`;
                                }
                                const s = String(val).trim();
                                if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.replace(/-/g, '/').substring(0, 10);
                                return s;
                            };
                            rows.slice(hIdx + 1).forEach(r => {
                                if (!r || !Array.isArray(r)) return;
                                const dateStr = toDateStr(r[idx.date]);
                                if (!dateStr) return;
                                const dm = dateStr.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
                                if (!dm) return;
                                const y = parseInt(dm[1]), m = parseInt(dm[2]);
                                const startYear = 1995 + currentPeriodRef.current;
                                const inPeriod = (y === startYear && m >= 3) || (y === startYear + 1 && m <= 5);
                                const name = String(r[idx.name] || '').trim();
                                if (!name) return;
                                const dist = idx.dist >= 0 ? String(r[idx.dist] || '').trim() : '';
                                const country = idx.country >= 0 ? String(r[idx.country] || '').trim() : '';
                                const planJobs = {}, planJobsP = {};
                                jobCols.forEach(jc => { if (jc.s >= 0) planJobs[jc.cat] = Utils.parseCurrency(r[jc.s]); if (jc.p >= 0) planJobsP[jc.cat] = Utils.parseCurrency(r[jc.p]); });
                                const item = ({
                                    id: String(r[idx.id] || '').trim(),
                                    name: name,
                                    releaseDate: dateStr,
                                    distributor: dist,
                                    country: country,
                                    anime: idx.anime >= 0 && String(r[idx.anime] || '').toUpperCase() === 'TRUE',
                                    category: classifyCategory(country, dist),
                                    director: idx.director >= 0 ? String(r[idx.director] || '').trim() : '',
                                    cast: idx.cast >= 0 ? String(r[idx.cast] || '').trim() : '',
                                    sales: idx.sales >= 0 ? Utils.parseCurrency(r[idx.sales]) : 0,
                                    profit: idx.profit >= 0 ? Utils.parseCurrency(r[idx.profit]) : 0,
                                    boxOffice: idx.boxOffice >= 0 ? Utils.parseCurrency(r[idx.boxOffice]) : 0,
                                    screens: idx.screens >= 0 ? parseInt(String(r[idx.screens] || '0').replace(/,/g, '')) || 0 : 0,
                                    fiscalMonth: ((m - 3 + 12) % 12),
                                    relKey: y * 12 + (m - 1),
                                    planSales: idx.sales >= 0 ? Utils.parseCurrency(r[idx.sales]) : 0,
                                    planProfit: idx.profit >= 0 ? Utils.parseCurrency(r[idx.profit]) : 0,
                                    planJobs: planJobs,
                                    planJobsP: planJobsP
                                });
                                if (item.id) allItems.push(item);
                                if (inPeriod) items.push(item);
                            });
                            items.sort((a, b) => a.releaseDate.localeCompare(b.releaseDate));
                            allItems.sort((a, b) => a.releaseDate.localeCompare(b.releaseDate));
                            console.log(`[release_schedule] Loaded ${items.length} works for period / ${allItems.length} works total`);
                            setReleaseSchedule(items);
                            setAllWorks(allItems);
                            ok = true;
                            break;
                        }
                        case 'expense_details':
                            d = DataProcessor.processExpenseDetails(rows, MONTH_LABELS);
                            if(d) setExpenseDetails(d);
                            break;
                        case 'exp_pl':
                            d = EXP.parsePL(rows);
                            if (d) { setExecPL(d); setExecStatus(''); }
                            break;
                        case 'exp_pl_prev':
                            d = EXP.parsePL(rows);
                            if (d) setExecPrev(d);
                            break;
                        case 'exp_items_prev':
                            d = EXP.parseItems(rows);
                            if (d) setExecPrevItems(d);
                            break;
                        case 'exp_items':
                            d = EXP.parseItems(rows);
                            if (d) setExecItems(d);
                            break;
                        default:
                            if (type.startsWith('history_')) {
                                const period = type.split('_')[1];
                                d = DataProcessor.processLastYearData(rows);
                                if (d) setHistoricalData(prev => ({...prev, [period]: { agg: d.agg, projects: d.lyProjects } }));
                            }
                            break;
                    }
                    if (ok === false || (ok === null && !d)) throw new Error('シートの中身を認識できませんでした（見出し行や列名が変わっていないかご確認ください）');
                } catch(e) {
                    console.error('[取込エラー] ' + type + ':', e);
                    throw e;
                }
            };

            // 1系統ぶんの取得＋取込。成功なら null、失敗なら理由を返す
            const syncOne = async (base, type, onRetry) => {
                try {
                    const json = await SYNC.fetchJson(base, type, onRetry);
                    const rows = json && json.data;
                    if (!Array.isArray(rows)) throw new Error('データが返ってきませんでした（シート名をご確認ください）');
                    if (rows.length === 0) throw new Error('シートが空です');
                    const headText = rows.slice(0, 3).map(r => Array.isArray(r) ? r.join('') : String(r)).join('');
                    if (headText.indexOf('#REF!') >= 0) throw new Error('シートが #REF! エラーになっています（他ファイルを参照する数式が切れている可能性）');
                    identifyAndProcess(rows, type);
                    console.log('[sync] ' + type + ' 取込完了 (' + rows.length + '行)');
                    return null;
                } catch (e) {
                    console.error('[sync] ' + type + ' 失敗:', e.message);
                    return { type: type, label: SYNC.label(type), message: e.message, optional: SYNC.optional(type) };
                }
            };

            const fetchExec = async () => {
                const { url, key } = execRef.current;
                if (!url || !key) { setExecStatus('連携URLと合言葉が未設定です。'); setReports([]); setReportStatus('経営陣用の連携（URLと合言葉）が未設定のため、週次の業務レポートを読み込めません。'); setExecDone(true); return; }
                const base = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(key);
                setExecStatus('読み込み中...');
                const errs = [];
                for (const type of ['exp_pl', 'exp_items', 'exp_pl_prev', 'exp_items_prev']) {
                    const err = await syncOne(base, type);
                    if (err) errs.push(err);
                }
                setLoadErrors(prev => prev.filter(x => !String(x.type).startsWith('exp_')).concat(errs));
                try {
                    const sj = await SYNC.fetchJson(base, 'snapshots');
                    const map = {};
                    (sj && Array.isArray(sj.data) ? sj.data : []).forEach(r => { if (r && r.week && r.data) map[r.week] = { ...r.data, week: r.week, src: 'saved', savedAt: r.savedAt }; });
                    setSnapRecords(prev => { const m = { ...prev, ...map }; SNAP.saveLocal(m); return m; });
                    setSnapShared(true);
                } catch (e) { setSnapShared(false); }
                try {
                    const rj = await SYNC.fetchJson(base, 'reports');
                    if (!rj || !Array.isArray(rj.data)) throw new Error('応答の形式が違います');
                    setReports(rj.data); setReportStatus('');
                } catch (e) { setReports([]); setReportStatus('週次の業務レポートを読み込めませんでした（' + e.message + '）。Apps Script の更新・再デプロイと、ドキュメントの閲覧権限をご確認ください。'); }
                setExecDone(true);
                setExecStatus(errs.filter(e => !e.optional).length ? errs.filter(e => !e.optional).map(e => e.label + '：' + e.message).join(' ／ ') : '');
            };

            const fetchFromSpreadsheet = async (url) => {
                const targetUrl = String(url || apiUrl || '').trim();
                if (!targetUrl) { setShowSettings(true); return; }
                if (isFetchingRef.current) { console.warn('[sync] 取得中のため二重実行を見送りました'); return; }
                isFetchingRef.current = true;
                setIsLoading(true);
                setLoadErrors([]);
                setLoadingStatus('スプレッドシートに接続中...');

                const errors = [];
                let done = 0;
                const total = SYNC.CORE_TYPES.length;
                const onRetry = (label) => (attempt) => setLoadingStatus(label + ' を再取得中（' + (attempt + 1) + '回目）...');

                // 期の設定（取れなくても既定値のまま続行する）
                let period = currentPeriodRef.current || 31;
                try {
                    const cfg = await SYNC.fetchJson(targetUrl, 'config', onRetry(SYNC.label('config')));
                    const p = Number(cfg && cfg.data && cfg.data.currentPeriod);
                    if (p > 0) { period = p; currentPeriodRef.current = p; setCurrentPeriod(p); }
                } catch (e) {
                    console.warn('[sync] config 失敗:', e.message);
                    errors.push({ type: 'config', label: SYNC.label('config'), message: e.message + '（' + period + '期として表示します）' });
                }

                // 本体データ：同時実行を絞りつつ取得
                await SYNC.pool(SYNC.CORE_TYPES, SYNC.CONCURRENCY, async (type) => {
                    const label = SYNC.label(type);
                    setLoadingStatus(label + ' を取得中...（' + (done + 1) + '/' + total + '）');
                    const err = await syncOne(targetUrl, type, onRetry(label));
                    if (err) errors.push(err);
                    done++;
                    setLoadingStatus(label + ' 完了（' + done + '/' + total + '）');
                });

                setLoadErrors(errors.slice());
                setLastSyncAt(new Date());
                setIsLoading(false);
                isFetchingRef.current = false;
                fetchExec();

                // 過去期は画面を止めずに裏で取得する
                const historyTypes = [];
                for (let i = 23; i <= period - 2; i++) historyTypes.push('history_' + i);
                if (historyTypes.length === 0) return;
                setHistorySyncing(true);
                await SYNC.pool(historyTypes, 2, async (type) => {
                    const err = await syncOne(targetUrl, type, onRetry(SYNC.label(type)));
                    if (err) setLoadErrors(prev => prev.filter(x => x.type !== err.type).concat([err]));
                });
                setHistorySyncing(false);
            };

            useEffect(() => {
                const u = (localStorage.getItem('gaie_dashboard_api_url') || '').trim();
                if (u) { setApiUrl(u); fetchFromSpreadsheet(u); } else { setShowSettings(true); fetchExec(); }
            }, []);

            const calculateRankedProjects = useCallback((list, master, opts) => { const agg = {}; (list||[]).forEach(p => { const key = p.managerId || p.title; if(!agg[key]) agg[key] = { id: p.managerId, name: (master && p.managerId && master[p.managerId]) ? master[p.managerId] : p.title, client: p.client, sales: 0, profit: 0, count: 0, clients: {} }; agg[key].sales += p.sales; agg[key].profit += p.profit; agg[key].count++; const c = p.client||"不明"; agg[key].clients[c] = (agg[key].clients[c]||0)+p.profit; }); let result = Object.values(agg).map(p => ({ ...p, clientDisplay: Object.entries(p.clients).sort((a,b)=>b[1]-a[1])[0]?.[0] || p.client })).sort((a,b)=>b.profit-a.profit); if (opts && opts.minProfit != null) result = result.filter(p => p.profit >= opts.minProfit); if (opts && opts.limit != null) result = result.slice(0, opts.limit); else if (!opts || opts.minProfit == null) result = result.slice(0, 15); return result; }, []);
            const calculateRankedClients = useCallback((list) => { const agg = {}; (list||[]).forEach(p => { const k = p.client || '不明'; if(!agg[k]) agg[k] = { sales: 0, profit: 0 }; agg[k].sales += p.sales; agg[k].profit += p.profit; }); return Object.entries(agg).map(([name, d]) => ({ name, ...d, margin: d.sales > 0 ? (d.profit / d.sales * 100) : 0 })).sort((a,b) => b.profit - a.profit).slice(0, 10); }, []);


            const mkBigCount = useMemo(() => { const t = MK.baseDate(mkBaseDays).getTime(); return (projectList || []).filter(p => MK.isFresh(p, t) && (p.profit || 0) >= 1000000).length; }, [projectList, mkBaseDays]);
            const snapCtx = { monthlyData, projectList, worksMaster, execPL, execItems, execPrev, currentPeriod };
            const snapReady = execDone && !isLoading && (projectList || []).length > 0 && MK.sum(monthlyData.budgetProfit) > 0;
            const liveSnap = useMemo(() => snapReady ? SNAP.build(snapCtx, new Date(), true) : null, [snapReady, monthlyData, projectList, worksMaster, execPL, execItems, execPrev, currentPeriod]);
            const rebuiltSnaps = useMemo(() => {
                if (!snapReady || activeTab !== 'home') return {};
                const out = {}, mon = SNAP.monday(new Date()), pStart = FC.periodStartKey(currentPeriod);
                for (let k = 1; k <= 12; k++) {
                    const d = new Date(mon); d.setDate(d.getDate() - 7 * k);
                    if (d.getFullYear() * 12 + d.getMonth() < pStart) break;
                    const key = SNAP.ymd(d);
                    if (!snapRecords[key]) out[key] = SNAP.build(snapCtx, d, false);
                }
                return out;
            }, [snapReady, activeTab, snapRecords, monthlyData, projectList, execPL, execItems, execPrev, currentPeriod]);
            const allSnaps = useMemo(() => liveSnap ? { ...rebuiltSnaps, ...snapRecords, [liveSnap.week]: liveSnap } : {}, [rebuiltSnaps, snapRecords, liveSnap]);
            const saveSnap = async (manual) => {
                if (!liveSnap || snapSavingRef.current) return;
                snapSavingRef.current = true;
                const rec = { ...liveSnap, src: 'saved', savedAt: new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) };
                setSnapRecords(prev => { const m = { ...prev, [rec.week]: rec }; SNAP.saveLocal(m); return m; });
                const u = String(execUrl || '').trim(), k = String(execKey || '').trim();
                try {
                    if (!u || !k) throw new Error('local');
                    const res = await fetch(u, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'snapshot_save', key: k, week: rec.week, manual: !!manual, data: liveSnap }) });
                    const j = JSON.parse(await res.text());
                    if (j.error) throw new Error(j.error);
                    setSnapMsg(manual ? `${SNAP.label(rec.week)}の記録を今の数字で更新しました（経営陣で共有）。` : `${SNAP.label(rec.week)}の記録を保存しました（経営陣で共有）。`);
                } catch (e) {
                    setSnapMsg(e.message === 'local' ? '経営陣用の連携が未設定のため、記録はこのパソコンにだけ保存しています。' : `記録はこのパソコンにだけ保存しました（共有の保存に失敗：${e.message}。Apps Script に「経営陣用_週次記録.gs」を追加して再デプロイしてください）。`);
                } finally { snapSavingRef.current = false; }
            };
            useEffect(() => { if (liveSnap && !snapRecords[liveSnap.week]) saveSnap(false); }, [liveSnap]);
            const hardErrors = loadErrors.filter(e => !e.optional);
            const softErrors = loadErrors.filter(e => e.optional);

            return (
                <div className="min-h-screen bg-[#F4F6F8] flex font-sans text-gray-800" onDragOver={(e)=>{e.preventDefault();setIsDragging(true);}} onDragLeave={(e)=>{if(e.currentTarget===e.target)setIsDragging(false);}} onDrop={handleDrop}>
                    {(() => {
                        const label = (id) => id === 'home' ? '今週のまとめ' : (MK.PAGES.find(p => p.id === id) || navItems.find(n => n.id === id) || {}).label;
                        const side = (
                            <div className="flex flex-col h-full">
                                <div className="px-5 pt-5 pb-4 border-b border-gray-100">
                                    <div className="flex items-center gap-2"><div className="w-8 h-8 rounded-lg bg-[#00ADE7] text-white flex items-center justify-center"><Icon name="Activity" size={18} /></div><div className="leading-tight"><div className="text-base font-extrabold text-gray-800">Gaie Sales</div><div className="text-xs text-gray-500">売上管理ダッシュボード</div></div></div>
                                    <span className="inline-block mt-3 px-2 py-0.5 rounded bg-red-600 text-white text-[11px] font-bold">経営陣版</span>
                                </div>
                                <nav className="flex-1 overflow-y-auto px-3 py-4 space-y-5">
                                    {NAV_GROUPS.map(g => (
                                        <div key={g.label}>
                                            <div className={`px-3 mb-1.5 text-xs font-bold ${g.main ? 'text-[#0093C4]' : 'text-gray-400'}`}>{g.label}</div>
                                            {g.items.map(id => {
                                                const on = activeTab === id, pg = MK.PAGES.find(p => p.id === id), n = navItems.find(x => x.id === id);
                                                return (
                                                    <button key={id} onClick={() => { goTab(id); setNavOpen(false); }} className={`w-full flex items-center gap-2.5 rounded-lg text-left transition-colors ${g.main ? 'px-3 py-2.5 text-base font-bold' : 'px-3 py-2 text-sm'} ${on ? 'bg-[#00ADE7] text-white' : g.main ? 'text-gray-800 hover:bg-sky-50' : 'text-gray-600 hover:bg-gray-100'}`}>
                                                        {id === 'home' ? <Icon name="Dashboard" size={18} /> : pg ? <span className={`w-6 h-6 rounded-full text-xs font-extrabold flex items-center justify-center shrink-0 ${on ? 'bg-white text-[#0093C4]' : 'bg-sky-100 text-[#0093C4]'}`}>{pg.n}</span> : <Icon name={n.icon} size={16} />}
                                                        <span className="flex-1">{label(id)}</span>
                                                        {id === 'mk_works' && mkBigCount > 0 && <span className={`min-w-[22px] h-[22px] px-1.5 rounded-full text-xs flex items-center justify-center ${on ? 'bg-white text-orange-600' : 'bg-orange-500 text-white'}`}>{mkBigCount}</span>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </nav>
                                <div className="px-4 py-4 border-t border-gray-100 space-y-2">
                                    <div className="text-xs text-gray-500">{isLoading ? <span className="text-[#0093C4] font-bold">同期中...</span> : (hardErrors.length > 0 ? <span className="text-amber-600 font-bold">データ一部欠損</span> : (lastSyncAt ? <>最終同期 {lastSyncAt.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</> : '未同期'))}{historySyncing && <><br />過去期を取得中...</>}</div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>fetchFromSpreadsheet()} disabled={isLoading} className="flex-1 flex items-center justify-center gap-1.5 text-sm font-bold text-gray-700 bg-gray-50 hover:bg-sky-50 py-2 rounded-lg border border-gray-200 disabled:opacity-40"><Icon name="Cloud" size={14} />更新</button>
                                        <button onClick={()=>setShowSettings(true)} className="relative flex-1 flex items-center justify-center gap-1.5 text-sm font-bold text-gray-700 bg-gray-50 hover:bg-sky-50 py-2 rounded-lg border border-gray-200"><Icon name="Settings" size={14} />連携{hardErrors.length > 0 && <span className="absolute -top-1 -right-1 h-2.5 w-2.5 rounded-full bg-amber-500 border border-white"></span>}</button>
                                    </div>
                                </div>
                            </div>
                        );
                        return <>
                            <aside className="hidden lg:block w-64 shrink-0 bg-white border-r border-gray-200 h-screen sticky top-0">{side}</aside>
                            {navOpen && <div className="lg:hidden fixed inset-0 z-[60] flex"><div className="w-72 max-w-[85vw] bg-white h-full shadow-2xl">{side}</div><div className="flex-1 bg-slate-900/40" onClick={() => setNavOpen(false)}></div></div>}
                        </>;
                    })()}
                    <div className="flex-1 min-w-0 flex flex-col">
                        <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-200">
                            <div className="max-w-7xl mx-auto w-full px-4 sm:px-8 h-14 flex items-center gap-3">
                                <button onClick={() => setNavOpen(true)} className="lg:hidden px-3 py-1.5 rounded-lg border border-gray-300 text-sm font-bold text-gray-700">メニュー</button>
                                <div className="min-w-0 flex-1">
                                    <div className="text-xs text-gray-400 leading-none">{(NAV_GROUPS.find(g => g.items.includes(activeTab)) || {}).label}</div>
                                    <div className="text-lg font-extrabold text-gray-800 truncate">{activeTab === 'home' ? '今週のまとめ' : (MK.PAGES.find(p => p.id === activeTab) || navItems.find(n => n.id === activeTab) || {}).label}</div>
                                </div>
                                <div className="flex items-center gap-1 bg-gray-100 p-1 rounded-lg text-sm">
                                    <span className="px-2 text-gray-500 hidden sm:inline">文字</span>
                                    {[[false, '標準'], [true, '大']].map(([v, l]) => <button key={l} onClick={() => setBigText(v)} className={`px-3 py-1 rounded-md font-bold ${bigText === v ? 'bg-white text-[#0093C4] shadow-sm' : 'text-gray-500'}`}>{l}</button>)}
                                </div>
                            </div>
                        </header>
                    <main className="flex-1 p-4 sm:p-6 max-w-7xl mx-auto w-full">
                         {isLoading && <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/30 backdrop-blur-sm"><div className="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full relative overflow-hidden"><div className="mb-6 relative flex items-center justify-center h-20 w-20"><div className="absolute inset-0 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div><div className="relative bg-white p-4 rounded-full shadow-sm text-blue-600"><Icon name="TrendingUp" size={32} /></div></div><h3 className="text-lg font-bold text-gray-800 mb-2">データを同期中</h3><p className="text-xs text-gray-500 mb-1">{loadingStatus}</p></div></div>}
                         {!isLoading && hardErrors.length > 0 && (
                             <div className="mb-4 rounded-xl border border-amber-300 bg-amber-50 p-4">
                                 <div className="flex items-start gap-3">
                                     <span className="text-amber-600 mt-0.5 flex-shrink-0"><Icon name="Alert" size={18} /></span>
                                     <div className="flex-1 min-w-0">
                                         <h3 className="text-sm font-bold text-amber-900">一部のデータを読み込めませんでした。表示中の数字は不完全です。</h3>
                                         <ul className="mt-2 space-y-1">
                                             {hardErrors.map(e => (<li key={e.type} className="text-xs text-amber-800"><span className="font-bold">{e.label}</span>：{e.message}</li>))}
                                         </ul>
                                         <p className="mt-2 text-xs text-amber-700">シート名が変わっている場合は、右上の「連携」→「診断する」でスプレッドシート内のシート一覧を確認できます。</p>
                                     </div>
                                     <button onClick={()=>fetchFromSpreadsheet()} className="flex-shrink-0 px-3 py-1.5 text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 rounded-lg">再取得</button>
                                 </div>
                             </div>
                         )}
                         {!isLoading && softErrors.length > 0 && (
                             <div className="mb-4 rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5">
                                 <p className="text-xs text-gray-500"><span className="font-bold text-gray-600">未整備のため非表示：</span>{softErrors.map(e => e.label).join('、')}<span className="text-gray-400">（対象シートがありません。全社・事業部の数字には影響しません）</span></p>
                             </div>
                         )}
                         <ErrorBoundary resetKey={activeTab}>
                             {activeTab === 'home' && <MkHomePage reports={reports} snaps={allSnaps} liveSnap={liveSnap} currentPeriod={currentPeriod} onGo={goTab} onSaveNow={() => saveSnap(true)} saveInfo={snapMsg} view={mkView} setView={setMkView} />}
                             {activeTab === 'mk_month' && <MkMonthPage reports={reports} reportStatus={reportStatus} monthlyData={monthlyData} projectList={projectList} lastYearProjectList={lastYearProjectList} divisionMonthlyData={divisionMonthlyData} worksMaster={worksMaster} currentPeriod={currentPeriod} view={mkView} setView={setMkView} baseDays={mkBaseDays} setBaseDays={setMkBaseDays} onGo={goTab} />}
                             {activeTab === 'mk_outlook' && <MkOutlookPage monthlyData={monthlyData} divisionMonthlyData={divisionMonthlyData} execPL={execPL} execItems={execItems} execPrev={execPrev} currentPeriod={currentPeriod} view={mkView} setView={setMkView} onGo={goTab} />}
                             {activeTab === 'mk_works' && <MkWorksPage projectList={projectList} lastYearProjectList={lastYearProjectList} historicalData={historicalData} allWorks={allWorks} worksMaster={worksMaster} view={mkView} setView={setMkView} baseDays={mkBaseDays} setBaseDays={setMkBaseDays} onGo={goTab} />}
                             {activeTab === 'mk_exp' && <MkExpensePage execPL={execPL} execItems={execItems} execPrev={execPrev} monthlyData={monthlyData} view={mkView} setView={setMkView} onGo={goTab} onOpenDetail={() => goTab('expenses')} onOpenSettings={() => setShowSettings(true)} />}
                             {activeTab === 'dashboard' && <DashboardPage monthlyData={monthlyData} projectList={projectList} worksMaster={worksMaster} divisionMonthlyData={divisionMonthlyData} divisionData={divisionData} displayMode={displayMode} setDisplayMode={setDisplayMode} opMode={opMode} setOpMode={setOpMode} monthlyViewMode={monthlyViewMode} setMonthlyViewMode={setMonthlyViewMode} opViewMode={opViewMode} setOpViewMode={setOpViewMode} expenseViewMode={expenseViewMode} setExpenseViewMode={setExpenseViewMode} calculateRankedProjects={calculateRankedProjects} calculateRankedClients={calculateRankedClients} />}
                             {activeTab === 'weekly' && <WeeklySummaryPage projectList={projectList} worksMaster={worksMaster} releaseSchedule={releaseSchedule} currentPeriod={currentPeriod} />}
                             {activeTab === 'forecast' && <ForecastPage allWorks={allWorks} releaseSchedule={releaseSchedule} projectList={projectList} lastYearProjectList={lastYearProjectList} historicalData={historicalData} monthlyData={monthlyData} divisionMonthlyData={divisionMonthlyData} worksMaster={worksMaster} currentPeriod={currentPeriod} />}
                             {activeTab === 'expenses' && <ExecExpensesPage execPL={execPL} execItems={execItems} execPrev={execPrev} execPrevItems={execPrevItems} prevPeriod={currentPeriod - 1} asOf={execAsOf} setAsOf={setExecAsOf} execStatus={execStatus} onOpenSettings={() => setShowSettings(true)} onOpenReport={() => { setReportKind('expense'); setActiveTab('report'); window.scrollTo(0, 0); }} fallback={<ExpensesPage expenseDetails={expenseDetails} monthlyData={monthlyData} requestExpenseSort={requestExpenseSort} expenseSortConfig={expenseSortConfig} />} />}
                             {activeTab === 'history' && <HistoricalPage monthlyData={monthlyData} historicalData={historicalData} projectList={projectList} lastYearProjectList={lastYearProjectList} currentPeriod={currentPeriod} />}
                             {activeTab === 'clients' && <ClientAnalysisPage projectList={projectList} monthlyData={monthlyData} lastYearClientStats={lastYearClientStats} lastYearProjectList={lastYearProjectList} />}
                             {activeTab === 'works' && <WorkAnalysisPage projectList={projectList} monthlyData={monthlyData} worksMaster={worksMaster} releaseSchedule={releaseSchedule} onLoadCsv={identifyAndProcessSafe} currentPeriod={currentPeriod} />}
                             {activeTab === 'jobs' && <JobAnalysisPage projectList={projectList} monthlyData={monthlyData} />}
                             {activeTab === 'division' && <UnifiedDivisionPage divisionMonthlyData={divisionMonthlyData} monthlyData={monthlyData} projectList={projectList} worksMaster={worksMaster} displayMode={displayMode} setDisplayMode={setDisplayMode} divisionOpMode={divisionOpMode} setDivisionOpMode={setDivisionOpMode} divisionMonthlyViewMode={divisionMonthlyViewMode} setDivisionMonthlyViewMode={setDivisionMonthlyViewMode} divisionOpViewMode={divisionOpViewMode} setDivisionOpViewMode={setDivisionOpViewMode} divisionExpenseViewMode={divisionExpenseViewMode} setDivisionExpenseViewMode={setDivisionExpenseViewMode} calculateRankedProjects={calculateRankedProjects} calculateRankedClients={calculateRankedClients} />}
                             {activeTab === 'projects' && <ProjectsPage projectList={projectList} monthlyData={monthlyData} worksMaster={worksMaster} />}
                             {activeTab === 'report' && <div className="space-y-4"><ToggleButton options={[{ value: 'sales', label: '売上レポート' }, { value: 'expense', label: '販管費レポート（経営陣）' }]} value={reportKind} onChange={setReportKind} />{reportKind === 'sales' ? <SummaryReportPage monthlyData={monthlyData} projectList={projectList} lastYearProjectList={lastYearProjectList} worksMaster={worksMaster} divisionMonthlyData={divisionMonthlyData} currentPeriod={currentPeriod} /> : <ExecExpenseReport execPL={execPL} execItems={execItems} execPrev={execPrev} asOf={execAsOf} setAsOf={setExecAsOf} currentPeriod={currentPeriod} />}</div>}
                         </ErrorBoundary>
                    </main>
                    </div>
                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
                            <div className="bg-white p-8 rounded-xl shadow-xl w-full max-w-2xl max-h-[85vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2"><Icon name="Settings"/> 設定</h3>
                                <label className="block text-xs font-bold text-gray-500 mb-1">連携URL（Apps Script ウェブアプリの /exec URL）</label>
                                <input type="text" className="w-full border p-3 rounded mb-4 text-sm" placeholder="https://script.google.com/macros/s/..../exec" value={apiUrl} onChange={(e)=>setApiUrl(e.target.value)} />
                                <div className="border border-red-200 bg-red-50/40 rounded-lg p-4 mb-4">
                                    <h4 className="text-sm font-bold text-gray-700 mb-1">経営陣用データ（販管費予実表・販管費詳細）</h4>
                                    <p className="text-xs text-gray-500 mb-3">「役員会資料」側の Apps Script の URL と、設定した合言葉を入力してください。合言葉はこのパソコンのブラウザにだけ保存されます。</p>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">連携URL（経営陣用）</label>
                                    <input type="text" className="w-full border p-2.5 rounded mb-3 text-sm bg-white" placeholder="https://script.google.com/macros/s/..../exec" value={execUrl} onChange={(e)=>setExecUrl(e.target.value)} />
                                    <label className="block text-xs font-bold text-gray-500 mb-1">合言葉</label>
                                    <input type="password" autoComplete="off" className="w-full border p-2.5 rounded text-sm bg-white" value={execKey} onChange={(e)=>setExecKey(e.target.value)} />
                                    {execStatus && <p className="text-xs text-amber-700 mt-2">{execStatus}</p>}
                                </div>
                                <div className="border-t border-gray-100 pt-4 mb-4">
                                    <div className="flex items-center justify-between mb-2">
                                        <div>
                                            <h4 className="text-sm font-bold text-gray-700">シート構成の診断</h4>
                                            <p className="text-xs text-gray-500">スプレッドシートにどのシートがあるかを調べ、不足しているものを表示します。</p>
                                        </div>
                                        <button onClick={runDiagnostics} disabled={diagBusy} className="flex-shrink-0 px-3 py-1.5 text-xs font-bold text-white bg-gray-700 hover:bg-gray-800 rounded-lg disabled:opacity-40">{diagBusy ? '確認中...' : '診断する'}</button>
                                    </div>
                                    {diagResult && diagResult.error && <p className="text-xs text-red-600 bg-red-50 border border-red-200 rounded p-3">{diagResult.error}</p>}
                                    {diagResult && !diagResult.error && (
                                        <div className="mt-2 space-y-3">
                                            {diagResult.missing.length > 0 ? (
                                                <div className="bg-amber-50 border border-amber-200 rounded p-3">
                                                    <p className="text-xs font-bold text-amber-900 mb-1">見つからないシート（{diagResult.missing.length}件）</p>
                                                    <ul className="text-xs text-amber-800 space-y-0.5">{diagResult.missing.map(m => <li key={m.type}>・{m.sheet}　<span className="text-amber-600">（{SYNC.label(m.type)}用{SYNC.optional(m.type) ? '／無くても主要画面は動きます' : ''}）</span></li>)}</ul>
                                                </div>
                                            ) : <p className="text-xs text-green-700 bg-green-50 border border-green-200 rounded p-3">必要なシートはすべて見つかりました。</p>}
                                            <div>
                                                <p className="text-xs font-bold text-gray-500 mb-1">スプレッドシート内のシート一覧（{diagResult.list.length}件）</p>
                                                <div className="max-h-56 overflow-y-auto border border-gray-200 rounded">
                                                    <table className="w-full text-xs">
                                                        <thead><tr className="bg-gray-50"><th className="px-2 py-1.5 text-left font-semibold text-gray-600">シート名</th><th className="px-2 py-1.5 text-right font-semibold text-gray-600">行</th><th className="px-2 py-1.5 text-right font-semibold text-gray-600">列</th><th className="px-2 py-1.5 text-left font-semibold text-gray-600">1行目の先頭</th></tr></thead>
                                                        <tbody>{diagResult.list.map((sh, i) => (<tr key={i} className="border-t border-gray-100"><td className="px-2 py-1.5 font-medium text-gray-800">{String(sh.name)}</td><td className="px-2 py-1.5 text-right text-gray-500">{sh.rows}</td><td className="px-2 py-1.5 text-right text-gray-500">{sh.cols}</td><td className="px-2 py-1.5 text-gray-500 truncate max-w-xs">{((sh.head && sh.head[0]) || []).slice(0, 5).map(c => String(c === null || c === undefined ? '' : c).replace(/\n/g, ' ')).join(' / ')}</td></tr>))}</tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="flex justify-end gap-3"><button onClick={()=>setShowSettings(false)} className="px-4 py-2 text-gray-500">キャンセル</button><button onClick={saveSettings} className="px-4 py-2 bg-blue-600 text-white rounded font-bold">保存して取得</button></div>
                            </div>
                        </div>
                    )}
                    <AIChatPanel execUrl={execUrl} execKey={execKey} activeTab={activeTab} buildContext={buildChatContext} onOpenSettings={() => setShowSettings(true)} />
                    {isDragging && <div className="fixed inset-0 bg-blue-600/20 backdrop-blur-sm z-50 flex items-center justify-center border-4 border-blue-500 border-dashed m-4 rounded-xl"><div className="bg-white p-8 rounded-xl shadow-xl text-center"><Icon name="Upload" size={48} className="mx-auto text-blue-500 mb-2"/><h3 className="font-bold">Drop CSV</h3></div></div>}
                </div>
            );
        }
        const MISSING_LIBS = [['React', 'React'], ['ReactDOM', 'ReactDOM'], ['Chart', 'Chart.js'], ['Papa', 'PapaParse']].filter(([g]) => typeof window[g] === 'undefined').map(([, n]) => n);
        if (MISSING_LIBS.length > 0) {
            document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#b45309;background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;margin:24px">'
                + '<h2 style="margin:0 0 8px;font-size:16px">外部ライブラリを読み込めませんでした</h2>'
                + '<p style="margin:0 0 8px;font-size:13px">読み込めなかったもの：' + MISSING_LIBS.join('、') + '</p>'
                + '<p style="margin:0;font-size:13px">ネットワーク接続（社内プロキシやオフライン）をご確認のうえ、ページを再読み込みしてください。</p></div>';
        } else {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }
    </script>
</body>
</html>
