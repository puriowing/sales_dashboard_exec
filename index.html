                                                <span className="text-sm text-gray-400 pt-0.5">予算比</span><span><b className={cB}>{MK.pct(r.a, r.b)}</b>　差 <b className={cB}>{MK.manS(r.a - r.b)}</b><span className="text-sm text-gray-400">（予算 {MK.man(r.b)}）</span></span>
                                                <span className="text-sm text-gray-400 pt-0.5">昨対</span>{r.ly == null ? <span className="text-sm text-gray-400">昨年のデータが未連携</span> : <span><b className={cL}>{r.ly > 0 ? MK.pct(r.a, r.ly) : '—'}</b>　差 <b className={cL}>{MK.manS(r.a - r.ly)}</b><span className="text-sm text-gray-400">（昨年 {MK.man(r.ly)}）</span></span>}
                                            </div>
                                            {prog != null && <div className="mt-4">
                                                <div className="flex justify-between text-sm text-gray-500"><span>通期予算の <b className="text-gray-800">{MK.pct(r.a, r.fy)}</b> {r.lowGood ? 'を使用' : 'を達成'}</span><span>予算どおりなら {MK.pct(r.b, r.fy)}</span></div>
                                                <div className="relative h-3 rounded-full bg-gray-200 mt-1.5 overflow-visible">
                                                    <div className="h-3 rounded-full" style={{ width: (prog * 100) + '%', background: okB ? '#00ADE7' : '#E5484D' }}></div>
                                                    <div className="absolute -top-1 h-5 w-0.5 bg-gray-700" style={{ left: (pace * 100) + '%' }} title="予算どおりの位置"></div>
                                                </div>
                                            </div>}
                                            {r.k === '粗利' && O.booked > 0 && <div className="text-sm text-gray-500 mt-3">このほか、{MONTH_LABELS[NOW.n] || ''}以降の分として {MK.man(MK.sum(A.slice(NOW.n)))} を受注・登録済み</div>}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </MkSection>

                    <div className="flex items-center gap-3 text-gray-500"><div className="flex-1 h-px bg-gray-300"></div><span className="text-base font-bold">▼ このままのペースで進むと（年間の見通し）</span><div className="flex-1 h-px bg-gray-300"></div></div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        {[
                            { k: '粗利', ly: lyFY > 0 ? lyFY : null, lyName: '昨期売上シート', land: O.landing, bud: O.budgetFY, diff: gap, good: gap >= 0, pl: '予算を達成できる確率', pv: O.prob, pi: P, range: O.p10 != null ? [O.p10, O.p90] : null },
                            { k: '販管費', ly: lyX, lowGood: true, lyName: '昨期の販管費予実表', land: X.landing, bud: X.budgetFY, diff: xGap, good: xGap <= 0, pl: '予算内に収まる確率', pv: PL.expProb, pi: XPI, note: expClosedL ? `${expClosedL}まで締め済み` : '実績なし' },
                            { k: '営業利益', ly: lyOP, lyName: '昨期の販管費予実表', land: PL.opLanding, bud: PL.opBudget, diff: opGap, good: opGap >= 0, pl: '予算を達成できる確率', pv: PL.opProb, pi: OPI, range: PL.op10 != null ? [PL.op10, PL.op90] : null, main: true }
                        ].map(c => { const t = MK.TONE[c.good ? 'good' : 'bad']; return (
                            <div key={c.k} className={`bg-white rounded-2xl card-shadow p-6 ${c.main ? 'ring-2 ring-blue-300' : ''}`}>
                                <div className="flex items-center justify-between"><div className="text-lg font-bold text-gray-700">{c.k}<span className="text-sm font-normal text-gray-400 ml-2">年間の着地見込</span></div>{c.note && <span className="text-xs text-gray-400">{c.note}</span>}</div>
                                <div className={`text-4xl font-extrabold mt-2 ${t.num}`}>約{MK.man(c.land)}</div>
                                {(() => { const r = NOW.rows.find(x => x.k === c.k); return r && NOW.n > 0 ? <div className="text-sm text-gray-500 mt-1">＝ いまの実績 {MK.man(r.a)} ＋ 残り{12 - NOW.n}か月の見込 {MK.man(c.land - r.a)}</div> : null; })()}
                                <div className="mt-3 grid grid-cols-[3.5rem_1fr] gap-y-1 text-base text-gray-600">
                                    <span className="text-sm text-gray-400 pt-0.5">予算比</span><span><b className={`text-lg ${t.fg}`}>{MK.pct(c.land, c.bud)}</b>　差 <b className={t.fg}>{MK.manS(c.diff)}</b><span className="text-sm text-gray-400">（予算 {MK.man(c.bud)}）</span></span>
                                    <span className="text-sm text-gray-400 pt-0.5">昨対</span>{c.ly == null ? <span className="text-sm text-gray-400">{c.lyName}が未連携のため出せません</span> : (() => { const d = c.land - c.ly, ok = c.lowGood ? d <= 0 : d >= 0, cl = ok ? 'text-sky-700' : 'text-red-700'; return <span><b className={`text-lg ${cl}`}>{c.ly > 0 ? MK.pct(c.land, c.ly) : '—'}</b>　差 <b className={cl}>{MK.manS(d)}</b><span className="text-sm text-gray-400">（昨年 {MK.man(c.ly)}）</span></span>; })()}
                                </div>
                                <div className={`mt-3 rounded-xl px-4 py-3 ${MK.TONE[c.pi.tone].bg}`}><div className="text-sm text-gray-600">{c.pl}</div><div className={`text-2xl font-extrabold ${MK.TONE[c.pi.tone].num}`}>{MK.probText(c.pv)}</div><div className="text-sm text-gray-600">{c.pi.label}</div>{c.range && <div className="text-xs text-gray-500 mt-1">8割の確率で {MK.man(c.range[0])}〜{MK.man(c.range[1])}</div>}</div>
                            </div>
                        ); })}
                    </div>

                    <MkSection title="営業利益の見通し（月ごと）" lead={`営業利益 ＝ 粗利 − 販管費。実線が実績、点線がこのままのペースで進んだ場合の累計です。${E.closed < curIdx && expClosedL ? `販管費は${expClosedL}まで締め済みのため、それ以降の月は販管費を見込で計算しています。` : ''}`}>
                        {view === 'chart' ? <div className="h-96"><ChartComponent type="line" data={opChart} options={{ plugins: { legend: { labels: { font: { size: 13 } } } }, scales: { y: { ticks: mkTicksMan } } }} /></div> : (() => {
                            let co = 0, cb = 0;
                            const yc = (i) => lyOPm ? [MK.man(lyOPm[i]), <span className={PL.opProj[i] - lyOPm[i] >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(PL.opProj[i] - lyOPm[i])}</span>] : [];
                            return <MkTable head={['月', '', '粗利', '販管費', '営業利益', '営業利益の予算', '予算との差'].concat(lyOPm ? ['昨年の営業利益', '昨年との差'] : []).concat(['累計の営業利益', '累計の予算'])} align={['l', 'l', 'r', 'r', 'r', 'r', 'r', 'r', 'r', 'r', 'r']}
                                rows={MONTH_LABELS.map((l, i) => { const op = PL.opProj[i], ob = PL.opB[i]; co += op; cb += ob; const st = i < actN ? '実績' : (i < curIdx ? '一部見込' : '見込'); return { cls: i === actN ? 'border-t-2 border-orange-300' : '', cells: [l, <span className={`text-xs px-2 py-0.5 rounded ${st === '実績' ? 'bg-gray-100 text-gray-600' : 'bg-orange-100 text-orange-700'}`}>{st}</span>, MK.man(O.proj[i]), MK.man(X.proj[i]), <b className={op < 0 ? 'text-red-600' : ''}>{MK.man(op)}</b>, MK.man(ob), <span className={op - ob >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(op - ob)}</span>, ...yc(i), MK.man(co), MK.man(cb)] }; }).concat([{ cls: 'bg-gray-50 font-bold', cells: ['通期', '', MK.man(O.landing), MK.man(X.landing), MK.man(PL.opLanding), MK.man(PL.opBudget), <span className={opGap >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(opGap)}</span>, ...(lyOPm ? [MK.man(lyOP), <span className={PL.opLanding - lyOP >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(PL.opLanding - lyOP)}</span>] : []), '', ''] }])} />;
                        })()}
                    </MkSection>

                    <h3 className="text-xl font-bold text-gray-700 pt-2">粗利の詳しい見通し</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                        <MkBig label="年間の着地見込（このままのペース）" value={'約' + MK.man(O.landing)} tone={MK.toneOfRatio(O.landing, O.budgetFY)} sub={<>通期予算 {MK.man(O.budgetFY)}　差 <b>{MK.manS(gap)}</b>{lyFY > 0 && <><br />昨年 {MK.man(lyFY)}　昨対 <b>{MK.pct(O.landing, lyFY)}</b>（{MK.manS(O.landing - lyFY)}）</>}</>} />
                        <MkBig label="予算を達成できる確率" value={MK.probText(O.prob)} tone={P.tone} sub={<>{P.label}{O.p10 != null && <><br />8割の確率で {MK.man(O.p10)}〜{MK.man(O.p90)} に着地</>}</>} />
                        <MkBig label="いまの進捗（通期予算に対して）" value={MK.pct(progress, O.budgetFY)} tone={progress >= budToNow ? 'good' : 'warn'} sub={<>今月までの粗利 {MK.man(progress)}<br />予算どおりなら今月末で {MK.pct(budToNow, O.budgetFY)}{lyFY > 0 && <>／昨年は同じ時期に {MK.pct(lyToNow, lyFY)}</>}</>} />
                        <MkBig label={`残り${O.remN}か月に必要なペース`} value={O.needRatio != null ? `予算の${Math.round(O.needRatio * 100)}%` : '—'} tone={O.needRatio == null ? 'gray' : O.rbar != null && O.rbar >= O.needRatio ? 'good' : 'warn'} sub={<>これまでの平均は予算の{O.rbar != null ? Math.round(O.rbar * 100) + '%' : '—'}{O.booked > 0 && <><br />今月以降の分として {MK.man(O.booked)} を受注済み</>}</>} />
                    </div>

                    <MkSection title="粗利の積み上がり（累計）" lead="オレンジの実線がこれまでの実績、点線がこのままのペースで進んだ場合です。グレーの点線（予算）を上回っていれば順調です。">
                        {view === 'chart' ? <div className="h-96"><ChartComponent type="line" data={chart} options={{ plugins: { legend: { labels: { font: { size: 13 } } } }, scales: { y: { ticks: mkTicksMan } } }} /></div> : (() => {
                            let cp = 0, cb = 0, cl = 0;
                            return <MkTable head={['月', '予算', '実績・見込', '', '昨年', '累計（実績＋見込）', '累計予算', '累計の差']} align={['l', 'r', 'r', 'l', 'r', 'r', 'r', 'r']}
                                rows={MONTH_LABELS.map((l, i) => { cp += O.proj[i]; cb += B[i]; cl += L[i]; return { cls: i === curIdx ? 'bg-orange-50' : '', cells: [l, MK.man(B[i]), <b>{MK.man(O.proj[i])}</b>, <span className={`text-xs px-2 py-0.5 rounded ${i < curIdx ? 'bg-gray-100 text-gray-600' : 'bg-orange-100 text-orange-700'}`}>{i < curIdx ? '実績' : i === curIdx ? '今月（見込）' : '見込'}</span>, MK.man(L[i]), MK.man(cp), MK.man(cb), <span className={cp - cb >= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(cp - cb)}</span>] }; })} />;
                        })()}
                    </MkSection>

                    <MkSection title="事業部ごとの見通し" lead={`同じ計算を事業部ごとに行っています。${view === 'chart' ? `グラフは「${DM[divMetric].l}の年間の着地見込 − 予算」です。` : ''}`}
                        right={view === 'chart' && <ToggleButton options={[{ value: 'p', label: '粗利' }, { value: 'x', label: '販管費' }, { value: 'o', label: '営業利益' }]} value={divMetric} onChange={setDivMetric} />}>
                        {view === 'chart' ? <MkDiffChart rows={divDiff} goodPositive={!DM[divMetric].low} /> : (
                            <MkTable head={['事業部', '', 'いまの実績', '年間の着地見込', '通期予算', '予算との差', '予算比', '確率']} align={['l', 'l', 'r', 'r', 'r', 'r', 'r', 'r']}
                                rows={divPL.flatMap(d => ['p', 'x', 'o'].map((k, ix) => { const v = d[k], diff = v.land - v.bud, ok = DM[k].low ? diff <= 0 : diff >= 0; return { cls: ix === 0 ? 'border-t-2 border-gray-300' : '', cells: [ix === 0 ? <b>{d.div}</b> : '', <span className={k === 'o' ? 'font-bold' : ''}>{DM[k].l}</span>, MK.man(v.ytd), <b>{MK.man(v.land)}</b>, MK.man(v.bud), <b className={ok ? 'text-sky-600' : 'text-red-600'}>{MK.manS(diff)}</b>, v.land < 0 ? '—' : MK.pct(v.land, v.bud), v.prob == null ? '—' : <span className={(MK.TONE[k === 'x' ? (v.prob >= 0.5 ? 'good' : v.prob >= 0.2 ? 'warn' : 'bad') : MK.probInfo(v.prob).tone]).num + ' font-bold'}>{MK.probText(v.prob)}{k === 'x' ? '（予算内）' : ''}</span>] }; }))} />
                        )}
                        {view === 'chart' && <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3">{divPL.map(d => { const o = d.o, t = MK.TONE[o.prob != null ? MK.probInfo(o.prob).tone : (o.land >= o.bud ? 'good' : 'bad')]; return (
                            <div key={d.div} className={`rounded-xl border ${t.bd} ${t.bg} p-4`}>
                                <div className="text-base font-bold text-gray-700">{d.div}</div>
                                <table className="w-full text-sm mt-2"><thead><tr className="text-gray-400"><th className="text-left font-normal"></th><th className="text-right font-normal">着地見込</th><th className="text-right font-normal">予算との差</th></tr></thead>
                                    <tbody>{['p', 'x', 'o'].map(k => { const v = d[k], diff = v.land - v.bud, ok = DM[k].low ? diff <= 0 : diff >= 0; return <tr key={k} className={k === 'o' ? 'font-bold border-t border-gray-300' : ''}><td className="py-1 text-gray-700">{DM[k].l}</td><td className="py-1 text-right">{MK.man(v.land)}</td><td className={`py-1 text-right ${ok ? 'text-sky-700' : 'text-red-700'}`}>{MK.manS(diff)}</td></tr>; })}</tbody></table>
                                <div className="text-sm mt-2 text-gray-600">営業利益の予算達成の確率 <b className={`text-lg ${t.num}`}>{MK.probText(o.prob)}</b></div>
                                {!d.hasExp && <div className="text-xs text-amber-700 mt-1">この事業部の販管費データがありません</div>}
                            </div>
                        ); })}</div>}
                        <p className="text-sm text-gray-500 mt-3">事業部の販管費は「予算実績リスト」の事業部別の実績、予算は「予算（読込用）」の事業部別の販管費予算です。全社共通の費用は事業部に含まれないため、3事業部の合計は全社の数字と一致しません。</p>
                    </MkSection>

                    <MkMore title="見込と確率の計算方法">
                        <ul className="text-base text-gray-600 list-disc ml-5 space-y-1">
                            <li>「このままのペース」＝ 締めた月（{lastClosed || '—'}まで）の実績 ＋ 今月以降の各月の予算 × これまでの予算達成率（{O.rbar != null ? Math.round(O.rbar * 100) + '%' : '—'}）。すでに受注済みの金額のほうが大きい月は、受注済みの金額を使います。</li>
                            <li>「達成できる確率」＝ これまでの月ごとの予算達成率（{O.ratios.map(r => Math.round(r * 100) + '%').join('・') || '—'}）が、残りの月にもランダムに起こると仮定して4,000回試算し、予算に届いた割合です。締めた月が3か月未満のときは出しません。</li>
                            <li>販管費の見込 ＝ 締めた月（{expClosedL || '—'}まで）の実績 ＋ 残りの月の予算 × これまでの予算に対する使用率（{X.rbar != null ? Math.round(X.rbar * 100) + '%' : '—'}）。予備費・バッファは今後使わない前提で見込から外しています（予算には含みます）。データ元：{E.src}。</li>
                            <li>昨対は「今期の年間着地見込 ÷ 昨期の通期実績」です。昨期の販管費・営業利益は、昨期の販管費予実表（経営陣用）が連携されているときだけ出します。事業部ごとの昨対は、昨期の売上シートに事業部の列がないため出せません。</li>
                            <li>営業利益 ＝ 粗利 − 販管費。確率は、粗利と販管費をそれぞれ4,000回試算した結果を組み合わせて出しています。</li>
                            <li>あくまで過去のペースからの目安です。大型案件の受注や失注、臨時の支出の予定は入っていません。作品ごとの積み上げで見る場合は「詳しく見る → 見込」をご覧ください。</li>
                        </ul>
                    </MkMore>
                    <MkNext id="mk_outlook" onGo={onGo} />
                </div>
            );
        }

        // まだ登録されていないが、これから粗利が見込める案件（公開予定の得意先作品・定期案件）
        MK.opps = ({ projectList, lastYearProjectList, historicalData, allWorks, worksMaster, minProfit }) => {
            const S = MK.sum, today = MK.day0(new Date()), t0 = today.getTime(), DAY = 86400000;
            const workMap = {}; (allWorks || []).forEach(w => { if (w.id) workMap[w.id] = w; });
            const past = [].concat(projectList || [], lastYearProjectList || []);
            Object.values(historicalData || {}).forEach(h => { if (h && h.projects) past.push(...h.projects); });
            const life = {}, distDivs = {};
            const dk = (v) => String(v || '').normalize('NFKC').replace(/株式会社|\(株\)|\s/g, '');
            past.forEach(p => {
                const id = String(p.managerId || '').trim(); if (!id) return;
                (life[id] = life[id] || { profit: 0, n: 0 }).profit += p.profit || 0; life[id].n++;
                const w = workMap[id], dv = MK.divOf(p);
                if (w && w.distributor && dv !== 'その他') { const k = dk(w.distributor); (distDivs[k] = distDivs[k] || {})[dv] = (distDivs[k][dv] || 0) + (p.sales || 0); }
            });
            const dist = {};
            Object.entries(life).forEach(([id, v]) => { const w = workMap[id]; if (!w || !w.distributor) return; const k = dk(w.distributor); (dist[k] = dist[k] || []).push(v.profit); });
            const med = (a) => { const x = a.slice().sort((p, q) => p - q), n = x.length; return n ? (n % 2 ? x[(n - 1) / 2] : (x[n / 2 - 1] + x[n / 2]) / 2) : 0; };
            const divOfDist = (d) => { const m = distDivs[dk(d)]; if (m) return Object.entries(m).sort((a, b) => b[1] - a[1])[0][0]; const s = String(d || ''); return s.includes('東宝東和') || s.includes('東和ピクチャーズ') ? '第2' : s.includes('東宝') ? '第1' : '第3'; };
            const nn = (v) => String(v || '').normalize('NFKC').toLowerCase().replace(/[\s　・:：\-‐－ー～〜!！?？「」『』【】()（）\[\]"'“”]/g, '');
            const regNames = [];
            past.forEach(p => { const id = String(p.managerId || '').trim(); [workMap[id] && workMap[id].name, worksMaster && worksMaster[id], p.title].forEach(v => { const k = nn(v); if (k) regNames.push(k); }); });
            const groups = {};
            (allWorks || []).forEach(w => {
                const k = nn(w.name); if (!k) return;
                const g = groups[k] || (groups[k] = { name: w.name, ids: [], distributor: w.distributor, releaseDate: w.releaseDate, planProfit: 0 });
                g.ids.push(w.id);
                g.planProfit = Math.max(g.planProfit, w.planProfit || 0);
                if (!g.distributor && w.distributor) g.distributor = w.distributor;
                if (String(w.releaseDate || '') > String(g.releaseDate || '')) g.releaseDate = w.releaseDate;
            });
            const works = [];
            Object.entries(groups).forEach(([k, g]) => {
                const rel = Utils.parseDate(g.releaseDate), t = rel.getTime();
                if (rel.getFullYear() < 2000 || t < t0 - 14 * DAY || t > t0 + 183 * DAY) return;
                const regById = g.ids.some(id => life[id]);
                const reg = S(g.ids.map(id => life[id] ? life[id].profit : 0));
                const registered = regById || (k.length >= 3 && regNames.some(r => r.includes(k)));
                const plan = g.planProfit, hist = dist[dk(g.distributor)] || [];
                let exp = 0, kind = null, basis = '';
                if (plan > 0 && plan - reg >= minProfit) { exp = plan - reg; kind = 'plan'; basis = reg > 0 ? `案件管理DBの見込 ${MK.man(plan)} のうち未登録分（登録済み ${MK.man(reg)}）` : `案件管理DBの見込 ${MK.man(plan)}（案件は未登録）`; }
                else if (!registered && hist.length >= 2) { exp = med(hist); kind = 'client'; basis = `この配給会社の作品は過去${hist.length}本を担当。1本あたりの粗利（中央値）${MK.man(exp)}`; }
                if (!kind || exp < minProfit) return;
                works.push({ key: 'w:' + k, kind, name: g.name, who: g.distributor || '—', when: g.releaseDate, whenLabel: `公開 ${String(g.releaseDate).slice(5)}`, days: Math.ceil((t - t0) / DAY), exp, basis, div: divOfDist(g.distributor) });
            });
            const norm = (v) => String(v || '').normalize('NFKC').replace(/[0-9]+/g, '').replace(/年度|年|月分|月|期|分|[()（）\[\]【】「」『』_\-ー－・\/\s.,、:：#＃]/g, '');
            const curMK = today.getFullYear() * 12 + today.getMonth();
            const series = {};
            past.forEach(p => {
                const mk = FC.monthKey(p.date); if (mk == null) return;
                const id = String(p.managerId || '').trim(), isWork = !!(id && workMap[id]);
                const k = MK.cname(p.client) + '|' + norm(p.title) + (isWork ? '|' + id : '');
                const o = series[k] || (series[k] = { client: p.client || '不明', title: p.title, div: MK.divOf(p), isWork, months: {} });
                o.months[mk] = (o.months[mk] || 0) + (p.profit || 0);
                if (mk >= curMK - 12) { o.title = p.title; o.div = MK.divOf(p); }
            });
            const ML = (m) => MONTH_LABELS[((m % 12) - 2 + 12) % 12];
            const rec = [];
            Object.entries(series).forEach(([k, o]) => {
                const recent = Object.keys(o.months).map(Number).filter(m => m >= curMK - 6 && m < curMK && o.months[m] > 0);
                if (recent.length >= 4) {
                    const avg = S(recent.map(m => o.months[m])) / recent.length;
                    const miss = [curMK, curMK + 1].filter(m => !o.months[m]);
                    if (miss.length && avg * miss.length >= minProfit) rec.push({ key: 'm:' + k, kind: 'monthly', name: String(o.title || '').normalize('NFKC').replace(/[(（\[【]?\s*\d{1,2}\s*月\s*分?\s*[)）\]】]?/g, '').trim() || o.title, who: o.client, when: miss[0], whenLabel: miss.map(ML).join('・') + '分', exp: avg * miss.length, basis: `直近6か月のうち${recent.length}か月で計上。月平均 ${MK.man(avg)}`, div: o.div });
                    return;
                }
            });
            works.sort((a, b) => b.exp - a.exp); rec.sort((a, b) => b.exp - a.exp);
            return { works, rec };
        };
        MK.OPP = { plan: { l: 'DB見込あり', c: '#0EA5E9', cls: 'bg-sky-50 text-sky-700' }, client: { l: '得意先の作品', c: '#6366F1', cls: 'bg-indigo-50 text-indigo-700' }, monthly: { l: '毎月の定期案件', c: '#10B981', cls: 'bg-emerald-50 text-emerald-700' } };

        // 事業部長の週次の業務レポート（Googleドキュメントから自動取り込み）
        const RPT = {
            DIVS: ['第1事業部', '第2事業部', '第3事業部', 'IP事業推進部', '営業開発部'],
            short: (d) => ({ '第1事業部': '第1', '第2事業部': '第2', '第3事業部': '第3', 'IP事業推進部': 'IP', '営業開発部': '営業開発' }[d] || d),
            dateLabel: (s) => { const d = SNAP.parse(s); return d ? `${d.getMonth() + 1}/${d.getDate()}` : '—'; },
            fresh: (s) => { const d = SNAP.parse(s); return !!d && (MK.day0(new Date()) - d) / 86400000 <= 7; },
            text: (it) => (it.r || []).map(x => x.t).join(''),
            hasBlue: (it) => (it.r || []).some(x => x.k === 'blue' && x.t.trim().length >= 2)
        };

        const RPT_TONE = { 'ポジ': { cls: 'bg-sky-100 text-sky-800', bar: 'border-sky-400' }, 'ネガ': { cls: 'bg-red-100 text-red-700', bar: 'border-red-400' }, 'フラット': { cls: 'bg-gray-100 text-gray-600', bar: 'border-gray-300' } };

        function MkReportCard({ r, months, monthLabel, showAll }) {
            const S0 = r.summary && typeof r.summary === 'object' ? r.summary : null, fresh = RPT.fresh(r.date), found = !!(r.found || (Array.isArray(r.items) && r.items.length > 0));
            const S = S0 ? { headline: String(S0.headline || ''), points: Array.isArray(S0.points) ? S0.points.filter(p => p && typeof p === 'object') : [], decisions: Array.isArray(S0.decisions) ? S0.decisions.map(String) : [] } : null;
            const pts = S ? S.points.filter(p => showAll || (Array.isArray(p.months) && p.months.some(m => months.includes(Number(m))))) : [];
            const noMonth = S ? S.points.filter(p => !Array.isArray(p.months) || !p.months.length).length : 0;
            return (
                <div className="bg-white rounded-2xl border border-gray-200 p-5 flex flex-col">
                    <div className="flex items-start justify-between gap-3">
                        <div className="text-lg font-extrabold text-gray-800">{r.div}</div>
                        <span className={`text-xs font-bold px-2 py-1 rounded shrink-0 ${!r.date ? 'bg-gray-100 text-gray-400' : fresh ? 'bg-sky-100 text-sky-700' : 'bg-amber-100 text-amber-800'}`}>{r.date ? `${RPT.dateLabel(r.date)}時点${fresh ? '' : '（1週間以上前）'}` : '報告なし'}</span>
                    </div>
                    {!found ? <p className="mt-3 text-sm text-gray-400 flex-1">報告が見つかりません</p> : S ? (
                        <div className="mt-3 flex-1">
                            <p className="text-lg font-bold text-gray-800 leading-snug">{S.headline}</p>
                            {pts.length === 0 ? <p className="mt-3 text-sm text-gray-400">{showAll ? '売上に関する今週の動きはありません' : `${monthLabel}の売上に関する報告はありません`}{!showAll && S.points.length > 0 ? `（ほかの月の話題が${S.points.length}件）` : ''}</p> : (
                                <ul className="mt-3 space-y-2.5">
                                    {pts.map((p, i) => { const t = RPT_TONE[p.tone] || RPT_TONE['フラット']; return (
                                        <li key={i} className={`border-l-4 ${t.bar} pl-3`}>
                                            <div className="flex flex-wrap items-center gap-2">
                                                <span className={`text-xs font-bold px-1.5 py-0.5 rounded ${t.cls}`}>{p.tone}</span>
                                                <b className="text-base text-gray-800">{p.title}</b>
                                                {p.amount && <span className="text-sm font-bold text-gray-700 bg-gray-50 border border-gray-200 rounded px-1.5">{p.amount}</span>}
                                                {p.isNew && <span className="text-[10px] font-bold text-blue-700">今週の更新</span>}
                                                {Array.isArray(p.months) && p.months.length > 0 && <span className="text-[11px] text-gray-400">{p.months.map(m => m + '月').join('・')}</span>}
                                            </div>
                                            <p className="text-base text-gray-600 leading-relaxed mt-0.5">{p.text}</p>
                                        </li>
                                    ); })}
                                </ul>
                            )}
                            {S.decisions.length > 0 && (
                                <div className="mt-4 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3">
                                    <div className="text-sm font-bold text-amber-800">売上に関する経営陣への相談・判断のお願い</div>
                                    <ul className="mt-1 space-y-1">{S.decisions.map((d, i) => <li key={i} className="text-base text-gray-800">・{d}</li>)}</ul>
                                </div>
                            )}
                        </div>
                    ) : <p className="mt-3 text-sm text-amber-700 flex-1">要約を作れませんでした。{r.summaryError ? `（${r.summaryError}）` : ''}ドキュメントで直接ご確認ください。</p>}
                    {r.url && <div className="mt-4 pt-3 border-t border-gray-100 text-right"><a href={r.url} target="_blank" rel="noopener" className="text-sm font-bold text-[#0093C4] hover:underline">報告の原文をドキュメントで開く ↗</a></div>}
                </div>
            );
        }

        function MkReports({ reports, status, month, scope }) {
            const [showAll, setShowAll] = useState(false);
            const list = RPT.DIVS.map(d => (Array.isArray(reports) ? reports : []).find(r => r && r.div === d) || { div: d, date: '' });
            const freshN = list.filter(x => RPT.fresh(x.date)).length;
            const decN = list.reduce((n, r) => n + (r.summary && Array.isArray(r.summary.decisions) ? r.summary.decisions.length : 0), 0);
            const idxs = scope === 'ytd' ? Array.from({ length: (month || 0) + 1 }, (_, i) => i) : [month || 0];
            const months = idxs.map(i => (i + 2) % 12 + 1);
            const monthLabel = scope === 'ytd' && month > 0 ? `3月〜${MONTH_LABELS[month]}` : MONTH_LABELS[month || 0];
            return (
                <MkSection title={`事業部長の報告（${showAll ? 'すべての月' : monthLabel}の売上に関すること）`} lead={`各部署の週次の業務レポートから、売上・粗利に関することだけをAI（Gemini）で要約し、上で選んだ月の売上に関わる話題を表示しています。${reports ? `${freshN}/${RPT.DIVS.length}部署がこの1週間に更新。` : ''}${decN ? `売上に関する相談が${decN}件あります。` : ''}`}
                    right={<ToggleButton options={[{ value: false, label: `${monthLabel}の話題` }, { value: true, label: 'すべての月' }]} value={showAll} onChange={setShowAll} />}>
                    {status && <p className="text-sm text-amber-700 mb-3">{status}</p>}

                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">{list.map(r => <MkReportCard key={r.div} r={r} months={months} monthLabel={monthLabel} showAll={showAll} />)}</div>
                    )}
                    <p className="text-xs text-gray-400 mt-3">要約はAIによるものです。月の振り分けは報告に書かれた請求月・四半期・公開月からAIが判断しています。研修・人事・社内の取り組みなど売上以外の話題は載せていません。正確な内容は原文でご確認ください。</p>
                </MkSection>
            );
        }

        function MkRateChart({ rows }) {
            const data = useMemo(() => ({ labels: rows.map(r => MK.short(r.label, 22)), datasets: [{ label: '粗利率', data: rows.map(r => Math.round(r.rate * 1000) / 10), backgroundColor: rows.map(r => r.color), borderRadius: 4, barThickness: 20 }] }), [rows]);
            const options = useMemo(() => ({ indexAxis: 'y', layout: { padding: { left: 10, right: 10 } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `粗利率 ${c.raw}%` } }, datalabels: { ...MK_DL, display: true, anchor: c => c.dataset.data[c.dataIndex] >= 0 ? 'end' : 'start', align: c => c.dataset.data[c.dataIndex] >= 0 ? 'end' : 'start', formatter: v => v + '%' } }, scales: { x: { grace: '15%', min: Math.min(0, ...rows.map(r => Math.round(r.rate * 100))) < 0 ? Math.floor(Math.min(...rows.map(r => r.rate * 100)) / 10) * 10 - 20 : 0, ticks: { callback: v => v + '%', font: { size: 12 } }, grid: { color: c => c.tick && c.tick.value === 0 ? '#64748b' : '#f1f5f9' } }, y: { ticks: { font: { size: 13 } }, grid: { display: false } } } }), [rows]);
            return <div style={{ height: rows.length * 40 + 50 }}><ChartComponent type="bar" data={data} options={options} /></div>;
        }

        function MkPairBars({ labels, sets }) {
            const data = useMemo(() => ({ labels, datasets: sets.map(d => ({ label: d.label, data: d.data, backgroundColor: d.color, borderRadius: 4, barThickness: 22, datalabels: { ...MK_DL, display: true, anchor: 'end', align: 'end', formatter: v => MK.man(v) } })) }), [labels, sets]);
            const options = useMemo(() => ({ indexAxis: 'y', layout: { padding: { right: 20 } }, plugins: { legend: { position: 'top', labels: { font: { size: 13 } } }, tooltip: { callbacks: { label: c => `${c.dataset.label} ${MK.man(c.raw)}` } } }, scales: { x: { grace: '18%', ticks: mkTicksMan }, y: { ticks: { font: { size: 14 } }, grid: { display: false } } } }), []);
            return <div style={{ height: labels.length * sets.length * 30 + 90 }}><ChartComponent type="bar" data={data} options={options} /></div>;
        }

        // ③ 注目の作品・案件
        function MkWorksPage({ projectList, lastYearProjectList, historicalData, allWorks, worksMaster, view, setView, baseDays, setBaseDays, onGo }) {
            const [th, setTh] = useState(1000000);
            const [order, setOrder] = useState('week');
            const [allCards, setAllCards] = useState(false);
            const baseD = MK.baseDate(baseDays), baseT = baseD.getTime(), baseL = MK.md(baseD);
            const W = useMemo(() => {
                const all = projectList || [];
                const fresh = all.filter(p => MK.isFresh(p, baseT));
                const big = fresh.filter(p => (p.profit || 0) >= th).sort((a, b) => b.profit - a.profit);
                const freshTop = fresh.slice().sort((a, b) => b.profit - a.profit).slice(0, 3);
                const works = MK.group(all, worksMaster).map(g => ({ ...g, week: MK.sum(g.items.filter(p => MK.isFresh(p, baseT)).map(p => p.profit)) }));
                const total = MK.sum(all.map(p => p.profit));
                const isDeptCost = (p) => [p.job, p.title, p.client, MK.workName(p, worksMaster)].some(v => String(v || '').normalize('NFKC').replace(/\s/g, '').includes('部門原価'));
                const reasonOf = (p) => { if (isDeptCost(p)) return null; const s = p.sales || 0, pr = p.profit || 0, r = s > 0 ? pr / s : null; if (pr < 0) return 'minus'; if (s >= 1000000 && r < 0.1) return 'low'; if (Utils.getJobCategory(p.job) === '広告' && s > 0 && r >= 0.4) return 'adhigh'; return null; };
                const ORDER = { minus: 0, low: 1, adhigh: 2 };
                const risky = all.map(p => ({ ...p, reason: reasonOf(p) })).filter(p => p.reason).sort((a, b) => ORDER[a.reason] - ORDER[b.reason] || (a.reason === 'adhigh' ? b.profit / b.sales - a.profit / a.sales : a.profit / Math.max(1, a.sales) - b.profit / Math.max(1, b.sales)));
                return { fresh, big, freshTop, works, total, risky };
            }, [projectList, worksMaster, baseT, th]);
            const [oppTh, setOppTh] = useState(300000);
            const [oppTab, setOppTab] = useState('works');
            const [oppAll, setOppAll] = useState(false);
            const OP = useMemo(() => MK.opps({ projectList, lastYearProjectList, historicalData, allWorks, worksMaster, minProfit: oppTh }), [projectList, lastYearProjectList, historicalData, allWorks, worksMaster, oppTh]);
            const oppList = oppTab === 'works' ? OP.works : OP.rec;
            const oppShown = oppAll ? oppList : oppList.slice(0, 10);
            const oppSets = useMemo(() => [{ label: '', data: oppShown.map(o => o.exp), color: oppShown.map(o => MK.OPP[o.kind].c) }], [oppShown]);
            const ranked = useMemo(() => W.works.filter(w => order === 'week' ? w.week > 0 : true).sort((a, b) => order === 'week' ? b.week - a.week : b.profit - a.profit).slice(0, 10), [W, order]);
            const sets = useMemo(() => [{ label: `${baseL}まで`, data: ranked.map(w => w.profit - w.week), color: '#cbd5e1' }, { label: `${baseL}より後の増加`, data: ranked.map(w => w.week), color: '#f97316' }], [ranked, baseL]);
            const cards = W.big.length ? W.big : W.freshTop;
            const lines = [
                W.big.length ? <span>{baseL}より後に、粗利 <b>{MK.man(th)}以上</b> の案件が <b>{W.big.length}件</b> 登録されました（合計 {MK.man(MK.sum(W.big.map(p => p.profit)))}）。</span> : <span>{baseL}より後に、粗利 {MK.man(th)}以上の案件の登録はありません。</span>,
                W.big[0] && <span>最大は「{MK.workName(W.big[0], worksMaster)}」の {MK.short(W.big[0].title, 24)}（粗利 <b>{MK.man(W.big[0].profit)}</b>）です。</span>,
                (OP.works.length + OP.rec.length) > 0 && <span>まだ登録されていないが粗利が見込める案件が <b>{OP.works.length + OP.rec.length}件</b>（見込粗利 合計 約{MK.man(MK.sum(OP.works.map(o => o.exp)) + MK.sum(OP.rec.map(o => o.exp)))}）あります。</span>,
                W.risky.length > 0 && <span className="text-lg text-gray-700">粗利率の確認が必要な案件が {W.risky.length}件あります（粗利マイナス・粗利率10%未満・広告で粗利率40%以上。下の補足を参照）。</span>
            ];
            return (
                <div className="space-y-6">
                    <MkHead id="mk_works" view={view} setView={setView} right={<>
                        <MkBaseSelect baseDays={baseDays} setBaseDays={setBaseDays} />
                        <label className="flex items-center gap-2 text-sm text-gray-600 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">大きな案件の基準
                            <select value={th} onChange={e => setTh(Number(e.target.value))} className="bg-white border border-gray-300 rounded px-2 py-1 text-sm font-bold text-gray-800">{[500000, 1000000, 3000000, 5000000].map(v => <option key={v} value={v}>粗利 {MK.man(v)}以上</option>)}</select>
                        </label></>} />
                    <MkVerdict tone={W.big.length ? 'good' : 'gray'} lines={lines} />

                    <MkSection title={`${baseL}より後に登録された大きな案件`} lead={W.big.length ? `粗利 ${MK.man(th)}以上の案件を、粗利の大きい順に並べています。` : '基準を超える案件がないため、期間内の上位3件を表示しています。'}>
                        {cards.length === 0 ? <MkEmpty>期間内に登録された案件はありません</MkEmpty> : view === 'table' ? (
                            <MkTable head={['作品', '案件名', 'クライアント', '事業部', '請求日', '登録日', '売上', '粗利', '粗利率']} align={['l', 'l', 'l', 'l', 'l', 'l', 'r', 'r', 'r']}
                                rows={cards.map(p => ({ cells: [<b>{MK.workName(p, worksMaster)}</b>, MK.short(p.title, 22), p.client || '—', MK.divOf(p) === 'その他' ? '事業部なし' : MK.divOf(p), String(p.date || '').substring(0, 10), String(p.regDate || '').substring(0, 10), MK.man(p.sales), <b className="text-orange-600">{MK.man(p.profit)}</b>, MK.pct(p.profit, p.sales)] }))} />
                        ) : (<>
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                {(allCards ? cards : cards.slice(0, 6)).map((p, i) => (
                                    <div key={i} className={`rounded-2xl border-2 p-5 ${W.big.length ? 'border-orange-300 bg-orange-50/60' : 'border-gray-200 bg-gray-50'}`}>
                                        <div className="flex items-start justify-between gap-2">
                                            <div className="text-lg font-bold text-gray-800 leading-snug">{MK.workName(p, worksMaster)}</div>
                                            <span className="text-xs font-bold px-2 py-1 rounded text-white shrink-0" style={{ background: MK.DIV_COLOR[MK.divOf(p)] }}>{MK.divOf(p) === 'その他' ? '事業部なし' : MK.divOf(p)}</span>
                                        </div>
                                        <div className="text-sm text-gray-600 mt-1">{p.title}</div>
                                        <div className="text-sm text-gray-500 mt-1">{p.client || '—'}　／　請求 {String(p.date || '').substring(0, 10) || '—'}　／　登録 {String(p.regDate || '').substring(0, 10)}</div>
                                        <div className="mt-4 flex items-end justify-between">
                                            <div><div className="text-xs text-gray-500">粗利</div><div className="text-3xl font-extrabold text-orange-600">{MK.man(p.profit)}</div></div>
                                            <div className="text-right text-sm text-gray-600">売上 {MK.man(p.sales)}<br />粗利率 {MK.pct(p.profit, p.sales)}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {cards.length > 6 && <div className="mt-4 text-center"><button onClick={() => setAllCards(!allCards)} className="px-5 py-2.5 rounded-xl border border-gray-300 bg-white text-base font-bold text-gray-700 hover:bg-gray-50">{allCards ? '上位6件だけ表示する' : `残り${cards.length - 6}件も表示する`}</button></div>}
                        </>)}
                    </MkSection>

                    <MkSection title="作品ごとの粗利（今期）" lead={order === 'week' ? `${baseL}より後に粗利が増えた作品を、増えた額の大きい順に10作品。オレンジが増えた分です。` : '今期の粗利が大きい順に10作品。オレンジが今回増えた分です。'}
                        right={<ToggleButton options={[{ value: 'week', label: '増えた額の順' }, { value: 'total', label: '今期の合計順' }]} value={order} onChange={setOrder} />}>
                        {ranked.length === 0 ? <MkEmpty>該当する作品はありません</MkEmpty> : view === 'chart' ? <MkHBars labels={ranked.map(w => w.name)} sets={sets} /> : (
                            <MkTable head={['順位', '作品', '事業部', '主なクライアント', '今期の粗利', `うち${baseL}より後`, '全社に占める割合', '件数']} align={['l', 'l', 'l', 'l', 'r', 'r', 'r', 'r']}
                                rows={ranked.map((w, i) => ({ cells: [i + 1, <b>{w.name}</b>, w.div === 'その他' ? '事業部なし' : w.div, w.client, <b>{MK.man(w.profit)}</b>, <span className={w.week > 0 ? 'text-orange-600 font-bold' : 'text-gray-400'}>{w.week ? '+' + MK.man(w.week) : '—'}</span>, MK.pct(w.profit, W.total), w.count + '件'] }))} />
                        )}
                    </MkSection>

                    <MkSection title="これから粗利が見込める、まだ登録されていない案件" lead="案件管理DBの公開予定作品（今後6か月）と、毎月の定期案件から、まだ売上シートに登録がないものを出しています。見込粗利は過去の実績からの目安です。"
                        right={<div className="flex flex-wrap items-center gap-2"><ToggleButton options={[{ value: 'works', label: `公開予定の作品（${OP.works.length}）` }, { value: 'rec', label: `毎月の定期案件（${OP.rec.length}）` }]} value={oppTab} onChange={(v) => { setOppTab(v); setOppAll(false); }} />
                            <select value={oppTh} onChange={e => setOppTh(Number(e.target.value))} className="border border-gray-300 rounded-lg px-2 py-1.5 text-sm font-bold text-gray-700 bg-white">{[100000, 300000, 500000, 1000000].map(v => <option key={v} value={v}>見込粗利 {MK.man(v)}以上</option>)}</select></div>}>
                        {(!allWorks || !allWorks.length) && oppTab === 'works' ? <MkEmpty>案件管理DB（公開作品）が読み込まれていません</MkEmpty> : oppList.length === 0 ? <MkEmpty>該当する案件はありません</MkEmpty> : <>
                            <div className="flex flex-wrap gap-2 mb-3">{Object.keys(MK.OPP).map(k => { const n = oppList.filter(o => o.kind === k).length; return n ? <span key={k} className={`text-sm font-bold px-3 py-1 rounded-full ${MK.OPP[k].cls}`}>{MK.OPP[k].l} {n}件</span> : null; })}</div>
                            {view === 'chart' ? <>
                                <MkHBars labels={oppShown.map(o => `${MK.short(o.name, 14)}（${o.whenLabel}）`)} sets={oppSets} />
                                <div className="mt-4 space-y-2">{oppShown.map(o => <div key={o.key} className="text-sm bg-gray-50 rounded-xl px-4 py-2.5 flex flex-col md:flex-row md:items-center gap-1 md:gap-4"><span className={`text-xs font-bold px-2 py-0.5 rounded shrink-0 self-start ${MK.OPP[o.kind].cls}`}>{MK.OPP[o.kind].l}</span><b className="text-gray-800 md:w-64 shrink-0 truncate">{o.name}</b><span className="text-gray-500 md:w-44 shrink-0 truncate">{o.who}／{o.div === 'その他' ? '事業部なし' : o.div}</span><span className="text-gray-600">{o.basis}</span></div>)}</div>
                            </> : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-base">
                                        <thead><tr className="bg-gray-100 text-gray-600 text-sm">{['種類', '作品・案件', '配給・クライアント', '担当', '時期', '見込粗利'].map((h, i) => <th key={i} className={`px-4 py-3 font-bold whitespace-nowrap ${i === 5 ? 'text-right' : 'text-left'}`}>{h}</th>)}</tr></thead>
                                        <tbody>{oppShown.map(o => (
                                            <React.Fragment key={o.key}>
                                                <tr className="border-t border-gray-200">
                                                    <td className="px-4 pt-3 pb-1 whitespace-nowrap"><span className={`text-xs font-bold px-2 py-0.5 rounded ${MK.OPP[o.kind].cls}`}>{MK.OPP[o.kind].l}</span></td>
                                                    <td className="px-4 pt-3 pb-1 font-bold text-gray-800">{o.name}</td>
                                                    <td className="px-4 pt-3 pb-1 text-gray-700">{o.who}</td>
                                                    <td className="px-4 pt-3 pb-1 whitespace-nowrap">{o.div === 'その他' ? '事業部なし' : o.div}</td>
                                                    <td className="px-4 pt-3 pb-1 whitespace-nowrap">{o.whenLabel}{o.days != null && <span className="text-xs text-gray-400 ml-1">{o.days >= 0 ? `あと${o.days}日` : '公開済み'}</span>}</td>
                                                    <td className="px-4 pt-3 pb-1 text-right font-mono font-bold whitespace-nowrap">{MK.man(o.exp)}</td>
                                                </tr>
                                                <tr><td colSpan={6} className="px-4 pb-3 pt-0 text-sm text-gray-500">根拠：{o.basis}</td></tr>
                                            </React.Fragment>
                                        ))}</tbody>
                                    </table>
                                </div>
                            )}
                            {oppList.length > 10 && <div className="mt-4 text-center"><button onClick={() => setOppAll(!oppAll)} className="px-5 py-2.5 rounded-xl border border-gray-300 bg-white text-base font-bold text-gray-700 hover:bg-gray-50">{oppAll ? '上位10件だけ表示する' : `残り${oppList.length - 10}件も表示する`}</button></div>}
                        </>}
                        <p className="text-sm text-gray-500 mt-3">見つけ方：①案件管理DBに見込額があるのに未登録の作品 ②過去に2本以上担当した配給会社の公開予定作品で、案件がまだ1件もないもの（見込は1本あたり粗利の中央値）③直近6か月のうち4か月以上計上のある案件で、今月・来月分が未登録のもの。②は同じ作品名の重複をまとめ、管理番号か作品名・案件名で登録が見つかった作品は除いています。</p>
                    </MkSection>

                    <MkMore title={`注意が必要な案件（粗利マイナス・粗利率10%未満・広告で粗利率40%以上）${W.risky.length ? ' ' + W.risky.length + '件' : ''}`}>
                        {W.risky.length === 0 ? <MkEmpty>該当する案件はありません</MkEmpty> : (() => {
                            const R = { minus: { l: '粗利マイナス', c: '#E5484D', cls: 'bg-red-50 text-red-700' }, low: { l: '粗利率10%未満', c: '#F59E0B', cls: 'bg-amber-50 text-amber-700' }, adhigh: { l: '広告で粗利率40%以上', c: '#8B5CF6', cls: 'bg-violet-50 text-violet-700' } };
                            const list = W.risky.slice(0, 30);
                            const counts = Object.keys(R).map(k => ({ k, n: W.risky.filter(p => p.reason === k).length })).filter(x => x.n);
                            return <>
                                <div className="flex flex-wrap gap-2">{counts.map(x => <span key={x.k} className={`text-sm font-bold px-3 py-1 rounded-full ${R[x.k].cls}`}>{R[x.k].l} {x.n}件</span>)}</div>
                                {view === 'chart' ? <MkRateChart rows={list.slice(0, 20).map(p => ({ label: `${MK.short(MK.workName(p, worksMaster), 10)}｜${MK.short(p.title, 10)}`, rate: p.sales > 0 ? p.profit / p.sales : -1, color: R[p.reason].c }))} /> : (
                                    <MkTable head={['理由', '作品', '案件名', 'クライアント', '事業部', '職種', '売上', '粗利', '粗利率']} align={['l', 'l', 'l', 'l', 'l', 'l', 'r', 'r', 'r']}
                                        rows={list.map(p => ({ cells: [<span className={`text-xs font-bold px-2 py-0.5 rounded ${R[p.reason].cls}`}>{R[p.reason].l}</span>, MK.workName(p, worksMaster), MK.short(p.title, 24), p.client || '—', MK.divOf(p), String(p.job || '').trim() || '—', MK.man(p.sales), <b className={p.profit < 0 ? 'text-red-600' : ''}>{MK.man(p.profit)}</b>, MK.pct(p.profit, p.sales)] }))} />
                                )}
                                {view === 'chart' && list.length > 20 && <p className="text-sm text-gray-500">グラフは上位20件です。すべて見るには「表」に切り替えてください。</p>}
                            </>;
                        })()}
                        <p className="text-sm text-gray-500">対象：①粗利がマイナスの案件 ②売上100万円以上で粗利率10%未満の案件 ③職種が広告で粗利率40%以上の案件（媒体費などの原価の計上漏れがないかの確認用）。「部門原価」は粗利がマイナスになるのが通常のため対象外。①②は粗利率の低い順、③は高い順、最大30件。</p>
                    </MkMore>
                    <MkNext id="mk_works" onGo={onGo} />
                </div>
            );
        }

        // ④ 販管費（要点）
        function MkExpTrend({ budget, actual, parts, ly, proj, closedN, view }) {
            const isAct = (m) => m < closedN;
            const data = useMemo(() => {
                const ds = [];
                (parts || [{ label: '販管費（実績）', data: actual, color: '#64748b' }]).forEach((p, k) => ds.push({ type: 'bar', label: p.label, data: p.data.map((v, m) => isAct(m) ? v : null), backgroundColor: p.color, stack: 'a', borderRadius: 3, order: 3 + k }));
                if (proj) ds.push({ type: 'bar', label: '見込（このペース）', data: proj.map((v, m) => isAct(m) ? null : v), backgroundColor: 'rgba(148,163,184,0.35)', borderColor: '#94a3b8', borderWidth: 1, borderDash: [4, 3], stack: 'a', borderRadius: 3, order: 9 });
                ds.push({ type: 'line', label: '予算', data: budget, borderColor: '#E5484D', borderDash: [6, 4], borderWidth: 2, pointRadius: 3, fill: false, stack: 'b', order: 1 });
                if (ly) ds.push({ type: 'line', label: '昨年', data: ly, borderColor: '#a78bfa', borderWidth: 2, pointRadius: 2, fill: false, stack: 'c', order: 2 });
                return { labels: MONTH_LABELS, datasets: ds };
            }, [budget, actual, parts, ly, proj, closedN]);
            const options = useMemo(() => ({ plugins: { legend: { labels: { font: { size: 13 } } }, tooltip: { callbacks: { label: c => c.raw == null ? null : `${c.dataset.label} ${MK.man(c.raw)}` } } }, scales: { x: { stacked: true }, y: { stacked: true, ticks: mkTicksMan } } }), []);
            const act = MONTH_LABELS.map((_, m) => isAct(m) ? (actual[m] || 0) : null);
            const recent = act.slice(Math.max(0, closedN - 3), closedN).filter(v => v != null);
            const avg = recent.length ? MK.sum(recent) / recent.length : 0;
            const maxM = act.reduce((b, v, m) => v != null && (b < 0 || v > act[b]) ? m : b, -1);
            const avgB = closedN ? MK.sum(budget.slice(0, closedN)) / closedN : 0, avgA = closedN ? MK.sum(act.slice(0, closedN)) / closedN : 0;
            return (
                <>
                    {closedN > 0 && <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
                        <div className="rounded-xl bg-gray-50 px-4 py-3"><div className="text-sm text-gray-500">月平均（3月〜{MONTH_LABELS[closedN - 1]}）</div><div className="text-2xl font-extrabold text-gray-800">{MK.man(avgA)}</div><div className="text-sm text-gray-500">予算の月平均 {MK.man(avgB)}</div></div>
                        <div className="rounded-xl bg-gray-50 px-4 py-3"><div className="text-sm text-gray-500">直近3か月の月平均</div><div className="text-2xl font-extrabold text-gray-800">{MK.man(avg)}</div><div className="text-sm text-gray-500">期の平均より {MK.manS(avg - avgA)}</div></div>
                        <div className="rounded-xl bg-gray-50 px-4 py-3"><div className="text-sm text-gray-500">いちばん多かった月</div><div className="text-2xl font-extrabold text-gray-800">{maxM >= 0 ? MONTH_LABELS[maxM] : '—'}<span className="text-lg ml-2">{maxM >= 0 ? MK.man(act[maxM]) : ''}</span></div><div className="text-sm text-gray-500">{maxM >= 0 ? `予算 ${MK.man(budget[maxM])}（${MK.manS(act[maxM] - budget[maxM])}）` : ''}</div></div>
                    </div>}
                    {view === 'chart' ? <div className="h-96"><ChartComponent type="bar" data={data} options={options} /></div> : (() => {
                        let ca = 0, cb = 0;
                        const head = ['月', ''].concat(parts ? parts.map(p => p.label.replace('（実績）', '')) : []).concat(['販管費', '予算', '予算との差']).concat(ly ? ['昨年', '昨年との差'] : []).concat(['累計', '累計の予算']);
                        return <MkTable head={head} align={head.map((_, i) => i < 2 ? 'l' : 'r')}
                            rows={MONTH_LABELS.map((l, m) => { const v = isAct(m) ? (actual[m] || 0) : (proj ? proj[m] : null); if (v != null) ca += v; cb += budget[m]; const d = v == null ? null : v - budget[m]; return { cls: m === closedN ? 'border-t-2 border-gray-400' : '', cells: [l, <span className={`text-xs px-2 py-0.5 rounded ${isAct(m) ? 'bg-gray-100 text-gray-600' : 'bg-slate-100 text-slate-500'}`}>{isAct(m) ? '実績' : '見込'}</span>].concat(parts ? parts.map(p => isAct(m) ? MK.man(p.data[m]) : '—') : []).concat([v == null ? '—' : <b>{MK.man(v)}</b>, MK.man(budget[m]), d == null ? '—' : <span className={d <= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(d)}</span>]).concat(ly ? [MK.man(ly[m]), v == null ? '—' : <span className={v - ly[m] <= 0 ? 'text-sky-600' : 'text-red-600'}>{MK.manS(v - ly[m])}</span>] : []).concat([MK.man(ca), MK.man(cb)]) }; })} />;
                    })()}
                </>
            );
        }

        function MkExpensePage({ execPL, execItems, execPrev, monthlyData, view, setView, onGo, onOpenDetail, onOpenSettings }) {
            const model = useMemo(() => execPL ? EXP.build(execPL, execItems, -1) : null, [execPL, execItems]);
            const fallback = useMemo(() => {
                if (model) return null;
                const E = MK.kArr(monthlyData.expenses), EB = MK.kArr(monthlyData.expensesBudget);
                let last = -1; E.forEach((v, i) => { if (v) last = i; });
                return { E, EB, last };
            }, [model, monthlyData]);

            if (!model) {
                const f = fallback, N = f.last + 1;
                const a = MK.sum(f.E.slice(0, N)), b = MK.sum(f.EB.slice(0, N));
                return (
                    <div className="space-y-6">
                        <MkHead id="mk_exp" />
                        <div className="rounded-2xl border-2 border-amber-300 bg-amber-50 p-6 text-base text-amber-900">
                            科目ごとの販管費（経営陣用の販管費予実表）が読み込まれていないため、合計だけを表示しています。右上の「連携」で経営陣用の連携URLと合言葉を設定してください。
                            <button onClick={onOpenSettings} className="ml-3 px-4 py-2 rounded-lg bg-amber-600 text-white text-sm font-bold">連携を設定する</button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <MkBig label={N > 0 ? `${MONTH_LABELS[f.last]}の販管費` : '販管費'} value={N > 0 ? MK.man(f.E[f.last]) : '—'} tone={N > 0 && f.E[f.last] > f.EB[f.last] ? 'bad' : 'good'} sub={N > 0 && <>予算 {MK.man(f.EB[f.last])}　差 {MK.manS(f.E[f.last] - f.EB[f.last])}</>} />
                            <MkBig label="累計の販管費" value={MK.man(a)} tone={a > b ? 'bad' : 'good'} sub={<>予算 {MK.man(b)}　差 {MK.manS(a - b)}</>} />
                        </div>
                        <MkSection title="月ごとの推移" lead="棒が実績、赤の点線が予算です。">
                            <MkExpTrend budget={f.EB} actual={f.E} closedN={N} view={view || 'chart'} />
                        </MkSection>
                        <MkNext id="mk_exp" onGo={onGo} />
                    </div>
                );
            }

            const { FY, asOf, totals, accounts, issues, N } = model;
            const T = totals.all, mon = FY[asOf];
            const over = accounts.filter(a => !a.reserve && a.diffYTD > 0).sort((a, b) => b.diffYTD - a.diffYTD);
            const top = over.slice(0, 5);
            const under = accounts.filter(a => !a.reserve && a.diffYTD < 0).sort((a, b) => a.diffYTD - b.diffYTD).slice(0, 3);
            const moves = issues.filter(i => ['surge', 'new', 'stopped'].includes(i.kind)).slice(0, 5);
            const dataIssues = issues.filter(i => i.level === 'red');
            const mainOf = (a) => a.items.filter(i => i.ytd > 0).sort((x, y) => y.ytd - x.ytd).slice(0, 2).map(i => MK.short(i.name, 16)).join('、');
            const XO = MK.outlook(...(() => { const E = MK.expSeries(execPL, execItems, monthlyData); return [E.A, E.Bfc, E.closed, { seed: 777, budgetFY: MK.sum(E.B) }]; })());
            const LE = MK.lyExp(execPrev);
            const dCur = T.cur - T.curBudget, dYTD = T.actualYTD - T.budgetYTD, dFY = XO.landing - T.budgetFY;
            const lines = [
                <span>{mon}の販管費は <b>{MK.man(T.cur)}</b>。予算より <b className={dCur <= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.man(Math.abs(dCur))}{dCur <= 0 ? '少なく' : '多く'}</b> なっています（予算比 {MK.pct(T.cur, T.curBudget)}）。</span>,
                <span>3月〜{mon}の累計は予算に対して <b className={dYTD <= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.manS(dYTD)}</b>、このペースだと通期では予算に対して <b className={dFY <= 0 ? 'text-sky-700' : 'text-red-700'}>{MK.manS(dFY)}</b> の見込みです。</span>,
                <span>{top.length ? <>まず確認したいのは、予算を超えている <b>{top.map(a => a.name).slice(0, 3).join('・')}</b> です。</> : '予算を超えている科目はありません。'}</span>
            ];
            const chartRows = top.map(a => ({ label: a.name, value: a.diffYTD }));
            return (
                <div className="space-y-6">
                    <MkHead id="mk_exp" view={view} setView={setView} right={<span className="text-sm text-gray-500 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">{mon}まで締め済み</span>} />
                    <MkVerdict tone={dYTD <= 0 && dFY <= 0 ? 'good' : dFY <= 0 ? 'warn' : 'bad'} lines={lines} />
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <MkBig label={`${mon}の販管費`} value={MK.man(T.cur)} tone={dCur <= 0 ? 'good' : 'bad'} sub={<>予算 {MK.man(T.curBudget)}　差 <b>{MK.manS(dCur)}</b></>} />
                        <MkBig label={`累計（3月〜${mon}）`} value={MK.man(T.actualYTD)} tone={dYTD <= 0 ? 'good' : 'bad'} sub={<>予算 {MK.man(T.budgetYTD)}　差 <b>{MK.manS(dYTD)}</b></>} />
                        <MkBig label="通期の見込（このペース）" value={'約' + MK.man(XO.landing)} tone={dFY <= 0 ? 'good' : 'bad'} sub={<>通期予算 {MK.man(T.budgetFY)}　差 <b>{MK.manS(dFY)}</b></>} />
                    </div>

                    <MkSection title="月ごとの推移" lead={`棒が実績（濃い色＝人件費、薄い色＝経費）、灰色の棒が${FY[asOf + 1] ? FY[asOf + 1] + '以降の' : ''}見込（このペース）、赤の点線が予算${LE ? '、紫の線が昨年' : ''}です。`}>
                        <MkExpTrend budget={T.budget} actual={T.actual.map(v => v || 0)} closedN={N} ly={LE} proj={XO.proj}
                            parts={[{ label: '人件費（実績）', data: totals.personnel.actual.map(v => v || 0), color: '#1e3a8a' }, { label: '経費（実績）', data: FY.map((_, m) => ((T.actual[m] || 0) - (totals.personnel.actual[m] || 0))), color: '#60a5fa' }]} view={view} />
                    </MkSection>

                    <MkSection title="まず確認する科目（予算を超えている順）" lead={`3月〜${mon}の累計で、予算を超えている金額の大きい科目です（最大5つ）。`}>
                        {top.length === 0 ? <MkEmpty>予算を超えている科目はありません</MkEmpty> : view === 'chart' ? <MkDiffChart rows={chartRows} goodPositive={false} /> : (
                            <MkTable head={['科目', '累計の実績', '累計の予算', '超えている額', '予算比', '通期の見込（直近3か月のペース）', '主な中身']} align={['l', 'r', 'r', 'r', 'r', 'r', 'l']}
                                rows={top.map(a => ({ cells: [<b>{a.name}</b>, MK.man(a.actualYTD), MK.man(a.budgetYTD), <b className="text-red-600">{MK.manS(a.diffYTD)}</b>, XF.pct(a.ratioYTD), <span className={a.forecastPace > a.budgetFY ? 'text-red-600' : ''}>{MK.man(a.forecastPace)}</span>, <span className="text-sm text-gray-600">{mainOf(a) || '—'}</span>] }))} />
                        )}
                        {view === 'chart' && top.length > 0 && <div className="mt-4 space-y-2">{top.map(a => <div key={a.key} className="text-base bg-gray-50 rounded-xl px-4 py-3 flex flex-col md:flex-row md:items-center gap-1 md:gap-4"><b className="text-gray-800 md:w-48 shrink-0">{a.name}</b><span className="text-gray-600 text-sm">予算比 {XF.pct(a.ratioYTD)}{mainOf(a) && <>　主な中身：{mainOf(a)}</>}</span></div>)}</div>}
                    </MkSection>

                    <MkSection title={`${mon}の気になる動き`} lead="急に増えた・初めて出た・毎月出ていたのに止まった項目です（最大5件）。">
                        {moves.length === 0 ? <MkEmpty>目立った動きはありません</MkEmpty> : (
                            <ul className="space-y-2">{moves.map((m, i) => <li key={i} className="rounded-xl border border-amber-200 bg-amber-50/60 px-4 py-3"><div className="text-sm font-bold text-amber-700">{m.title}</div><div className="text-base text-gray-800 mt-0.5">{m.detail}</div></li>)}</ul>
                        )}
                    </MkSection>

                    <MkMore title="人件費と経費の内訳">
                        {view === 'chart' ? <MkPairBars labels={['人件費', '経費']} sets={[{ label: `累計の実績（3月〜${mon}）`, data: [totals.personnel.actualYTD, totals.other.actualYTD], color: '#1e3a8a' }, { label: '累計の予算', data: [totals.personnel.budgetYTD, totals.other.budgetYTD], color: '#cbd5e1' }]} /> : <MkTable head={['区分', `${mon}`, `${mon}の予算`, '累計', '累計の予算', '累計の差', '通期の見込（直近3か月のペース）']} align={['l', 'r', 'r', 'r', 'r', 'r', 'r']}
                            rows={[['人件費', totals.personnel], ['経費', totals.other], ['合計', T]].map(([n, t]) => ({ cls: n === '合計' ? 'bg-gray-50 font-bold' : '', cells: [n, MK.man(t.cur), MK.man(t.curBudget), MK.man(t.actualYTD), MK.man(t.budgetYTD), <span className={t.actualYTD - t.budgetYTD > 0 ? 'text-red-600' : 'text-sky-600'}>{MK.manS(t.actualYTD - t.budgetYTD)}</span>, MK.man(t.forecastPace)] }))} />}
                    </MkMore>
                    {under.length > 0 && <MkMore title="予算より少なく済んでいる科目">
                        {view === 'chart' ? <MkDiffChart rows={under.map(a => ({ label: a.name, value: a.diffYTD }))} goodPositive={false} /> : <MkTable head={['科目', '累計の実績', '累計の予算', '差']} align={['l', 'r', 'r', 'r']} rows={under.map(a => ({ cells: [a.name, MK.man(a.actualYTD), MK.man(a.budgetYTD), <b className="text-sky-600">{MK.manS(a.diffYTD)}</b>] }))} />}
                    </MkMore>}
                    {dataIssues.length > 0 && <MkMore title={`データの不整合 ${dataIssues.length}件（経理での確認用）`}>
                        <ul className="space-y-2">{dataIssues.slice(0, 10).map((m, i) => <li key={i} className="text-sm text-gray-700"><b className="text-red-600">{m.title}</b>：{m.detail}</li>)}</ul>
                    </MkMore>}
                    <div className="flex flex-col sm:flex-row justify-between items-start gap-3">
                        <button onClick={onOpenDetail} className="px-6 py-3 rounded-xl bg-white border border-gray-300 text-gray-700 text-base font-bold hover:bg-gray-50">すべての科目・項目を見る（販管費の詳細）</button>
                        <MkNext id="mk_exp" onGo={onGo} />
                    </div>
                </div>
            );
        }

        // 週次の記録（今週のまとめの数字を週ごとに残す）
        const SNAP = {
            ymd: (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
            parse: (s) => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; },
            monday: (d) => { const x = MK.day0(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; },
            label: (key) => { const d = SNAP.parse(key); return d ? `${d.getMonth() + 1}/${d.getDate()}（月）の週` : key; },
            LOCAL: 'gaie_weekly_snapshots',
            loadLocal: () => { try { return JSON.parse(localStorage.getItem(SNAP.LOCAL) || '{}') || {}; } catch (e) { return {}; } },
            saveLocal: (map) => { try { localStorage.setItem(SNAP.LOCAL, JSON.stringify(map)); } catch (e) {} },
            // live=true は今の数字そのまま。false は asOf 時点に登録済みだった案件だけで当時を再現する
            build: (c, asOf, live) => {
                const S = MK.sum;
                const curIdx = Math.max(0, Math.min(11, asOf.getFullYear() * 12 + asOf.getMonth() - FC.periodStartKey(c.currentPeriod)));
                const endT = MK.day0(asOf).getTime(), baseT = endT - 7 * 86400000;
                const list = live ? (c.projectList || []) : (c.projectList || []).filter(p => { const t = MK.regTime(p); return t == null || t <= endT; });
                let A;
                if (live) A = MK.kArr(c.monthlyData.actualProfit);
                else { A = Array(12).fill(0); list.forEach(p => { const i = Utils.getFiscalMonthIndex(p.date); if (i >= 0) A[i] += p.profit || 0; }); }
                const B = MK.kArr(c.monthlyData.budgetProfit), L = MK.kArr(c.monthlyData.lastYearProfit);
                const fresh = list.filter(p => { const t = MK.regTime(p); return t != null && t > baseT && t <= endT; });
                const big = fresh.filter(p => (p.profit || 0) >= 1000000).sort((a, b) => b.profit - a.profit);
                const E0 = MK.expSeries(c.execPL, c.execItems, c.monthlyData);
                const closed = live ? E0.closed : Math.min(E0.closed, curIdx);
                const E = { ...E0, A: E0.A.map((v, m) => m < closed ? v : 0), closed };
                const PL = MK.pl(A, B, curIdx, E);
                let over = [];
                if (c.execPL && closed > 0) over = EXP.build(c.execPL, c.execItems, closed - 1).accounts.filter(a => !a.reserve && a.diffYTD > 0).sort((a, b) => b.diffYTD - a.diffYTD).map(a => a.name);
                const LE = MK.lyExp(c.execPrev);
                const r = (v) => v == null ? null : Math.round(v);
                return {
                    v: 1, week: SNAP.ymd(SNAP.monday(asOf)), asOf: SNAP.ymd(asOf), src: live ? 'live' : 'rebuilt', curIdx,
                    m: { a: r(A[curIdx]), b: r(B[curIdx]), l: r(L[curIdx]), week: r(S(fresh.filter(p => Utils.getFiscalMonthIndex(p.date) === curIdx).map(p => p.profit))) },
                    o: { op: r(PL.opLanding), opB: r(PL.opBudget), opProb: PL.opProb, p: r(PL.P.landing), pB: r(PL.P.budgetFY), pProb: PL.P.prob, x: r(PL.X.landing), xB: r(PL.X.budgetFY), lyOP: LE ? r(S(L) - S(LE)) : null },
                    w: { n: big.length, sum: r(S(big.map(p => p.profit))), top: big[0] ? MK.short(MK.workName(big[0], c.worksMaster), 18) : '', topP: big[0] ? r(big[0].profit) : 0 },
                    x: { eA: r(S(E.A.slice(0, closed))), eB: r(S(E.B.slice(0, closed))), eN: closed, over: over.slice(0, 3), overN: over.length }
                };
            },
            tones: (s) => {
                const eD = s.x.eA - s.x.eB;
                return {
                    m: MK.toneOfRatio(s.m.a, s.m.b),
                    o: s.o.opProb != null ? MK.probInfo(s.o.opProb).tone : (s.o.op >= s.o.opB ? 'good' : 'bad'),
                    w: s.w.n ? 'good' : 'gray',
                    x: s.x.eB <= 0 ? 'gray' : eD <= 0 ? 'good' : eD <= s.x.eB * 0.03 ? 'warn' : 'bad'
                };
            }
        };

        function MkSignal({ tone, label }) {
            const c = { good: '#00ADE7', warn: '#F59E0B', bad: '#E5484D', gray: '#94A3B8' }[tone] || '#94A3B8';
            return <span className="inline-flex items-center gap-2 text-sm font-bold px-3 py-1 rounded-full" style={{ background: c + '1A', color: c }}><span className="w-2.5 h-2.5 rounded-full" style={{ background: c }}></span>{label}</span>;
        }

        function MkVsPrev({ cur, prev, unit = 'man', lowGood, label = '先週' }) {
            if (prev == null || cur == null) return <div className="mt-3 text-sm text-gray-400">{label}の記録はありません</div>;
            const d = cur - prev, ok = lowGood ? d <= 0 : d >= 0;
            const txt = unit === 'count' ? `${d > 0 ? '+' : d < 0 ? '▲' : '±'}${Math.abs(d)}件` : unit === 'pt' ? `${d > 0 ? '+' : d < 0 ? '▲' : '±'}${Math.abs(Math.round(d * 100))}ポイント` : MK.manS(d);
            const pv = unit === 'count' ? prev + '件' : unit === 'pt' ? MK.probText(prev) : unit === 'manS' ? MK.manS(prev) : MK.man(prev);
            return <div className="mt-3 flex items-center gap-2 text-sm bg-gray-50 rounded-lg px-3 py-2"><span className="text-gray-500">{label}</span><span className="text-gray-700">{pv}</span><span className="text-gray-400">→</span><b className={d === 0 ? 'text-gray-600' : ok ? 'text-sky-700' : 'text-red-700'}>{txt}</b></div>;
        }

        function MkHomePage({ reports, snaps, liveSnap, currentPeriod, onGo, onSaveNow, saveInfo, view, setView }) {
            const [sel, setSel] = useState(null);
            const weeks = useMemo(() => Object.keys(snaps).sort().reverse(), [snaps]);
            const rows = weeks.slice(0, 26).map(k => snaps[k]);
            const chart = useMemo(() => {
                const rs = rows.slice().reverse();
                return { labels: rs.map(s => { const d = SNAP.parse(s.week); return `${d.getMonth() + 1}/${d.getDate()}`; }), datasets: [
                    { type: 'line', label: '粗利の年間見込', data: rs.map(s => s.o.p), borderColor: '#f97316', backgroundColor: '#f97316', borderWidth: 3, pointRadius: 4, fill: false },
                    { type: 'line', label: '粗利の予算', data: rs.map(s => s.o.pB), borderColor: '#fdba74', borderDash: [5, 4], borderWidth: 2, pointRadius: 0, fill: false },
                    { type: 'line', label: '営業利益の年間見込', data: rs.map(s => s.o.op), borderColor: '#00ADE7', backgroundColor: '#00ADE7', borderWidth: 3, pointRadius: 4, fill: false },
                    { type: 'line', label: '営業利益の予算', data: rs.map(s => s.o.opB), borderColor: '#7dd3fc', borderDash: [5, 4], borderWidth: 2, pointRadius: 0, fill: false }
                ] };
            }, [snaps]);
            const S = sel && snaps[sel] ? snaps[sel] : liveSnap;
            if (!S) return <MkEmpty>データを読み込み中です</MkEmpty>;
            const isLive = S === liveSnap;
            const prevKey = (() => { const d = SNAP.parse(S.week); if (!d) return null; d.setDate(d.getDate() - 7); return SNAP.ymd(d); })();
            const P = snaps[prevKey] || null;
            const T = SNAP.tones(S);
            const lbl = { good: '順調', warn: '注意', bad: '要確認', gray: 'データなし' };
            const mL = MONTH_LABELS[S.curIdx], sameMonth = P && P.curIdx === S.curIdx;
            const asOfD = SNAP.parse(S.asOf), WD = ['日', '月', '火', '水', '木', '金', '土'];
            const cards = [
                { id: 'mk_month', tone: T.m, title: `${mL}の粗利`, value: MK.man(S.m.a),
                  text: <>予算比 <b>{MK.pct(S.m.a, S.m.b)}</b>（{MK.manS(S.m.a - S.m.b)}）・昨対 <b>{MK.pct(S.m.a, S.m.l)}</b><br />この1週間で <b>{MK.manS(S.m.week)}</b></>,
                  vs: sameMonth ? <MkVsPrev cur={S.m.a} prev={P.m.a} label={`先週時点の${mL}`} /> : <div className="mt-3 text-sm text-gray-400">{P ? `先週は${MONTH_LABELS[P.curIdx]}の数字（${MK.man(P.m.a)}）のため比べられません` : '先週の記録はありません'}</div> },
                { id: 'mk_outlook', tone: T.o, title: '年間の営業利益（このままのペース）', value: '約' + MK.man(S.o.op),
                  text: <>予算 {MK.man(S.o.opB)} に対して <b>{MK.manS(S.o.op - S.o.opB)}</b>{S.o.opProb != null && <>・達成の確率 <b>{MK.probText(S.o.opProb)}</b></>}{S.o.lyOP != null && <><br />昨年 {MK.man(S.o.lyOP)} に対して <b>{MK.manS(S.o.op - S.o.lyOP)}</b></>}<br />粗利 約{MK.man(S.o.p)}（{MK.manS(S.o.p - S.o.pB)}）・販管費 約{MK.man(S.o.x)}</>,
                  vs: <MkVsPrev cur={S.o.op} prev={P ? P.o.op : null} label="先週の見込" /> },
                { id: 'mk_works', tone: T.w, title: 'この1週間に登録された大きな案件', value: S.w.n + '件', valueTone: 'gray',
                  text: S.w.n ? <>粗利100万円以上・合計 <b>{MK.man(S.w.sum)}</b><br />最大：{S.w.top}（{MK.man(S.w.topP)}）</> : <>粗利100万円以上の新しい案件はありません</>,
                  vs: <MkVsPrev cur={S.w.n} prev={P ? P.w.n : null} unit="count" label="先週" /> },
                { id: 'mk_exp', tone: T.x, title: S.x.eN > 0 ? `販管費（3月〜${MONTH_LABELS[S.x.eN - 1]}の累計）の予算差` : '販管費', value: MK.manS(S.x.eA - S.x.eB),
                  text: <>累計 {MK.man(S.x.eA)}／予算 {MK.man(S.x.eB)}<br />{S.x.overN ? <>予算超過：{S.x.over.slice(0, 2).join('・')}{S.x.overN > 2 ? ` ほか${S.x.overN - 2}科目` : ''}</> : '予算を超えている科目はありません'}</>,
                  vs: P && P.x.eN !== S.x.eN ? <div className="mt-3 text-sm text-gray-500 bg-gray-50 rounded-lg px-3 py-2">先週は{P.x.eN ? MONTH_LABELS[P.x.eN - 1] : '—'}まで締め（予算差 {MK.manS(P.x.eA - P.x.eB)}）。{MONTH_LABELS[S.x.eN - 1]}分が締まりました</div> : <MkVsPrev cur={S.x.eA - S.x.eB} prev={P ? P.x.eA - P.x.eB : null} unit="manS" lowGood label="先週の予算差" /> }
            ];
            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-end justify-between gap-3">
                        <div>
                            <p className="text-base text-gray-500">{isLive ? <>{asOfD.getFullYear()}年{asOfD.getMonth() + 1}月{asOfD.getDate()}日（{WD[asOfD.getDay()]}）時点・{currentPeriod}期</> : <>{S.src === 'rebuilt' ? '登録日から再現した数字' : `${S.savedAt || S.asOf} に記録した数字`}</>}</p>
                            <h2 className="text-3xl font-extrabold text-gray-800 mt-1">{isLive ? '今週のまとめ' : `${SNAP.label(S.week)}のまとめ`}</h2>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <select value={sel || ''} onChange={e => setSel(e.target.value || null)} className="border border-gray-300 rounded-lg px-3 py-2 text-base font-bold text-gray-700 bg-white">
                                <option value="">今週（最新の数字）</option>
                                {weeks.filter(k => k !== liveSnap.week).map(k => <option key={k} value={k}>{SNAP.label(k)}{snaps[k].src === 'rebuilt' ? '（再現）' : ''}</option>)}
                            </select>
                            {!isLive && <button onClick={() => setSel(null)} className="px-4 py-2 rounded-lg bg-[#00ADE7] text-white text-sm font-bold">今週に戻る</button>}
                        </div>

        function Waterfall({ steps, budget, height = 300 }) {
            const W = 1000, ML = 56, MR = 16, MT = 42, MB = 54;
            const IW = W - ML - MR, IH = height - MT - MB;
            let run = 0;
            const bars = steps.map(st => {
                if (st.type === 'total') return { ...st, y0: 0, y1: run, val: run };
                if (st.type === 'diff') { const v = run - budget; return { ...st, y0: Math.min(budget, run), y1: Math.max(budget, run), val: v }; }
                const y0 = run, y1 = run + st.value; run = y1; return { ...st, y0, y1, val: st.value };
            });
            const top = Math.max(run, budget, ...bars.map(b => b.y1)) * 1.12 || 1;
            const bw = IW / bars.length;
            const Y = (v) => MT + IH - (v / top) * IH;
            const bY = Y(budget);
            return (
                <svg viewBox={`0 0 ${W} ${height}`} width="100%" style={{ display: 'block' }}>
                    {[0, 0.25, 0.5, 0.75, 1].map(f => <line key={f} x1={ML} x2={W - MR} y1={MT + IH * f} y2={MT + IH * f} stroke="#f1f5f9" strokeWidth="1" />)}
                    <line x1={ML} x2={W - MR} y1={MT + IH} y2={MT + IH} stroke="#cbd5e1" strokeWidth="1" />
                    {budget > 0 && <g>
                        <line x1={ML} x2={W - MR} y1={bY} y2={bY} stroke="#475569" strokeWidth="1.5" strokeDasharray="6 4" />
                        <line x1={ML} x2={ML + 22} y1={14} y2={14} stroke="#475569" strokeWidth="1.5" strokeDasharray="6 4" />
                        <text x={ML + 28} y={18} textAnchor="start" fontSize="12" fontWeight="700" fill="#475569">期予算 {fmtM(budget)}</text>
                    </g>}
                    {bars.map((b, i) => {
                        const x = ML + i * bw + bw * 0.16, w = bw * 0.68;
                        const yTop = Y(Math.max(b.y0, b.y1)), h = Math.max(2, Math.abs(Y(b.y0) - Y(b.y1)));
                        const zero = Math.abs(b.val) < 1;
                        return (
                            <g key={i}>
                                {i > 0 && bars[i - 1].type !== 'total' && b.type === 'add' && <line x1={ML + (i - 1) * bw + bw * 0.84} x2={x} y1={Y(b.y0)} y2={Y(b.y0)} stroke="#cbd5e1" strokeWidth="1" strokeDasharray="3 3" />}
                                <rect x={x} y={yTop} width={w} height={h} fill={b.color} rx="2" opacity={zero ? 0.25 : 1} />
                                <text x={x + w / 2} y={yTop - 7} textAnchor="middle" fontSize="13" fontWeight="700" fill={b.type === 'diff' ? b.color : '#1e293b'}>
                                    {b.type === 'add' && b.val > 0 && i > 0 ? '+' : b.type === 'diff' ? (b.val >= 0 ? '+' : '−') : ''}{fmtM(Math.abs(b.val))}
                                </text>
                                <text x={x + w / 2} y={MT + IH + 18} textAnchor="middle" fontSize="11.5" fontWeight={b.type === 'total' ? 700 : 500} fill="#475569">{b.label}</text>
                                {b.sub && <text x={x + w / 2} y={MT + IH + 33} textAnchor="middle" fontSize="10" fill="#94a3b8">{b.sub}</text>}
                            </g>
                        );
                    })}
                </svg>
            );
        }

        function MonthlyLanding({ act, fc, budget, curIdx, height = 300 }) {
            const W = 1000, ML = 62, MR = 16, MT = 26, MB = 42;
            const IW = W - ML - MR, IH = height - MT - MB;
            const hasBud = budget.some(v => v > 0);
            const top = Math.max(...act.map((v, i) => v + fc[i]), ...(hasBud ? budget : [0]), 1) * 1.15;
            const bw = IW / 12;
            const Y = (v) => MT + IH - (v / top) * IH;
            const cx = (i) => ML + i * bw + bw / 2;
            const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => top * f);
            const line = budget.map((v, i) => `${i === 0 ? 'M' : 'L'}${cx(i)},${Y(v)}`).join(' ');
            return (
                <svg viewBox={`0 0 ${W} ${height}`} width="100%" style={{ display: 'block' }}>
                    {ticks.map((t, i) => <g key={i}>

                    </g>}

            );

        function ForecastPage({ allWorks, releaseSchedule, projectList, lastYearProjectList, historicalData, monthlyData, divisionMonthlyData, worksMaster, currentPeriod }) {
            const [sub, setSub] = useState('summary');

            const fc = useMemo(() => {
